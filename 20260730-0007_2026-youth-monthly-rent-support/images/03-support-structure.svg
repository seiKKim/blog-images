<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <rect width="1080" height="720" fill="#F4F7FB"/>
  <rect width="1080" height="150" fill="#1B5FA6"/>
  <text x="60" y="95" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold"
        font-size="52" fill="#ffffff">국토부 청년월세 지원 구조</text>

  <!-- 계산식 카드 3개 -->
  <g font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
    <rect x="60" y="230" width="270" height="230" rx="20" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
    <text x="195" y="300" text-anchor="middle" font-size="30" fill="#5B6B7C">월 최대</text>
    <text x="195" y="375" text-anchor="middle" font-size="72" font-weight="bold" fill="#1B5FA6">20</text>
    <text x="195" y="425" text-anchor="middle" font-size="34" font-weight="bold" fill="#1a1a1a">만원</text>

    <text x="360" y="360" text-anchor="middle" font-size="70" font-weight="bold" fill="#243B6B">×</text>

    <rect x="405" y="230" width="270" height="230" rx="20" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
    <text x="540" y="300" text-anchor="middle" font-size="30" fill="#5B6B7C">최대</text>
    <text x="540" y="375" text-anchor="middle" font-size="72" font-weight="bold" fill="#1B5FA6">24</text>
    <text x="540" y="425" text-anchor="middle" font-size="34" font-weight="bold" fill="#1a1a1a">개월(회)</text>

    <text x="705" y="360" text-anchor="middle" font-size="70" font-weight="bold" fill="#243B6B">=</text>

    <rect x="750" y="230" width="270" height="230" rx="20" fill="#1B5FA6"/>
    <text x="885" y="300" text-anchor="middle" font-size="30" fill="#E8EEF5">총 한도</text>
    <text x="885" y="380" text-anchor="middle" font-size="76" font-weight="bold" fill="#FFD23F">480</text>
    <text x="885" y="430" text-anchor="middle" font-size="34" font-weight="bold" fill="#ffffff">만원</text>
  </g>

  <!-- 주의 문구 -->
  <rect x="60" y="510" width="960" height="120" rx="16" fill="#FFF6DC" stroke="#F0D67A"/>
  <text x="90" y="560" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="30" font-weight="bold" fill="#7A5A00">실제 납부 월세 범위 내에서만 지원</text>
  <text x="90" y="605" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="28" fill="#7A5A00">월세 20만원 미만이면 낸 만큼만 · 보증금·관리비는 제외</text>

  <text x="60" y="685" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="28" fill="#5B6B7C">대상: 만 19~34세 무주택 청년 · 부모와 별도 거주</text>
</svg>
