<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#FBF3EE"/>

  <!-- 상단 색띠 + 제목 -->
  <rect width="1080" height="210" fill="#D62A22"/>
  <text x="60" y="112" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">처서 매직, 통계로 무너지다</text>
  <text x="60" y="170" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="38" fill="#FFE9B0">과거 10년 vs 최근 10년 (전국 평균)</text>

  <!-- 범례 -->
  <rect x="60" y="258" width="30" height="30" rx="6" fill="#93A7C4"/>
  <text x="102" y="282" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="32" fill="#3A4A5E">과거 10년</text>
  <rect x="330" y="258" width="30" height="30" rx="6" fill="#E23B3B"/>
  <text x="372" y="282" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="32" fill="#3A4A5E">최근 10년</text>

  <!-- 차트 기준선 -->
  <line x1="120" y1="880" x2="1020" y2="880" stroke="#D6C5BC" stroke-width="3"/>

  <!-- 폭염일수 그룹 (기준: 880, 18.3일=440px 높이, 최상단 y=440) -->
  <!-- 과거 8.3일 -> 200px -->
  <rect x="180" y="680" width="150" height="200" rx="10" fill="#93A7C4"/>
  <text x="255" y="650" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="42" fill="#3A4A5E" text-anchor="middle">8.3일</text>
  <!-- 최근 18.3일 -> 440px (top y=440) -->
  <rect x="350" y="440" width="150" height="440" rx="10" fill="#E23B3B"/>
  <text x="425" y="410" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="46" fill="#C21F1F" text-anchor="middle">18.3일</text>
  <text x="340" y="945" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="42" fill="#2B2F36" text-anchor="middle">폭염일수</text>
  <rect x="255" y="985" width="170" height="58" rx="29" fill="#FFD23F"/>
  <text x="340" y="1025" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="36" fill="#7A1010" text-anchor="middle">약 2.2배</text>

  <!-- 열대야 그룹 -->
  <!-- 과거 4.1일 -> 99px -->
  <rect x="620" y="781" width="150" height="99" rx="10" fill="#93A7C4"/>
  <text x="695" y="751" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="42" fill="#3A4A5E" text-anchor="middle">4.1일</text>
  <!-- 최근 12.2일 -> 293px (top y=587) -->
  <rect x="790" y="587" width="150" height="293" rx="10" fill="#E23B3B"/>
  <text x="865" y="557" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="46" fill="#C21F1F" text-anchor="middle">12.2일</text>
  <text x="780" y="945" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="42" fill="#2B2F36" text-anchor="middle">열대야 일수</text>
  <rect x="695" y="985" width="170" height="58" rx="29" fill="#FFD23F"/>
  <text x="780" y="1025" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="36" fill="#7A1010" text-anchor="middle">약 3배</text>

  <!-- 포인트 박스 -->
  <rect x="60" y="1090" width="960" height="150" rx="20" fill="#ffffff" stroke="#E7D4CB" stroke-width="2"/>
  <text x="95" y="1155" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="40" fill="#D62A22">폭염 시작 10~30일 빨라지고, 종료 약 10일 늦춰짐</text>
  <text x="95" y="1208" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="36" fill="#3A4A5E">처서·입추 지나도 더위가 안 꺾이는 게 뉴노멀</text>

  <!-- 하단 출처 띠 -->
  <rect x="0" y="1270" width="1080" height="80" fill="#EFE1D9"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#7A6156">출처: 기상청 분석(2026년 7월 24일 보도 기준)</text>
</svg>
