<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243B6B"/>
      <stop offset="1" stop-color="#1a2c50"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="950" cy="170" r="270" fill="#ffffff" opacity="0.07"/>
  <circle cx="110" cy="990" r="210" fill="#ffffff" opacity="0.06"/>

  <!-- 카테고리 뱃지 -->
  <rect x="80" y="86" rx="34" ry="34" width="220" height="68" fill="#FFD23F"/>
  <text x="190" y="132" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="36" fill="#1a1a1a" text-anchor="middle">금융·재테크</text>

  <!-- 서브 카피 -->
  <text x="80" y="278" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="54" fill="#E8EEF5">2026 해외여행 트래블카드</text>
  <text x="80" y="346" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="54" fill="#E8EEF5">5종 완벽 비교</text>

  <!-- 메인 카피 -->
  <text x="80" y="510" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="128" fill="#ffffff">상황별로</text>
  <text x="80" y="648" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="128" fill="#FFD23F">유리한 카드는?</text>

  <!-- 카드 5종 칩 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="34" fill="#ffffff">
    <rect x="80" y="708" rx="24" width="230" height="66" fill="#ffffff" opacity="0.14"/>
    <text x="195" y="750" text-anchor="middle">트래블월렛</text>
    <rect x="326" y="708" rx="24" width="270" height="66" fill="#ffffff" opacity="0.14"/>
    <text x="461" y="750" text-anchor="middle">하나 트래블로그</text>
    <rect x="612" y="708" rx="24" width="272" height="66" fill="#ffffff" opacity="0.14"/>
    <text x="748" y="750" text-anchor="middle">신한 SOL트래블</text>
    <rect x="80" y="786" rx="24" width="190" height="66" fill="#ffffff" opacity="0.14"/>
    <text x="175" y="828" text-anchor="middle">토스뱅크</text>
    <rect x="286" y="786" rx="24" width="240" height="66" fill="#ffffff" opacity="0.14"/>
    <text x="406" y="828" text-anchor="middle">KB 트래블러스</text>
  </g>

  <!-- 디테일 강조 박스 -->
  <rect x="80" y="892" rx="20" ry="20" width="920" height="104" fill="#FFD23F"/>
  <text x="110" y="958" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="46" fill="#1a2c50">토스뱅크 8/11부터 수수료 면제 환원</text>

  <!-- 채널 -->
  <text x="80" y="1042" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="32" fill="#E8EEF5" opacity="0.9">blog.naver.com/trip_chocho</text>
</svg>
