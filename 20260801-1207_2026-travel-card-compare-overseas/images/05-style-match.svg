<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="170" fill="#243B6B"/>
  <text x="60" y="86" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="52" fill="#ffffff">여행 스타일별 추천 카드</text>
  <text x="60" y="134" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="30" fill="#E8EEF5">내 여행 패턴에 맞춰 고르는 게 관건 (한 장이 최고는 없음)</text>

  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <!-- 행 1 카드결제형 -->
    <rect x="60" y="210" width="960" height="150" rx="18" fill="#ffffff" stroke="#D6E0EC"/>
    <rect x="60" y="210" width="14" height="150" rx="7" fill="#243B6B"/>
    <text x="104" y="272" font-size="40" font-weight="bold" fill="#1a1a1a">카드결제형</text>
    <text x="104" y="322" font-size="28" fill="#5B6B7C">일본·미국·유럽 결제 위주</text>
    <text x="990" y="288" font-size="34" font-weight="bold" fill="#243B6B" text-anchor="end">5장 모두 비슷</text>
    <text x="990" y="330" font-size="28" fill="#5B6B7C" text-anchor="end">부가 혜택으로 선택</text>

    <!-- 행 2 ATM 인출형 -->
    <rect x="60" y="384" width="960" height="150" rx="18" fill="#ffffff" stroke="#D6E0EC"/>
    <rect x="60" y="384" width="14" height="150" rx="7" fill="#243B6B"/>
    <text x="104" y="446" font-size="40" font-weight="bold" fill="#1a1a1a">ATM 인출형</text>
    <text x="104" y="496" font-size="28" fill="#5B6B7C">현금 많이 뽑는 여행</text>
    <text x="990" y="446" font-size="34" font-weight="bold" fill="#243B6B" text-anchor="end">하나 · 신한 · KB</text>
    <text x="990" y="500" font-size="28" fill="#5B6B7C" text-anchor="end">무료 인출 한도가 큼</text>

    <!-- 행 3 소수통화형 -->
    <rect x="60" y="558" width="960" height="150" rx="18" fill="#ffffff" stroke="#D6E0EC"/>
    <rect x="60" y="558" width="14" height="150" rx="7" fill="#243B6B"/>
    <text x="104" y="620" font-size="40" font-weight="bold" fill="#1a1a1a">소수 통화형</text>
    <text x="104" y="670" font-size="28" fill="#5B6B7C">VND·THB·TWD 등 동남아·중화권</text>
    <text x="990" y="620" font-size="34" font-weight="bold" fill="#243B6B" text-anchor="end">하나(58종) · KB(56종)</text>
    <text x="990" y="674" font-size="28" fill="#5B6B7C" text-anchor="end">무료 통화가 넓음</text>

    <!-- 행 4 국내겸용형 -->
    <rect x="60" y="732" width="960" height="150" rx="18" fill="#ffffff" stroke="#D6E0EC"/>
    <rect x="60" y="732" width="14" height="150" rx="7" fill="#243B6B"/>
    <text x="104" y="794" font-size="40" font-weight="bold" fill="#1a1a1a">국내 겸용형</text>
    <text x="104" y="844" font-size="28" fill="#5B6B7C">국내에서도 체크카드로 사용</text>
    <text x="990" y="794" font-size="34" font-weight="bold" fill="#243B6B" text-anchor="end">신한 · KB · 토스</text>
    <text x="990" y="848" font-size="28" fill="#5B6B7C" text-anchor="end">라운지·캐시백·국내 할인</text>

    <!-- 행 5 재환전형 -->
    <rect x="60" y="906" width="960" height="150" rx="18" fill="#ffffff" stroke="#D6E0EC"/>
    <rect x="60" y="906" width="14" height="150" rx="7" fill="#243B6B"/>
    <text x="104" y="968" font-size="40" font-weight="bold" fill="#1a1a1a">재환전형</text>
    <text x="104" y="1018" font-size="28" fill="#5B6B7C">남은 외화 되팔 가능성 큼</text>
    <text x="990" y="968" font-size="34" font-weight="bold" fill="#243B6B" text-anchor="end">토스뱅크 외화통장</text>
    <text x="990" y="1022" font-size="28" fill="#5B6B7C" text-anchor="end">되팔기 0원</text>
  </g>

  <!-- 무게중심 요약 -->
  <rect x="60" y="1088" width="960" height="150" rx="18" fill="#243B6B"/>
  <text x="90" y="1148" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" font-weight="bold" fill="#FFD23F">무게중심 요약</text>
  <text x="90" y="1196" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" fill="#ffffff">소수통화·ATM = 하나·KB·신한 / 재환전·심플 = 토스·트래블월렛</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" fill="#5B6B7C">출처: 각 카드사·핀테크 공식 공지 (상황별 비교 · 발급 전 재확인)</text>
</svg>
