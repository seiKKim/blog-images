<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="170" fill="#243B6B"/>
  <text x="60" y="86" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="52" fill="#ffffff">카드 5종 조건 한눈에 비교</text>
  <text x="60" y="134" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="30" fill="#E8EEF5">2026년 상반기~8월 초 기준 · ATM 무료 한도 · 무료환전 통화</text>

  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <!-- 헤더 -->
    <text x="60" y="238" font-size="34" font-weight="bold" fill="#243B6B">ATM 무료 인출 한도</text>

    <!-- 하나 -->
    <text x="60" y="300" font-size="34" font-weight="bold" fill="#1a1a1a">하나 트래블로그</text>
    <rect x="60" y="316" width="900" height="46" rx="10" fill="#e3e9f2"/>
    <rect x="60" y="316" width="900" height="46" rx="10" fill="#243B6B"/>
    <text x="944" y="350" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="end">일 6,000·월 10,000달러</text>

    <!-- 신한 -->
    <text x="60" y="418" font-size="34" font-weight="bold" fill="#1a1a1a">신한 SOL트래블</text>
    <rect x="60" y="434" width="900" height="46" rx="10" fill="#e3e9f2"/>
    <rect x="60" y="434" width="720" height="46" rx="10" fill="#3a5691"/>
    <text x="720" y="468" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="end">월 10,000달러</text>

    <!-- KB -->
    <text x="60" y="536" font-size="34" font-weight="bold" fill="#1a1a1a">KB 트래블러스</text>
    <rect x="60" y="552" width="900" height="46" rx="10" fill="#e3e9f2"/>
    <rect x="60" y="552" width="620" height="46" rx="10" fill="#3a5691"/>
    <text x="674" y="586" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="end">월 10회</text>

    <!-- 토스 -->
    <text x="60" y="654" font-size="34" font-weight="bold" fill="#1a1a1a">토스뱅크</text>
    <rect x="60" y="670" width="900" height="46" rx="10" fill="#e3e9f2"/>
    <rect x="60" y="670" width="300" height="46" rx="10" fill="#7d90b5"/>
    <text x="374" y="704" font-size="32" font-weight="bold" fill="#5B6B7C" text-anchor="start">월 5회 또는 700달러</text>

    <!-- 트래블월렛 -->
    <text x="60" y="772" font-size="34" font-weight="bold" fill="#1a1a1a">트래블월렛</text>
    <rect x="60" y="788" width="900" height="46" rx="10" fill="#e3e9f2"/>
    <rect x="60" y="788" width="200" height="46" rx="10" fill="#7d90b5"/>
    <text x="274" y="822" font-size="32" font-weight="bold" fill="#5B6B7C" text-anchor="start">월 500달러</text>
  </g>

  <!-- 무료환전 통화 수 -->
  <line x1="60" y1="878" x2="1020" y2="878" stroke="#D6E0EC" stroke-width="2"/>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <text x="60" y="938" font-size="34" font-weight="bold" fill="#243B6B">무료환전 통화 수 (넓을수록 소수 통화 유리)</text>

    <rect x="60" y="978" width="216" height="150" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="168" y="1032" font-size="52" font-weight="bold" fill="#243B6B" text-anchor="middle">58종</text>
    <text x="168" y="1090" font-size="28" fill="#5B6B7C" text-anchor="middle">하나</text>
    <text x="168" y="1122" font-size="24" fill="#8894a5" text-anchor="middle">상시4+이벤트54</text>

    <rect x="292" y="978" width="216" height="150" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="400" y="1032" font-size="52" font-weight="bold" fill="#243B6B" text-anchor="middle">56종</text>
    <text x="400" y="1090" font-size="28" fill="#5B6B7C" text-anchor="middle">KB</text>

    <rect x="524" y="978" width="216" height="150" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="632" y="1032" font-size="46" font-weight="bold" fill="#243B6B" text-anchor="middle">30~42종</text>
    <text x="632" y="1090" font-size="28" fill="#5B6B7C" text-anchor="middle">신한</text>

    <rect x="756" y="978" width="130" height="150" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="821" y="1032" font-size="46" font-weight="bold" fill="#243B6B" text-anchor="middle">17종</text>
    <text x="821" y="1090" font-size="28" fill="#5B6B7C" text-anchor="middle">토스</text>

    <rect x="902" y="978" width="118" height="150" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="961" y="1024" font-size="36" font-weight="bold" fill="#243B6B" text-anchor="middle">주요</text>
    <text x="961" y="1064" font-size="36" font-weight="bold" fill="#243B6B" text-anchor="middle">3종</text>
    <text x="961" y="1108" font-size="24" fill="#5B6B7C" text-anchor="middle">트래블월렛</text>
  </g>

  <!-- 재환전 메모 -->
  <rect x="60" y="1160" width="960" height="72" rx="14" fill="#FFF6D6" stroke="#FFD23F"/>
  <text x="90" y="1206" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" font-weight="bold" fill="#8a6d00">재환전(되팔기) 0원은 토스뱅크 외화통장 · 트래블월렛·하나는 약 1%</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" fill="#5B6B7C">출처: 각 카드사·핀테크 공식 공지 (2026년 상반기~8월 초 기준, 발급 전 재확인)</text>
</svg>
