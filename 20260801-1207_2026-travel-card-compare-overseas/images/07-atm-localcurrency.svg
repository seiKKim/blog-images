<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <rect width="1080" height="720" fill="#F4F7FB"/>
  <rect width="1080" height="150" fill="#243B6B"/>
  <text x="60" y="96" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="52" fill="#ffffff">해외 ATM 인출 시 선택 화면</text>

  <!-- ATM 화면 목업 -->
  <rect x="90" y="200" width="470" height="470" rx="20" fill="#243B6B"/>
  <rect x="118" y="228" width="414" height="414" rx="10" fill="#0f1a33"/>
  <text x="325" y="290" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" font-weight="bold" fill="#E8EEF5" text-anchor="middle">Select conversion</text>

  <!-- with conversion 거절 -->
  <rect x="150" y="330" width="350" height="96" rx="12" fill="#3a2530" stroke="#E23B3B" stroke-width="3"/>
  <text x="325" y="368" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="bold" fill="#ff8a8a" text-anchor="middle">With conversion</text>
  <text x="325" y="404" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" fill="#ffb3b3" text-anchor="middle">(원화 KRW 표시) — 거절</text>

  <!-- without conversion 선택 -->
  <rect x="150" y="446" width="350" height="96" rx="12" fill="#13332a" stroke="#37d29a" stroke-width="3"/>
  <text x="325" y="484" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" font-weight="bold" fill="#7ff0c4" text-anchor="middle">Without conversion</text>
  <text x="325" y="520" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" fill="#a9f5d6" text-anchor="middle">(현지 통화) — 선택 ✓</text>

  <text x="325" y="602" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="24" fill="#8fa2c4" text-anchor="middle">"with conversion(원화)" 옵션은 거절</text>

  <!-- 설명 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <text x="610" y="272" font-size="40" font-weight="bold" fill="#1a1a1a">ATM도 현지통화로</text>
    <rect x="610" y="300" width="400" height="4" fill="#FFD23F"/>
    <text x="610" y="368" font-size="30" fill="#3a4757">· 크게 한 번에 뽑아 횟수 절약</text>
    <text x="610" y="426" font-size="30" fill="#3a4757">· 무료 한도가 금액인지</text>
    <text x="628" y="466" font-size="30" fill="#3a4757">횟수인지 확인</text>
    <text x="610" y="524" font-size="30" fill="#3a4757">· 현지 ATM 운영사 수수료는</text>
    <text x="628" y="564" font-size="30" fill="#3a4757">카드 면제와 별개 (은행 직영 유리)</text>
    <rect x="610" y="600" width="400" height="60" rx="14" fill="#FFF6D6" stroke="#FFD23F"/>
    <text x="632" y="640" font-size="27" font-weight="bold" fill="#8a6d00">한도 부족 시 2장 병행 전략</text>
  </g>
</svg>
