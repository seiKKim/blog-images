<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <rect width="1080" height="720" fill="#F4F7FB"/>
  <rect width="1080" height="160" fill="#1B5FA6"/>
  <text x="60" y="95" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="52" fill="#ffffff">서큘레이터 + 에어컨 병행</text>
  <text x="60" y="140" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="30" fill="#E8EEF5">냉방 효율 높여 하절기 몫 오래 쓰기</text>

  <!-- 효과 1 -->
  <rect x="60" y="210" width="460" height="230" rx="20" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
  <text x="290" y="290" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" fill="#5B6B7C" text-anchor="middle">실내 온도</text>
  <text x="290" y="375" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="80" fill="#1B5FA6" text-anchor="middle">1~3℃ ↓</text>
  <text x="290" y="420" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" fill="#5B6B7C" text-anchor="middle">공기 순환으로 체감온도 하락</text>

  <!-- 효과 2 -->
  <rect x="560" y="210" width="460" height="230" rx="20" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
  <text x="790" y="290" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" fill="#5B6B7C" text-anchor="middle">냉방비 절감</text>
  <text x="790" y="375" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="80" fill="#E8722C" text-anchor="middle">10~30%</text>
  <text x="790" y="420" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" fill="#5B6B7C" text-anchor="middle">에어컨과 함께 쓸 때</text>

  <!-- 팁 박스 -->
  <rect x="60" y="470" width="960" height="130" rx="16" fill="#1B5FA6"/>
  <text x="90" y="525" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="36" fill="#FFD23F">에어컨 25~26℃ 설정 + 서큘레이터 병행</text>
  <text x="90" y="575" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#ffffff">필터 월 1~2회 청소 · 실내외 온도차 6~8℃ 이내 권장</text>

  <rect x="0" y="640" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="690" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" fill="#5B6B7C">※ 1~3℃·10~30%는 매체·유통사 주장치(공식 통계 아님)</text>
</svg>
