<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B5FA6"/>
      <stop offset="1" stop-color="#134A85"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 장식: 태양(폭염) -->
  <circle cx="930" cy="180" r="120" fill="#FFD23F" opacity="0.95"/>
  <g stroke="#FFD23F" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="930" y1="20" x2="930" y2="50"/>
    <line x1="1060" y1="180" x2="1030" y2="180"/>
    <line x1="1022" y1="88" x2="1000" y2="110"/>
    <line x1="1022" y1="272" x2="1000" y2="250"/>
    <line x1="838" y1="88" x2="860" y2="110"/>
  </g>
  <circle cx="120" cy="1000" r="200" fill="#ffffff" opacity="0.06"/>

  <!-- 카테고리 뱃지 -->
  <rect x="80" y="88" rx="34" ry="34" width="200" height="68" fill="#FFD23F"/>
  <text x="180" y="134" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="36" fill="#1a1a1a" text-anchor="middle">정부지원금</text>

  <!-- 서브 카피 -->
  <text x="80" y="330" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="56" fill="#E8EEF5">2026 에너지바우처 여름 냉방</text>

  <!-- 메인 카피 -->
  <text x="80" y="470" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="96" fill="#ffffff">1인 <tspan fill="#FFD23F">40,700원</tspan></text>
  <text x="80" y="580" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="96" fill="#ffffff">부터 전기요금 차감</text>

  <!-- 금액 표 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <rect x="80" y="640" width="920" height="230" rx="24" fill="#ffffff" opacity="0.14"/>
    <text x="120" y="712" font-size="42" font-weight="bold" fill="#ffffff">여름(냉방) 몫</text>
    <text x="960" y="712" font-size="34" fill="#E8EEF5" text-anchor="end">가구원수별</text>
    <line x1="120" y1="734" x2="960" y2="734" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    <text x="120" y="800" font-size="40" font-weight="bold" fill="#ffffff">1인 <tspan fill="#FFD23F">40,700</tspan></text>
    <text x="540" y="800" font-size="40" font-weight="bold" fill="#ffffff">2인 <tspan fill="#FFD23F">58,800</tspan></text>
    <text x="120" y="852" font-size="40" font-weight="bold" fill="#ffffff">3인 <tspan fill="#FFD23F">75,800</tspan></text>
    <text x="540" y="852" font-size="40" font-weight="bold" fill="#ffffff">4인+ <tspan fill="#FFD23F">102,000</tspan></text>
  </g>

  <!-- 디테일 -->
  <text x="80" y="945" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="44" fill="#ffffff">신청 6/15~12/31 · 여름사용 7/1~9/30</text>

  <!-- 채널 -->
  <text x="80" y="1015" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="32" fill="#E8EEF5" opacity="0.9">blog.naver.com/trip_chocho</text>
</svg>
