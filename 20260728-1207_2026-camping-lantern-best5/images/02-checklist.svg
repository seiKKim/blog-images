<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#f3f6fb"/>

  <!-- header -->
  <rect width="1080" height="210" fill="#14294a"/>
  <rect x="64" y="60" rx="26" ry="26" width="210" height="56" fill="#ffcf6b"/>
  <text x="169" y="99" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="30" fill="#14294a" text-anchor="middle">고르는 법</text>
  <text x="64" y="180" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#ffffff">이 6가지만 보면 됩니다</text>

  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <!-- row template: card + number + title + detail -->
    <!-- 1 -->
    <rect x="60" y="262" width="960" height="150" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <circle cx="140" cy="337" r="42" fill="#14294a"/>
    <text x="140" y="352" font-size="42" font-weight="bold" fill="#ffcf6b" text-anchor="middle">1</text>
    <text x="212" y="322" font-size="42" font-weight="bold" fill="#14294a">밝기(루멘)</text>
    <text x="212" y="378" font-size="34" fill="#5b6b7c">무드 50~200 / 텐트 100~300 / 메인 500 안팎↑</text>

    <!-- 2 -->
    <rect x="60" y="428" width="960" height="150" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <circle cx="140" cy="503" r="42" fill="#14294a"/>
    <text x="140" y="518" font-size="42" font-weight="bold" fill="#ffcf6b" text-anchor="middle">2</text>
    <text x="212" y="488" font-size="42" font-weight="bold" fill="#14294a">방수·방진(IP)</text>
    <text x="212" y="544" font-size="34" fill="#5b6b7c">오토캠핑 IPX4~5 / 물가·낚시 IP67 이상</text>

    <!-- 3 -->
    <rect x="60" y="594" width="960" height="150" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <circle cx="140" cy="669" r="42" fill="#14294a"/>
    <text x="140" y="684" font-size="42" font-weight="bold" fill="#ffcf6b" text-anchor="middle">3</text>
    <text x="212" y="654" font-size="42" font-weight="bold" fill="#14294a">충전방식</text>
    <text x="212" y="710" font-size="34" fill="#5b6b7c">USB-C 충전식이 유지비·편의 우위</text>

    <!-- 4 -->
    <rect x="60" y="760" width="960" height="150" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <circle cx="140" cy="835" r="42" fill="#14294a"/>
    <text x="140" y="850" font-size="42" font-weight="bold" fill="#ffcf6b" text-anchor="middle">4</text>
    <text x="212" y="820" font-size="42" font-weight="bold" fill="#14294a">색온도</text>
    <text x="212" y="876" font-size="34" fill="#5b6b7c">감성캠핑은 웜톤(전구색, 약 3000K)</text>

    <!-- 5 -->
    <rect x="60" y="926" width="960" height="150" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <circle cx="140" cy="1001" r="42" fill="#14294a"/>
    <text x="140" y="1016" font-size="42" font-weight="bold" fill="#ffcf6b" text-anchor="middle">5</text>
    <text x="212" y="986" font-size="42" font-weight="bold" fill="#14294a">무게</text>
    <text x="212" y="1042" font-size="34" fill="#5b6b7c">백패킹은 100g 안팎 소형 충전식이 정석</text>

    <!-- 6 -->
    <rect x="60" y="1092" width="960" height="150" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <circle cx="140" cy="1167" r="42" fill="#14294a"/>
    <text x="140" y="1182" font-size="42" font-weight="bold" fill="#ffcf6b" text-anchor="middle">6</text>
    <text x="212" y="1152" font-size="42" font-weight="bold" fill="#14294a">부가 기능</text>
    <text x="212" y="1208" font-size="34" fill="#5b6b7c">디밍·보조배터리 겸용·마그네틱·잔량표시</text>
  </g>

  <!-- footer -->
  <rect x="0" y="1276" width="1080" height="74" fill="#e8eef5"/>
  <text x="64" y="1324" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#5b6b7c">blog.naver.com/trip_chocho · 2026 여름 캠핑 랜턴</text>
</svg>
