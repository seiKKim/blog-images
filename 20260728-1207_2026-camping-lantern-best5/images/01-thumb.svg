<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b33"/>
      <stop offset="0.55" stop-color="#14294a"/>
      <stop offset="1" stop-color="#1c2f4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd67a" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#f0a94a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f0a94a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="150" cy="120" r="3" opacity="0.8"/>
    <circle cx="320" cy="80" r="2" opacity="0.6"/>
    <circle cx="520" cy="140" r="2.5" opacity="0.7"/>
    <circle cx="760" cy="90" r="2" opacity="0.5"/>
    <circle cx="930" cy="160" r="3" opacity="0.7"/>
    <circle cx="1000" cy="70" r="2" opacity="0.5"/>
    <circle cx="230" cy="210" r="2" opacity="0.5"/>
    <circle cx="640" cy="60" r="2" opacity="0.6"/>
  </g>

  <!-- string light swag with warm dots -->
  <path d="M40 230 Q300 340 540 250 Q780 160 1040 260" stroke="#3a4d6e" stroke-width="4" fill="none"/>
  <g fill="#ffcf6b">
    <circle cx="120" cy="272" r="10"/><circle cx="230" cy="292" r="10"/>
    <circle cx="345" cy="290" r="10"/><circle cx="460" cy="268" r="10"/>
    <circle cx="575" cy="250" r="10"/><circle cx="690" cy="230" r="10"/>
    <circle cx="805" cy="222" r="10"/><circle cx="920" cy="232" r="10"/>
  </g>
  <g fill="#ffe6a8" opacity="0.35">
    <circle cx="120" cy="272" r="22"/><circle cx="230" cy="292" r="22"/>
    <circle cx="345" cy="290" r="22"/><circle cx="460" cy="268" r="22"/>
    <circle cx="575" cy="250" r="22"/><circle cx="690" cy="230" r="22"/>
    <circle cx="805" cy="222" r="22"/><circle cx="920" cy="232" r="22"/>
  </g>

  <!-- big warm glow near main copy -->
  <ellipse cx="840" cy="720" rx="360" ry="360" fill="url(#glow)"/>

  <!-- lantern icon bottom-right -->
  <g transform="translate(792,560)">
    <rect x="30" y="-18" width="16" height="20" rx="4" fill="#c9d4e6"/>
    <rect x="0" y="0" width="76" height="14" rx="7" fill="#c9d4e6"/>
    <rect x="8" y="14" width="60" height="150" rx="24" fill="#1f3457"/>
    <rect x="18" y="26" width="40" height="126" rx="18" fill="#ffd67a"/>
    <rect x="18" y="26" width="40" height="126" rx="18" fill="#ffe6a8" opacity="0.5"/>
    <rect x="18" y="164" width="40" height="14" rx="6" fill="#c9d4e6"/>
  </g>

  <!-- category badge -->
  <rect x="64" y="86" rx="34" ry="34" width="286" height="70" fill="#ffcf6b"/>
  <text x="207" y="133" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="36" fill="#14294a" text-anchor="middle">감성캠핑·차박</text>

  <!-- sub copy -->
  <text x="64" y="430" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#e8eef5">2026 여름밤 캠핑</text>

  <!-- main copy -->
  <text x="60" y="590" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="150" fill="#ffffff">랜턴 추천</text>
  <text x="60" y="750" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="150" fill="#ffcf6b">BEST 5</text>

  <!-- detail bar -->
  <rect x="64" y="838" rx="20" ry="20" width="720" height="120" fill="#ffffff" opacity="0.12"/>
  <text x="92" y="898" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="42" fill="#ffffff">루멘·방수·색온도·안전</text>
  <text x="92" y="940" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="34" fill="#e8eef5">차박·백패킹·낚시까지 용도별 정리</text>

  <!-- handle -->
  <text x="64" y="1028" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="32" fill="#e8eef5" opacity="0.85">blog.naver.com/trip_chocho</text>
</svg>
