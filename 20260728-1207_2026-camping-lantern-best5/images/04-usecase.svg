<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#f3f6fb"/>

  <!-- header -->
  <rect width="1080" height="210" fill="#14294a"/>
  <rect x="64" y="60" rx="26" ry="26" width="200" height="56" fill="#ffcf6b"/>
  <text x="164" y="99" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="30" fill="#14294a" text-anchor="middle">용도별</text>
  <text x="64" y="180" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="56" fill="#ffffff">상황별 랜턴 추천 매핑</text>

  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <!-- 감성 -->
    <rect x="60" y="262" width="960" height="184" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <text x="104" y="332" font-size="42" font-weight="bold" fill="#14294a">감성캠핑</text>
    <text x="104" y="392" font-size="33" fill="#5b6b7c">웜톤 무드등 + 스트링라이트 + 감성 가스랜턴</text>
    <text x="104" y="430" font-size="31" fill="#ffab2e" font-weight="bold">레이어드 조명이 2026 트렌드</text>

    <!-- 차박 -->
    <rect x="60" y="462" width="960" height="184" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <text x="104" y="532" font-size="42" font-weight="bold" fill="#14294a">차박</text>
    <text x="104" y="592" font-size="33" fill="#5b6b7c">USB-C 충전식 + 보조배터리 겸용 소형 LED</text>
    <text x="104" y="630" font-size="31" fill="#5b6b7c">마그네틱·걸이로 실내등, 생활방수(IPX4~)</text>

    <!-- 백패킹 -->
    <rect x="60" y="662" width="960" height="184" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <text x="104" y="732" font-size="42" font-weight="bold" fill="#14294a">백패킹</text>
    <text x="104" y="792" font-size="33" fill="#5b6b7c">무게가 최우선 — 소형·경량 충전식</text>
    <text x="104" y="830" font-size="31" fill="#5b6b7c">루메나 M3(약 95g) · 골제로 마이크로</text>

    <!-- 낚시 -->
    <rect x="60" y="862" width="960" height="184" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <text x="104" y="932" font-size="42" font-weight="bold" fill="#14294a">낚시</text>
    <text x="104" y="992" font-size="33" fill="#5b6b7c">물가 환경 — 방수등급 IP67 이상</text>
    <text x="104" y="1030" font-size="31" fill="#5b6b7c">걸이·집중광 되는 방수 충전식 기준</text>

    <!-- 비상 -->
    <rect x="60" y="1062" width="960" height="184" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
    <text x="104" y="1132" font-size="42" font-weight="bold" fill="#14294a">비상·정전</text>
    <text x="104" y="1192" font-size="33" fill="#5b6b7c">즉시 교체 가능한 건전지식</text>
    <text x="104" y="1230" font-size="31" fill="#5b6b7c">또는 폰 충전 되는 보조배터리 겸용 충전식</text>
  </g>

  <!-- footer -->
  <rect x="0" y="1284" width="1080" height="66" fill="#e8eef5"/>
  <text x="64" y="1326" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="29" fill="#5b6b7c">blog.naver.com/trip_chocho · 감성캠핑·차박 랜턴 가이드</text>
</svg>
