<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <rect width="1080" height="720" fill="#F1F9FA"/>
  <!-- 상단 색띠 -->
  <rect width="1080" height="170" fill="#0E7C8C"/>
  <text x="60" y="105" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold"
        font-size="58" fill="#ffffff">실내 습도로 보는 곰팡이 위험</text>

  <!-- 게이지 바 -->
  <g>
    <rect x="60" y="270" width="320" height="90" rx="14" fill="#3EBFCF"/>
    <rect x="380" y="270" width="320" height="90" fill="#57C878"/>
    <rect x="700" y="270" width="200" height="90" fill="#F0A93B"/>
    <rect x="900" y="270" width="120" height="90" rx="14" fill="#E15252"/>
  </g>
  <!-- 눈금 라벨 -->
  <g font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="34" fill="#3A4B52" text-anchor="middle" font-weight="bold">
    <text x="380" y="410">40%</text>
    <text x="700" y="410">60%</text>
    <text x="900" y="410">80%</text>
  </g>

  <!-- 쾌적 구간 표시 -->
  <text x="540" y="240" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold"
        font-size="38" fill="#1F8A53" text-anchor="middle">쾌적 40~60%</text>
  <path d="M420 250 L420 270 M660 250 L660 270" stroke="#1F8A53" stroke-width="4"/>
  <line x1="420" y1="250" x2="660" y2="250" stroke="#1F8A53" stroke-width="4"/>

  <!-- 구간 설명 카드 -->
  <g font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
    <rect x="60" y="470" width="300" height="180" rx="18" fill="#ffffff" stroke="#CFE6E9"/>
    <text x="90" y="540" font-size="40" font-weight="bold" fill="#1F8A53">40~60%</text>
    <text x="90" y="595" font-size="34" fill="#3A4B52">사람이 쾌적하게</text>
    <text x="90" y="635" font-size="34" fill="#3A4B52">느끼는 습도</text>

    <rect x="390" y="470" width="300" height="180" rx="18" fill="#ffffff" stroke="#CFE6E9"/>
    <text x="420" y="540" font-size="40" font-weight="bold" fill="#E8722C">60% 초과</text>
    <text x="420" y="595" font-size="34" fill="#3A4B52">곰팡이 번식</text>
    <text x="420" y="635" font-size="34" fill="#3A4B52">시작</text>

    <rect x="720" y="470" width="300" height="180" rx="18" fill="#ffffff" stroke="#CFE6E9"/>
    <text x="750" y="540" font-size="40" font-weight="bold" fill="#E15252">80% 이상</text>
    <text x="750" y="595" font-size="34" fill="#3A4B52">번식 속도가</text>
    <text x="750" y="635" font-size="34" fill="#3A4B52">폭발적 증가</text>
  </g>

  <!-- 출처 띠 -->
  <text x="60" y="702" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="28" fill="#7C8B92">본문 기준 · 습도-곰팡이 관계는 일반적으로 알려진 내용</text>
</svg>
