<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="200" fill="#243B6B"/>
  <text x="60" y="105" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#ffffff">ISA 종류 한눈에</text>
  <text x="60" y="165" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="38" fill="#FFD23F">운용방식 3종 · 소득수준 3종</text>

  <!-- 운용방식 -->
  <text x="60" y="290" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="44" fill="#243B6B">운용 방식별</text>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <rect x="60" y="320" width="960" height="120" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="100" y="378" font-size="42" font-weight="bold" fill="#1a1a1a">신탁형</text>
    <text x="100" y="422" font-size="30" fill="#5B6B7C">가입자가 상품 지정 · 국내주식 직접매매 불가</text>

    <rect x="60" y="460" width="960" height="120" rx="16" fill="#ffffff" stroke="#243B6B" stroke-width="3"/>
    <text x="100" y="518" font-size="42" font-weight="bold" fill="#243B6B">중개형</text>
    <rect x="760" y="480" width="240" height="50" rx="25" fill="#FFD23F"/>
    <text x="880" y="516" font-size="30" font-weight="bold" fill="#243B6B" text-anchor="middle">주식매매 가능</text>
    <text x="100" y="562" font-size="30" fill="#5B6B7C">직접 상품 선택·매매 · 증권사 개설</text>

    <rect x="60" y="600" width="960" height="120" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="100" y="658" font-size="42" font-weight="bold" fill="#1a1a1a">일임형</text>
    <text x="100" y="702" font-size="30" fill="#5B6B7C">전문가(MP)가 알아서 운용·리밸런싱</text>
  </g>

  <!-- 소득수준 -->
  <text x="60" y="810" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="44" fill="#243B6B">소득 수준별 (비과세 한도)</text>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <rect x="60" y="840" width="960" height="110" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="100" y="905" font-size="40" font-weight="bold" fill="#1a1a1a">일반형</text>
    <text x="640" y="905" font-size="30" fill="#5B6B7C">소득 제한 없음</text>
    <text x="980" y="905" font-size="46" font-weight="bold" fill="#243B6B" text-anchor="end">200만원</text>

    <rect x="60" y="965" width="960" height="110" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="100" y="1030" font-size="40" font-weight="bold" fill="#1a1a1a">서민형</text>
    <text x="560" y="1030" font-size="28" fill="#5B6B7C">총급여 5,000만원 이하 등</text>
    <text x="980" y="1030" font-size="46" font-weight="bold" fill="#1F8A53" text-anchor="end">400만원</text>

    <rect x="60" y="1090" width="960" height="110" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="100" y="1155" font-size="40" font-weight="bold" fill="#1a1a1a">농어민형</text>
    <text x="560" y="1155" font-size="28" fill="#5B6B7C">농어업 종사·종소 3,800만 이하</text>
    <text x="980" y="1155" font-size="46" font-weight="bold" fill="#1F8A53" text-anchor="end">400만원</text>
  </g>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#5B6B7C">서민형·농어민형 비과세 한도는 일반형의 2배</text>
</svg>
