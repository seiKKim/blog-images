<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- 배경: 오늘의 이슈 차콜 -->
  <rect width="1080" height="1080" fill="#2B2F36"/>
  <!-- 장식 도형 -->
  <circle cx="950" cy="180" r="260" fill="#E23B3B" opacity="0.14"/>
  <circle cx="120" cy="980" r="200" fill="#ffffff" opacity="0.05"/>

  <!-- 카테고리 뱃지 (좌상단) -->
  <rect x="80" y="90" rx="34" ry="34" width="196" height="68" fill="#E23B3B"/>
  <text x="178" y="136" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="36" fill="#ffffff" text-anchor="middle">오늘의 이슈</text>

  <!-- 서브 카피 -->
  <text x="80" y="330" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#E8EEF5">2027년 최저임금 확정</text>

  <!-- 메인 카피 (핵심 숫자) -->
  <text x="80" y="500" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="80" fill="#ffffff">시급</text>
  <text x="300" y="510" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="150" fill="#FFD23F">10,700원</text>

  <!-- 인상 정보 -->
  <text x="80" y="640" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="66" fill="#ffffff">전년比 <tspan fill="#FFD23F">+380원 · 3.7%↑</tspan></text>

  <!-- 디테일 박스 (월급/시행일) -->
  <rect x="80" y="720" rx="20" ry="20" width="920" height="200" fill="#ffffff" opacity="0.10"/>
  <text x="112" y="800" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="50" fill="#ffffff">월급 <tspan fill="#FFD23F">2,236,300원</tspan> (주휴 포함)</text>
  <text x="112" y="878" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="50" fill="#ffffff">2027년 1월 1일부터 시행</text>

  <!-- 채널 표시 -->
  <text x="80" y="1010" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="34" fill="#E8EEF5" opacity="0.85">blog.naver.com/trip_chocho</text>
</svg>
