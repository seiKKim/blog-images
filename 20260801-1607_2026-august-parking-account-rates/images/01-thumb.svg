<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#243B6B"/>
  <circle cx="950" cy="170" r="270" fill="#ffffff" opacity="0.07"/>
  <circle cx="120" cy="990" r="210" fill="#ffffff" opacity="0.05"/>

  <!-- 카테고리 뱃지 -->
  <rect x="80" y="86" rx="34" ry="34" width="230" height="68" fill="#FFD23F"/>
  <text x="195" y="132" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="36" fill="#1a1a1a" text-anchor="middle">금융·재테크</text>

  <!-- 서브 카피 -->
  <text x="80" y="278" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#E8EEF5">2026년 8월 기준</text>

  <!-- 메인 카피 -->
  <text x="80" y="418" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="128" fill="#ffffff">파킹통장</text>
  <text x="80" y="556" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="128" fill="#FFD23F">금리 비교</text>

  <!-- 은행 금리 요약 4행 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold">
    <rect x="80" y="612" width="920" height="286" rx="24" fill="#ffffff" opacity="0.12"/>

    <text x="120" y="682" font-size="46" fill="#ffffff">카카오뱅크 세이프박스</text>
    <text x="960" y="682" font-size="46" fill="#FFD23F" text-anchor="end">연 1.60%</text>

    <text x="120" y="752" font-size="46" fill="#ffffff">케이뱅크 플러스박스</text>
    <text x="960" y="752" font-size="46" fill="#FFD23F" text-anchor="end">1.70~2.20%</text>

    <text x="120" y="822" font-size="46" fill="#ffffff">토스뱅크 통장</text>
    <text x="960" y="822" font-size="46" fill="#FFD23F" text-anchor="end">연 1.0%</text>

    <text x="120" y="892" font-size="46" fill="#ffffff">SBI저축 사이다입출금</text>
    <text x="960" y="892" font-size="46" fill="#FFD23F" text-anchor="end">최고 2.7%</text>
  </g>

  <!-- 하단 안내 -->
  <text x="80" y="972" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="40" fill="#E8EEF5">광고 최고금리 말고 '내 조건' 금리 보는 법</text>
  <text x="80" y="1024" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
