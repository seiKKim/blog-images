<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="210" fill="#243B6B"/>
  <rect x="60" y="60" rx="30" ry="30" width="200" height="60" fill="#FFD23F"/>
  <text x="160" y="102" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="32" fill="#1a1a1a" text-anchor="middle">금융·재테크</text>
  <text x="60" y="185" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#ffffff">파킹통장 고르는 5가지 기준</text>

  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <!-- 1 -->
    <rect x="60" y="278" width="960" height="180" rx="20" fill="#ffffff" stroke="#D6E0EC"/>
    <circle cx="140" cy="368" r="42" fill="#243B6B"/>
    <text x="140" y="384" font-size="46" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="210" y="352" font-size="44" font-weight="bold" fill="#1a1a1a">금리</text>
    <text x="210" y="410" font-size="34" fill="#5B6B7C">'최고금리' 말고 내 조건·내 금액 실제 적용 금리</text>

    <!-- 2 -->
    <rect x="60" y="478" width="960" height="180" rx="20" fill="#ffffff" stroke="#D6E0EC"/>
    <circle cx="140" cy="568" r="42" fill="#243B6B"/>
    <text x="140" y="584" font-size="46" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="210" y="552" font-size="44" font-weight="bold" fill="#1a1a1a">한도(금액 구간)</text>
    <text x="210" y="610" font-size="34" fill="#5B6B7C">고금리 구간 확인 · 크면 여러 곳에 분산이 유리</text>

    <!-- 3 -->
    <rect x="60" y="678" width="960" height="180" rx="20" fill="#ffffff" stroke="#D6E0EC"/>
    <circle cx="140" cy="768" r="42" fill="#243B6B"/>
    <text x="140" y="784" font-size="46" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="210" y="752" font-size="44" font-weight="bold" fill="#1a1a1a">이자지급 주기·복리</text>
    <text x="210" y="810" font-size="34" fill="#5B6B7C">매일(즉시) 지급이면 일복리 효과가 커집니다</text>

    <!-- 4 -->
    <rect x="60" y="878" width="960" height="180" rx="20" fill="#ffffff" stroke="#D6E0EC"/>
    <circle cx="140" cy="968" r="42" fill="#243B6B"/>
    <text x="140" y="984" font-size="46" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="210" y="952" font-size="44" font-weight="bold" fill="#1a1a1a">예금자보호</text>
    <text x="210" y="1010" font-size="34" fill="#5B6B7C">은행·저축은행 1억원 적용 · 증권 CMA는 원칙 제외</text>

    <!-- 5 -->
    <rect x="60" y="1078" width="960" height="180" rx="20" fill="#ffffff" stroke="#D6E0EC"/>
    <circle cx="140" cy="1168" r="42" fill="#243B6B"/>
    <text x="140" y="1184" font-size="46" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="210" y="1152" font-size="44" font-weight="bold" fill="#1a1a1a">수시입출·수수료 편의</text>
    <text x="210" y="1210" font-size="34" fill="#5B6B7C">ATM·이체 수수료, 박스·나눠모으기 자동 쪼개기</text>
  </g>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#5B6B7C">출처: 본문 '파킹통장 고르는 5가지 기준' 정리</text>
</svg>
