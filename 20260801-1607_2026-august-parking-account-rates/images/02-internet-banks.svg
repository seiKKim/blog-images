<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="210" fill="#243B6B"/>
  <rect x="60" y="60" rx="30" ry="30" width="200" height="60" fill="#FFD23F"/>
  <text x="160" y="102" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="32" fill="#1a1a1a" text-anchor="middle">금융·재테크</text>
  <text x="60" y="185" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#ffffff">인터넷은행 파킹통장 금리</text>

  <text x="60" y="272" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="34" fill="#5B6B7C">2026년 8월 기준 · 각 은행 공식 페이지 기본금리(세전)</text>

  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <!-- 행1 -->
    <rect x="60" y="310" width="960" height="180" rx="20" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="100" y="378" font-size="44" font-weight="bold" fill="#1a1a1a">카카오뱅크 세이프박스</text>
    <text x="100" y="440" font-size="34" fill="#5B6B7C">한도 최대 1억원 · 매일 일할계산</text>
    <text x="980" y="415" font-size="60" font-weight="bold" fill="#243B6B" text-anchor="end">연 1.60%</text>

    <!-- 행2 -->
    <rect x="60" y="510" width="960" height="180" rx="20" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="100" y="578" font-size="44" font-weight="bold" fill="#1a1a1a">케이뱅크 플러스박스</text>
    <text x="100" y="640" font-size="34" fill="#5B6B7C">5천만원 이하 1.70% / 초과분 2.20%</text>
    <text x="980" y="615" font-size="52" font-weight="bold" fill="#243B6B" text-anchor="end">1.70~2.20%</text>

    <!-- 행3 -->
    <rect x="60" y="710" width="960" height="180" rx="20" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="100" y="778" font-size="44" font-weight="bold" fill="#1a1a1a">토스뱅크 통장</text>
    <text x="100" y="840" font-size="34" fill="#5B6B7C">한도 제한 없음 · 매월 1일 지급</text>
    <text x="980" y="815" font-size="60" font-weight="bold" fill="#243B6B" text-anchor="end">연 1.0%</text>

    <!-- 행4 -->
    <rect x="60" y="910" width="960" height="180" rx="20" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="100" y="978" font-size="44" font-weight="bold" fill="#1a1a1a">토스뱅크 나눠모으기</text>
    <text x="100" y="1040" font-size="34" fill="#5B6B7C">목적별 분할 · 매일 복리 자동</text>
    <text x="980" y="1015" font-size="60" font-weight="bold" fill="#243B6B" text-anchor="end">연 1.4%</text>
  </g>

  <rect x="60" y="1120" width="960" height="110" rx="18" fill="#FFF6D6" stroke="#F0DFA0"/>
  <text x="90" y="1170" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="32" fill="#8A6B00">'최대 6.6%' 등은 대부분 금리쿠폰·신규 이벤트 한정값</text>
  <text x="90" y="1210" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="30" fill="#8A6B00">상시 기본금리(위 표)와 구분해 봐야 합니다</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#5B6B7C">출처: 각 은행 공식 앱·사이트 (가입 전 최신 금리 재확인)</text>
</svg>
