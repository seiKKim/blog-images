<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8722C"/>
      <stop offset="1" stop-color="#C65516"/>
    </linearGradient>
  </defs>
  <!-- 배경 -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="950" cy="170" r="260" fill="#ffffff" opacity="0.08"/>
  <circle cx="110" cy="990" r="210" fill="#ffffff" opacity="0.06"/>

  <!-- 달/별 모티브 -->
  <path d="M 940 120 a 78 78 0 1 0 40 128 a 62 62 0 1 1 -40 -128 z" fill="#FFD23F" opacity="0.9"/>
  <circle cx="820" cy="90" r="7" fill="#FFD23F" opacity="0.8"/>
  <circle cx="870" cy="250" r="5" fill="#FFD23F" opacity="0.7"/>

  <!-- 카테고리 뱃지 -->
  <rect x="80" y="96" rx="34" ry="34" width="220" height="68" fill="#FFD23F"/>
  <text x="190" y="142" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="38" fill="#1a1a1a" text-anchor="middle">생활꿀팁</text>

  <!-- 서브 카피 -->
  <text x="82" y="300" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#FFE9D2">2026 열대야, 밤새 뒤척였다면</text>

  <!-- 메인 카피 -->
  <text x="80" y="430" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="118" fill="#ffffff">열대야 숙면</text>
  <text x="80" y="560" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="118" fill="#FFD23F">3가지 핵심</text>

  <!-- 핵심 수치 박스 2개 -->
  <rect x="80" y="628" rx="24" ry="24" width="440" height="200" fill="#ffffff" opacity="0.16"/>
  <text x="300" y="710" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="42" fill="#FFE9D2" text-anchor="middle">침실 온도</text>
  <text x="300" y="790" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="76" fill="#ffffff" text-anchor="middle">24~26℃</text>

  <rect x="560" y="628" rx="24" ry="24" width="440" height="200" fill="#ffffff" opacity="0.16"/>
  <text x="780" y="710" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="42" fill="#FFE9D2" text-anchor="middle">습도</text>
  <text x="780" y="790" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="76" fill="#ffffff" text-anchor="middle">50~60%</text>

  <!-- 디테일 -->
  <rect x="80" y="866" rx="20" ry="20" width="920" height="104" fill="#2B2F36" opacity="0.85"/>
  <text x="540" y="932" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="46" fill="#ffffff" text-anchor="middle">에어컨 타이머 · 서큘레이터 · 냉감침구</text>

  <!-- 채널 -->
  <text x="80" y="1030" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="32" fill="#FFE9D2" opacity="0.9">blog.naver.com/trip_chocho</text>
