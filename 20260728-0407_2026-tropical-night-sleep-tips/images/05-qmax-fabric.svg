<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <rect width="1080" height="720" fill="#F4F7FB"/>
  <!-- 상단 색띠 -->
  <rect width="1080" height="170" fill="#E8722C"/>
  <rect x="60" y="52" rx="26" ry="26" width="180" height="56" fill="#FFD23F"/>
  <text x="150" y="90" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="32" fill="#1a1a1a" text-anchor="middle">냉감지표</text>
  <text x="270" y="112" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="56" fill="#ffffff">Q-max, 접촉냉감이란?</text>

  <!-- 다이어그램: 피부 → 원단 열 이동 -->
  <rect x="60" y="220" width="600" height="260" rx="20" fill="#ffffff" stroke="#D6E0EC"/>
  <!-- 피부 -->
  <rect x="110" y="270" width="200" height="70" rx="14" fill="#FFDBC2"/>
  <text x="210" y="315" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="34" fill="#C65516" text-anchor="middle">피부</text>
  <!-- 원단 -->
  <rect x="410" y="270" width="200" height="70" rx="14" fill="#BFE0F5"/>
  <text x="510" y="315" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="34" fill="#1B5FA6" text-anchor="middle">냉감 원단</text>
  <!-- 화살표 열 이동 -->
  <line x1="315" y1="305" x2="405" y2="305" stroke="#E23B3B" stroke-width="8"/>
  <polygon points="405,305 385,293 385,317" fill="#E23B3B"/>
  <text x="360" y="392" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="30" fill="#E23B3B" text-anchor="middle">열</text>
  <text x="360" y="440" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" fill="#5B6B7C" text-anchor="middle">닿는 순간 열이 원단으로 빠져나감</text>

  <!-- 오른쪽 핵심 문구 -->
  <rect x="690" y="220" width="330" height="260" rx="20" fill="#2B2F36"/>
  <text x="855" y="300" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="40" fill="#FFD23F" text-anchor="middle">수치가 높을수록</text>
  <text x="855" y="370" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="52" fill="#ffffff" text-anchor="middle">처음 닿을 때</text>
  <text x="855" y="435" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="52" fill="#ffffff" text-anchor="middle">더 차갑다</text>

  <!-- 하단 안내 -->
  <rect x="60" y="510" width="960" height="110" rx="16" fill="#FFF1E4" stroke="#F3C79E"/>
  <text x="540" y="558" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="36" fill="#C65516" text-anchor="middle">냉감 이불·패드는 Q-max 값을 비교 지표로 참고</text>
  <text x="540" y="600" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" fill="#5B6B7C" text-anchor="middle">제조사 표기 '온도 저감' 수치는 홍보 기준 → 참고용</text>

  <!-- 하단 출처 띠 -->
  <rect x="0" y="650" width="1080" height="70" fill="#E8EEF5"/>
  <text x="60" y="695" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" fill="#5B6B7C">출처: 본문 정리 · 접촉냉감(Q-max) 개념 안내</text>
</svg>
