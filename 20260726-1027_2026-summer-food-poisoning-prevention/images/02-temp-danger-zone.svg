<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F1F8F7"/>
  <!-- 상단 색띠 -->
  <rect width="1080" height="200" fill="#0E7C86"/>
  <rect x="60" y="86" rx="30" ry="30" width="176" height="60" fill="#E8722C"/>
  <text x="148" y="127" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="32" fill="#ffffff" text-anchor="middle">생활꿀팁</text>
  <text x="60" y="182" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="58" fill="#ffffff">세균이 잘 크는 위험 온도대</text>

  <!-- 온도계 -->
  <g>
    <!-- 기둥 배경 -->
    <rect x="150" y="300" width="120" height="820" rx="60" fill="#E3EFED" stroke="#CBDDDB"/>
    <!-- 안전 하단(5℃ 이하) 파랑 -->
    <rect x="150" y="1000" width="120" height="120" rx="0" fill="#3EA7CF"/>
    <!-- 위험온도대 4~60℃ 빨강 그라데 -->
    <rect x="150" y="470" width="120" height="530" fill="#F0A93E"/>
    <rect x="150" y="620" width="120" height="230" fill="#E23B3B"/>
    <!-- 상단 안전(60℃ 이상) -->
    <rect x="150" y="300" width="120" height="170" rx="60" fill="#8FBF7F"/>
    <!-- 구근 -->
    <circle cx="210" cy="1160" r="95" fill="#3EA7CF"/>
    <rect x="150" y="1000" width="120" height="120" fill="#3EA7CF"/>
  </g>

  <!-- 눈금/라벨 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <!-- 60도 -->
    <line x1="270" y1="470" x2="360" y2="470" stroke="#5B6B7C" stroke-width="4"/>
    <text x="380" y="452" font-size="46" font-weight="bold" fill="#1a1a1a">60℃</text>
    <text x="380" y="502" font-size="34" fill="#5B6B7C">이상 안전 보관</text>

    <!-- 최적 35~36 -->
    <line x1="270" y1="735" x2="360" y2="735" stroke="#E23B3B" stroke-width="4"/>
    <text x="380" y="720" font-size="52" font-weight="900" fill="#E23B3B">35~36℃</text>
    <text x="380" y="770" font-size="34" fill="#5B6B7C">번식 속도 가장 빠름</text>

    <!-- 위험대 라벨 -->
    <text x="380" y="600" font-size="40" font-weight="bold" fill="#E8722C">위험 온도대</text>

    <!-- 4도 -->
    <line x1="270" y1="1000" x2="360" y2="1000" stroke="#5B6B7C" stroke-width="4"/>
    <text x="380" y="985" font-size="46" font-weight="bold" fill="#1a1a1a">4℃</text>
    <text x="380" y="1035" font-size="34" fill="#5B6B7C">아래로 내려가야 안전</text>
  </g>

  <!-- 핵심 문구 박스 -->
  <rect x="60" y="1190" width="960" height="70" rx="16" fill="#FFF3E6" stroke="#F0C89A"/>
  <text x="90" y="1237" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="40" font-weight="bold" fill="#B9581C">세균은 4~60℃에서 증식 · 안전은 5℃ 이하 또는 60℃ 이상</text>

  <!-- 출처 띠 -->
  <rect x="0" y="1280" width="1080" height="70" fill="#DCEDEB"/>
  <text x="60" y="1325" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#4C6360">출처: 질병관리청·식품의약품안전처 자료 정리</text>
</svg>
