<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7C86"/>
      <stop offset="1" stop-color="#0A5C6B"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- 시원함 장식: 물방울/원 -->
  <circle cx="940" cy="170" r="250" fill="#ffffff" opacity="0.08"/>
  <circle cx="120" cy="960" r="210" fill="#ffffff" opacity="0.06"/>
  <circle cx="915" cy="905" r="70" fill="#7FE3D6" opacity="0.35"/>
  <circle cx="1000" cy="820" r="34" fill="#7FE3D6" opacity="0.3"/>

  <!-- 카테고리 뱃지 -->
  <rect x="72" y="86" rx="34" ry="34" width="196" height="68" fill="#E8722C"/>
  <text x="170" y="132" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="36" fill="#ffffff" text-anchor="middle">생활꿀팁</text>

  <!-- 서브 카피 -->
  <text x="76" y="300" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#CFF3ED">2026 여름철 식중독 예방</text>

  <!-- 메인 카피 -->
  <text x="76" y="470" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="900"
        font-size="150" fill="#ffffff">6대 수칙</text>
  <text x="76" y="620" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="900"
        font-size="128" fill="#FFD23F">냉장 5℃</text>

  <!-- 핵심 수치 박스 2개 -->
  <rect x="76" y="690" rx="22" ry="22" width="440" height="150" fill="#ffffff" opacity="0.15"/>
  <text x="296" y="762" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="40" fill="#CFF3ED" text-anchor="middle">실온 방치</text>
  <text x="296" y="822" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="900"
        font-size="60" fill="#ffffff" text-anchor="middle">2시간 이내</text>

  <rect x="540" y="690" rx="22" ry="22" width="464" height="150" fill="#ffffff" opacity="0.15"/>
  <text x="772" y="762" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="40" fill="#CFF3ED" text-anchor="middle">냉동 보관</text>
  <text x="772" y="822" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="900"
        font-size="60" fill="#ffffff" text-anchor="middle">-18℃ 이하</text>

  <!-- 디테일 -->
  <text x="76" y="945" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="44" fill="#ffffff">냉장고·조리·도시락까지 한 번에 정리</text>

  <!-- 채널 -->
  <text x="76" y="1018" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="32" fill="#CFF3ED" opacity="0.9">blog.naver.com/trip_chocho</text>
</svg>
