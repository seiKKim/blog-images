<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="220" fill="#1B5FA6"/>
  <rect x="0" y="220" width="1080" height="8" fill="#0E7C8C"/>
  <text x="60" y="118" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#ffffff">복지로 온라인 신청 순서</text>
  <text x="60" y="178" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="36" fill="#BFF3EA">www.bokjiro.go.kr 로그인 후 진행</text>

  <!-- 브라우저 창 프레임 -->
  <rect x="60" y="280" width="960" height="120" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
  <circle cx="110" cy="340" r="14" fill="#E23B3B"/>
  <circle cx="150" cy="340" r="14" fill="#FFD23F"/>
  <circle cx="190" cy="340" r="14" fill="#1F8A53"/>
  <rect x="230" y="316" width="740" height="48" rx="24" fill="#EEF3F8"/>
  <text x="255" y="350" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" fill="#5B6B7C">🔒 www.bokjiro.go.kr</text>

  <!-- 스텝 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <rect x="60" y="440" width="960" height="110" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
    <circle cx="120" cy="495" r="34" fill="#1B5FA6"/><text x="120" y="510" font-size="40" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    <text x="180" y="510" font-size="40" font-weight="bold" fill="#243B6B">서비스 신청</text>

    <rect x="60" y="570" width="960" height="110" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
    <circle cx="120" cy="625" r="34" fill="#1B5FA6"/><text x="120" y="640" font-size="40" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
    <text x="180" y="640" font-size="40" font-weight="bold" fill="#243B6B">복지서비스 신청 → 복지급여 신청</text>

    <rect x="60" y="700" width="960" height="110" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
    <circle cx="120" cy="755" r="34" fill="#1B5FA6"/><text x="120" y="770" font-size="40" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
    <text x="180" y="770" font-size="40" font-weight="bold" fill="#243B6B">저소득층 → 에너지바우처 선택</text>

    <rect x="60" y="830" width="960" height="110" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
    <circle cx="120" cy="885" r="34" fill="#0E7C8C"/><text x="120" y="900" font-size="40" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
    <text x="180" y="900" font-size="40" font-weight="bold" fill="#243B6B">신청서 작성 · 제출</text>
  </g>

  <!-- 방문 신청 안내 -->
  <rect x="60" y="980" width="960" height="200" rx="20" fill="#E8F3EF" stroke="#B7DFD4"/>
  <text x="90" y="1040" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="40" fill="#0E7C8C">방문 신청도 가능</text>
  <text x="90" y="1092" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" fill="#243B6B">거주지 읍·면·동 행정복지센터(주민센터)</text>
  <text x="90" y="1140" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" fill="#243B6B" font-weight="bold">요금차감 시: 최근 전기요금 고지서 지참</text>

  <rect x="0" y="1290" width="1080" height="60" fill="#E8EEF5"/>
  <text x="60" y="1330" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#5B6B7C">신청기간 2026.6.15~12.31 · 문의 1600-3190 (블로그 정리 이미지)</text>
</svg>
