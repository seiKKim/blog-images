<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9F6FB"/>
      <stop offset="1" stop-color="#D3ECF3"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="720" fill="url(#room)"/>
  <!-- 방 바닥 -->
  <rect x="0" y="560" width="1080" height="160" fill="#CDE3EC"/>

  <!-- 상단 뱃지 -->
  <rect x="60" y="48" rx="30" ry="30" width="360" height="60" fill="#1B5FA6"/>
  <text x="240" y="90" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="34" fill="#ffffff" text-anchor="middle">여름 냉방 절전 꿀팁</text>

  <!-- 에어컨 -->
  <rect x="90" y="150" width="300" height="110" rx="18" fill="#ffffff" stroke="#9FC4D6" stroke-width="4"/>
  <rect x="110" y="220" width="260" height="20" rx="8" fill="#BFD9E6"/>
  <text x="240" y="205" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="34" fill="#1B5FA6" text-anchor="middle">에어컨</text>

  <!-- 서큘레이터 -->
  <circle cx="760" cy="470" r="90" fill="#ffffff" stroke="#9FC4D6" stroke-width="4"/>
  <circle cx="760" cy="470" r="58" fill="#E9F6FB" stroke="#7FB8CF" stroke-width="3"/>
  <path d="M760 470 L760 415 A55 55 0 0 1 808 445 Z" fill="#8FC4E8"/>
  <path d="M760 470 L808 500 A55 55 0 0 1 748 524 Z" fill="#8FC4E8"/>
  <path d="M760 470 L712 500 A55 55 0 0 1 712 445 Z" fill="#8FC4E8"/>
  <rect x="740" y="560" width="40" height="40" fill="#B7CFDB"/>
  <text x="760" y="640" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="32" fill="#0E7C8C" text-anchor="middle">서큘레이터</text>

  <!-- 공기 순환 화살표 -->
  <g stroke="#1B5FA6" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M250 280 Q250 470 660 470" marker-end="url(#ah)"/>
  </g>
  <g stroke="#0E7C8C" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M700 400 Q450 330 300 380" marker-end="url(#ah2)"/>
  </g>
  <defs>
    <marker id="ah" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto">
      <path d="M0 0 L14 7 L0 14 Z" fill="#1B5FA6"/>
    </marker>
    <marker id="ah2" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#0E7C8C"/>
    </marker>
  </defs>

  <!-- 설명 문구 -->
  <rect x="440" y="150" width="580" height="150" rx="18" fill="#ffffff" opacity="0.92" stroke="#B7DFD4"/>
  <text x="470" y="210" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="38" fill="#243B6B">찬 공기를 방 전체로 순환</text>
  <text x="470" y="262" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="36" fill="#0E7C8C">설정온도 1~2도 올려도 시원</text>
</svg>
