<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <!-- 상단 색띠 -->
  <rect width="1080" height="220" fill="#1B5FA6"/>
  <rect x="0" y="220" width="1080" height="8" fill="#0E7C8C"/>
  <text x="60" y="118" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#ffffff">세대구성별 연간 총 지원금액</text>
  <text x="60" y="178" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="36" fill="#BFF3EA">2026년 · 하절기+동절기 합산 총액</text>

  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <!-- 1인 -->
    <text x="60" y="360" font-size="44" font-weight="bold" fill="#243B6B">1인 세대</text>
    <rect x="60" y="385" width="295" height="84" rx="14" fill="#8FC4E8"/>
    <text x="375" y="440" font-size="46" font-weight="bold" fill="#1B5FA6">295,200원</text>

    <!-- 2인 -->
    <text x="60" y="580" font-size="44" font-weight="bold" fill="#243B6B">2인 세대</text>
    <rect x="60" y="605" width="407" height="84" rx="14" fill="#5AA6DC"/>
    <text x="487" y="660" font-size="46" font-weight="bold" fill="#1B5FA6">407,500원</text>

    <!-- 3인 -->
    <text x="60" y="800" font-size="44" font-weight="bold" fill="#243B6B">3인 세대</text>
    <rect x="60" y="825" width="533" height="84" rx="14" fill="#2E88CC"/>
    <text x="613" y="880" font-size="46" font-weight="bold" fill="#1B5FA6">532,700원</text>

    <!-- 4인 이상 -->
    <text x="60" y="1020" font-size="44" font-weight="bold" fill="#243B6B">4인 이상 세대</text>
    <rect x="60" y="1045" width="700" height="84" rx="14" fill="#1B5FA6"/>
    <text x="780" y="1100" font-size="46" font-weight="bold" fill="#0E7C8C">701,300원</text>
  </g>

  <!-- 안내 박스 -->
  <rect x="60" y="1170" width="960" height="86" rx="16" fill="#E8F3EF" stroke="#B7DFD4"/>
  <text x="90" y="1223" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="36" font-weight="bold" fill="#0E7C8C">매달 주는 돈이 아닌 1년치 총액 (여름+겨울 합산)</text>

  <!-- 하단 출처 띠 -->
  <rect x="0" y="1290" width="1080" height="60" fill="#E8EEF5"/>
  <text x="60" y="1330" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#5B6B7C">출처: 본문 정리 · 문의 에너지바우처 통합상담센터 1600-3190</text>
</svg>
