<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B5FA6"/>
      <stop offset="1" stop-color="#0E7C8C"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- 장식: 시원한 원 -->
  <circle cx="960" cy="170" r="270" fill="#7FE3D6" opacity="0.16"/>
  <circle cx="120" cy="980" r="210" fill="#ffffff" opacity="0.06"/>
  <circle cx="900" cy="960" r="120" fill="#7FE3D6" opacity="0.12"/>

  <!-- 눈송이/냉방 아이콘 (간단 도형) -->
  <g stroke="#BFF3EA" stroke-width="8" stroke-linecap="round" opacity="0.55">
    <line x1="820" y1="250" x2="820" y2="330"/>
    <line x1="780" y1="290" x2="860" y2="290"/>
    <line x1="792" y1="262" x2="848" y2="318"/>
    <line x1="848" y1="262" x2="792" y2="318"/>
  </g>

  <!-- 카테고리 뱃지 -->
  <rect x="80" y="90" rx="34" ry="34" width="220" height="68" fill="#FFD23F"/>
  <text x="190" y="136" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="36" fill="#1a1a1a" text-anchor="middle">정부지원금</text>

  <!-- 서브 카피 -->
  <text x="80" y="330" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#E8EEF5">2026 에너지바우처 여름</text>

  <!-- 메인 카피 -->
  <text x="80" y="480" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="132" fill="#ffffff">냉방비 지원</text>
  <text x="80" y="640" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="150" fill="#FFD23F">최대 70만원</text>

  <!-- 디테일 박스 -->
  <rect x="80" y="748" rx="20" ry="20" width="920" height="150" fill="#ffffff" opacity="0.15"/>
  <text x="112" y="808" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="46" fill="#ffffff">하절기 사용 7/1~9/30 · 전기요금 차감</text>
  <text x="112" y="868" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="46" fill="#BFF3EA">신청 6/15~12/31 · 대상·금액 총정리</text>

  <!-- 채널 -->
  <text x="80" y="1010" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="34" fill="#E8EEF5" opacity="0.9">※ 세대별 연간 총액 기준 (하절기+동절기 합산)</text>
</svg>
