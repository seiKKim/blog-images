<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="200" fill="#1F8A53"/>
  <text x="60" y="125" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">근로장려금 vs 자녀장려금</text>

  <!-- 헤더 행 -->
  <rect x="60" y="250" width="360" height="110" rx="16" fill="#E8EEF5"/>
  <rect x="440" y="250" width="290" height="110" rx="16" fill="#1F8A53"/>
  <rect x="750" y="250" width="270" height="110" rx="16" fill="#243B6B"/>
  <text x="240" y="318" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="38" fill="#5B6B7C" text-anchor="middle">구분</text>
  <text x="585" y="318" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="38" fill="#ffffff" text-anchor="middle">근로장려금</text>
  <text x="885" y="318" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="38" fill="#ffffff" text-anchor="middle">자녀장려금</text>

  <!-- 행1: 지급액 -->
  <rect x="60" y="380" width="360" height="180" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
  <rect x="440" y="380" width="290" height="180" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
  <rect x="750" y="380" width="270" height="180" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
  <text x="240" y="485" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="40" fill="#1a1a1a" text-anchor="middle">지급액</text>
  <text x="585" y="460" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="32" fill="#1F8A53" text-anchor="middle">최대 330만 원</text>
  <text x="585" y="505" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="28" fill="#5B6B7C" text-anchor="middle">(맞벌이 기준)</text>
  <text x="885" y="460" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="30" fill="#243B6B" text-anchor="middle">자녀 1명당</text>
  <text x="885" y="505" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="30" fill="#243B6B" text-anchor="middle">50만~100만 원</text>

  <!-- 행2: 소득요건 -->
  <rect x="60" y="580" width="360" height="180" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
  <rect x="440" y="580" width="290" height="180" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
  <rect x="750" y="580" width="270" height="180" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
  <text x="240" y="685" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="40" fill="#1a1a1a" text-anchor="middle">소득요건</text>
  <text x="585" y="660" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="30" fill="#1F8A53" text-anchor="middle">가구별 상이</text>
  <text x="585" y="705" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="28" fill="#5B6B7C" text-anchor="middle">맞벌이 4,400만</text>
  <text x="885" y="660" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="30" fill="#243B6B" text-anchor="middle">부부 합산</text>
  <text x="885" y="705" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="30" fill="#243B6B" text-anchor="middle">7,000만 미만</text>

  <!-- 행3: 목적 -->
  <rect x="60" y="780" width="360" height="180" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
  <rect x="440" y="780" width="290" height="180" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
  <rect x="750" y="780" width="270" height="180" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
  <text x="240" y="885" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="40" fill="#1a1a1a" text-anchor="middle">목적</text>
  <text x="585" y="862" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="30" fill="#1F8A53" text-anchor="middle">저소득 가구</text>
  <text x="585" y="907" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="28" fill="#5B6B7C" text-anchor="middle">근로 지원</text>
  <text x="885" y="862" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="30" fill="#243B6B" text-anchor="middle">저소득 가구</text>
  <text x="885" y="907" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="28" fill="#5B6B7C" text-anchor="middle">자녀 양육 지원</text>

  <!-- 강조 박스 -->
  <rect x="60" y="1010" width="960" height="150" rx="20" fill="#FFF6D6" stroke="#FFD23F" stroke-width="4"/>
  <text x="540" y="1075" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="44" fill="#1a1a1a" text-anchor="middle">요건 충족 시 두 제도 중복 수급 가능</text>
  <text x="540" y="1125" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="34" fill="#5B6B7C" text-anchor="middle">근로장려금과 자녀장려금을 함께 받을 수 있습니다</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" fill="#5B6B7C">출처: 국세청 안내 기준</text>
</svg>
