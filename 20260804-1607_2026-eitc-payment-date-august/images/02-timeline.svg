<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <rect width="1080" height="720" fill="#F4F7FB"/>
  <rect width="1080" height="180" fill="#1F8A53"/>
  <text x="60" y="115" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">정기분 신청 · 지급 일정</text>

  <!-- 타임라인 축 -->
  <line x1="150" y1="400" x2="930" y2="400" stroke="#C4D2E0" stroke-width="8" stroke-linecap="round"/>

  <!-- 노드 1: 접수 -->
  <circle cx="270" cy="400" r="26" fill="#1F8A53"/>
  <rect x="120" y="270" width="300" height="90" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
  <text x="270" y="308" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#1a1a1a" text-anchor="middle">정기신청 접수</text>
  <text x="270" y="346" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#1F8A53" text-anchor="middle">5/1 ~ 6/1</text>

  <!-- 노드 2: 심사 -->
  <circle cx="540" cy="400" r="26" fill="#7FB89A"/>
  <rect x="420" y="470" width="240" height="90" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
  <text x="540" y="508" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#1a1a1a" text-anchor="middle">소득·재산</text>
  <text x="540" y="546" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#5B6B7C" text-anchor="middle">심사</text>

  <!-- 노드 3: 지급 -->
  <circle cx="810" cy="400" r="34" fill="#FFD23F" stroke="#1F8A53" stroke-width="6"/>
  <rect x="640" y="250" width="340" height="110" rx="16" fill="#1F8A53"/>
  <text x="810" y="292" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#ffffff" text-anchor="middle">지급 예정</text>
  <text x="810" y="340" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="46" fill="#FFD23F" text-anchor="middle">8월 27일</text>

  <!-- 안내 문구 -->
  <text x="540" y="640" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="32" fill="#5B6B7C" text-anchor="middle">6/2 이후 기한 후 신청은 신청일로부터 4개월 이내 지급</text>

  <rect x="0" y="670" width="1080" height="50" fill="#E8EEF5"/>
  <text x="60" y="704" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" fill="#5B6B7C">출처: 국세청 안내 기준</text>
</svg>
