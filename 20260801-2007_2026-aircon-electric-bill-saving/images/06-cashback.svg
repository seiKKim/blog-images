<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#FBF4EC"/>
  <rect width="1080" height="210" fill="#E8722C"/>
  <text x="60" y="112" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="800"
        font-size="58" fill="#ffffff">한전 에너지캐시백 2026</text>
  <text x="60" y="172" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="700"
        font-size="40" fill="#FFE9CF">7월부터 완화 · 신청 안 하면 손해</text>

  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <!-- 기본 캐시백 -->
    <rect x="60" y="270" width="960" height="290" rx="18" fill="#ffffff" stroke="#E7D3BF"/>
    <text x="100" y="345" font-size="42" font-weight="800" fill="#E8722C">기본 캐시백 (완화 핵심)</text>
    <text x="100" y="415" font-size="36" font-weight="700" fill="#3a3a3a">· 절감률 기준: 3% → <tspan font-weight="800" fill="#D9611F">1% 이상만 절감해도 지급</tspan></text>
    <text x="100" y="475" font-size="36" font-weight="700" fill="#3a3a3a">   (2026년 7~12월 검침분)</text>
    <text x="100" y="535" font-size="36" font-weight="700" fill="#3a3a3a">· 지급 단가 <tspan font-weight="800" fill="#D9611F">최대 120원/kWh</tspan> (최대 인정 절감률 30%)</text>

    <!-- 저녁 추가 캐시백 -->
    <rect x="60" y="580" width="960" height="290" rx="18" fill="#FDECDD" stroke="#E8722C" stroke-width="3"/>
    <text x="100" y="655" font-size="42" font-weight="800" fill="#D9611F">여름철 저녁 추가 캐시백 (7~8월 시범)</text>
    <text x="100" y="725" font-size="36" font-weight="700" fill="#3a3a3a">· 평일 <tspan font-weight="800" fill="#D9611F">오후 5시~8시</tspan> 사용량 줄이면</text>
    <text x="100" y="795" font-size="42" font-weight="800" fill="#D9611F">   최대 500원/kWh 추가 지급</text>
    <text x="100" y="850" font-size="32" font-weight="700" fill="#8A6A4A">AMI 설치+참여 세대 · 월 한도 최대 1만원 · 별도 신청</text>
  </g>

  <!-- 신청 정보 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" font-weight="700">
    <rect x="60" y="890" width="960" height="230" rx="18" fill="#ffffff" stroke="#E7D3BF"/>
    <text x="100" y="950" fill="#8A6A4A">대상</text>
    <text x="280" y="950" fill="#1a1a1a">주택용 전 가구 (소득·나이 무관)</text>
    <text x="100" y="1010" fill="#8A6A4A">신청처</text>
    <text x="280" y="1010" fill="#1a1a1a">한전:ON 앱·홈, QR, 고객센터 ☎123</text>
    <text x="100" y="1070" fill="#8A6A4A">지급</text>
    <text x="280" y="1070" fill="#1a1a1a">다음 달 청구서 자동 차감 · 자동 유지</text>
  </g>

  <rect x="0" y="1270" width="1080" height="80" fill="#EFE2D3"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#8A6A4A">2026.6.29 한국전력공사 발표 · 7월 시행 기준</text>
</svg>
