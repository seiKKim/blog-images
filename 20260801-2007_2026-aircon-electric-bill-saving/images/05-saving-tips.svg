<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#FBF4EC"/>
  <rect width="1080" height="210" fill="#E8722C"/>
  <text x="60" y="112" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="800"
        font-size="58" fill="#ffffff">오늘 바로 하는 절약 팁</text>
  <text x="60" y="172" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="700"
        font-size="40" fill="#FFE9CF">종류 무관, 누구나 적용 가능</text>

  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <!-- 1 -->
    <rect x="60" y="270" width="960" height="180" rx="18" fill="#ffffff" stroke="#E7D3BF"/>
    <circle cx="150" cy="360" r="52" fill="#E8722C"/>
    <text x="150" y="378" font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle">26℃</text>
    <text x="250" y="345" font-size="44" font-weight="800" fill="#1a1a1a">설정온도 26℃</text>
    <text x="250" y="408" font-size="36" font-weight="700" fill="#8A6A4A">1℃ 올릴 때마다 냉방 전력 약 7% 절감</text>

    <!-- 2 -->
    <rect x="60" y="470" width="960" height="180" rx="18" fill="#ffffff" stroke="#E7D3BF"/>
    <circle cx="150" cy="560" r="52" fill="#1F8A53"/>
    <text x="150" y="578" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle">바람</text>
    <text x="250" y="545" font-size="44" font-weight="800" fill="#1a1a1a">선풍기·서큘레이터 병행</text>
    <text x="250" y="608" font-size="36" font-weight="700" fill="#8A6A4A">찬 공기 순환 → 설정온도 높여도 시원</text>

    <!-- 3 -->
    <rect x="60" y="670" width="960" height="180" rx="18" fill="#ffffff" stroke="#E7D3BF"/>
    <circle cx="150" cy="760" r="52" fill="#1B5FA6"/>
    <text x="150" y="778" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle">필터</text>
    <text x="250" y="745" font-size="44" font-weight="800" fill="#1a1a1a">필터 청소</text>
    <text x="250" y="808" font-size="36" font-weight="700" fill="#8A6A4A">일반 가정 2주 1회 (반려동물 주 1회)</text>

    <!-- 4 -->
    <rect x="60" y="870" width="960" height="180" rx="18" fill="#ffffff" stroke="#E7D3BF"/>
    <circle cx="150" cy="960" r="52" fill="#E0556E"/>
    <text x="150" y="978" font-size="46" font-weight="800" fill="#ffffff" text-anchor="middle">차광</text>
    <text x="250" y="945" font-size="44" font-weight="800" fill="#1a1a1a">실외기·커튼 관리</text>
    <text x="250" y="1008" font-size="36" font-weight="700" fill="#8A6A4A">커튼으로 직사광 차단 시 실내 최소 약 2℃↓</text>
  </g>

  <rect x="60" y="1075" width="960" height="150" rx="18" fill="#FDECDD" stroke="#E8722C" stroke-width="2"/>
  <text x="100" y="1140" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="40" font-weight="800" fill="#E8722C">TIP  바람은 위쪽으로 고정</text>
  <text x="100" y="1192" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" font-weight="700" fill="#8A6A4A">찬 공기는 아래로 내려와 방 전체가 고르게 시원</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#EFE2D3"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#8A6A4A">26℃는 산업통상자원부 권장 여름철 실내 적정온도</text>
</svg>
