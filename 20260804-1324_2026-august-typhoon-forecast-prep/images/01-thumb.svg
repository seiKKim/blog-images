<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- 배경: 오늘의 이슈 차콜 -->
  <defs>
    <radialGradient id="bg" cx="70%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#39414B"/>
      <stop offset="100%" stop-color="#2B2F36"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E23B3B"/>
      <stop offset="55%" stop-color="#C22B2B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C22B2B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- 태풍 소용돌이(우상단) -->
  <g transform="translate(800,235)">
    <circle cx="0" cy="0" r="230" fill="url(#eye)"/>
    <g fill="none" stroke="#E8EEF5" stroke-width="16" stroke-linecap="round" opacity="0.85">
      <path d="M0,0 C -30,-95 -150,-120 -195,-40 C -235,30 -150,120 -40,110"/>
      <path d="M0,0 C 30,95 150,120 195,40 C 235,-30 150,-120 40,-110"/>
    </g>
    <circle cx="0" cy="0" r="34" fill="#E23B3B"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.9"/>
  </g>

  <!-- 진로 점선(중국~한반도 방향 암시) -->
  <path d="M760,320 Q 560,470 430,560" fill="none" stroke="#FFD23F" stroke-width="8" stroke-dasharray="4 26" stroke-linecap="round" opacity="0.9"/>
  <circle cx="430" cy="560" r="16" fill="#FFD23F"/>
  <text x="360" y="622" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="34" fill="#FFD23F">한반도?</text>

  <!-- 카테고리 뱃지 -->
  <rect x="72" y="84" rx="34" ry="34" width="196" height="66" fill="#E23B3B"/>
  <text x="170" y="129" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#ffffff" text-anchor="middle">오늘의 이슈</text>

  <!-- 서브 카피 -->
  <text x="76" y="252" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="52" fill="#E8EEF5">2026년 8월 태풍 전망</text>

  <!-- 메인 카피 -->
  <text x="72" y="740" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="120" fill="#ffffff">초강력 태풍</text>
  <text x="72" y="866" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="150" fill="#FFD23F">'돌핀'</text>
  <text x="470" y="866" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="88" fill="#ffffff">강도 5</text>

  <!-- 디테일 박스 -->
  <rect x="72" y="912" rx="20" ry="20" width="936" height="96" fill="#ffffff" opacity="0.12"/>
  <text x="100" y="973" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="42" fill="#ffffff">직접 상륙 가능성 낮음 · 진로 변동성 큼</text>

  <!-- 채널 -->
  <text x="76" y="1052" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="30" fill="#E8EEF5" opacity="0.85">blog.naver.com/trip_chocho</text>
</svg>
