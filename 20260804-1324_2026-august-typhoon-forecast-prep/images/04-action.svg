<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>

  <!-- 상단 색띠 + 제목 -->
  <rect width="1080" height="200" fill="#2B2F36"/>
  <rect x="60" y="58" width="10" height="84" fill="#E23B3B"/>
  <text x="90" y="105" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="56" fill="#ffffff">태풍 국민행동요령 3단계</text>
  <text x="90" y="160" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="32" fill="#B9C4D0">출처: 행정안전부 국민재난안전포털</text>

  <!-- 1단계 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <rect x="60" y="250" width="960" height="330" rx="20" fill="#ffffff" stroke="#D6E0EC"/>
    <rect x="60" y="250" width="18" height="330" rx="0" fill="#FFD23F"/>
    <circle cx="150" cy="335" r="46" fill="#FFF3CE"/>
    <!-- 돋보기 아이콘 -->
    <circle cx="144" cy="329" r="20" fill="none" stroke="#B58900" stroke-width="7"/>
    <line x1="159" y1="344" x2="172" y2="357" stroke="#B58900" stroke-width="9" stroke-linecap="round"/>
    <text x="220" y="322" font-size="42" font-weight="bold" fill="#2B2F36">1단계 · 태풍 예보 시</text>
    <text x="220" y="366" font-size="30" fill="#8A6D00" font-weight="bold">사전 대비</text>
    <g font-size="32" fill="#33404C">
      <text x="110" y="435">· 안전디딤돌 앱으로 진로·도달시간 확인</text>
      <text x="110" y="483">· 창문 안전필름/테이프, 옥외 설치물 결박</text>
      <text x="110" y="531">· 하수구 점검, 저지대 차량 이동, 비상용품 준비</text>
    </g>
  </g>

  <!-- 2단계 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <rect x="60" y="612" width="960" height="330" rx="20" fill="#ffffff" stroke="#D6E0EC"/>
    <rect x="60" y="612" width="18" height="330" rx="0" fill="#E8722C"/>
    <circle cx="150" cy="697" r="46" fill="#FBE2CE"/>
    <!-- 경고 삼각형 -->
    <path d="M150,675 l24,42 h-48 z" fill="none" stroke="#C2521A" stroke-width="7" stroke-linejoin="round"/>
    <line x1="150" y1="690" x2="150" y2="702" stroke="#C2521A" stroke-width="7" stroke-linecap="round"/>
    <circle cx="150" cy="710" r="3.5" fill="#C2521A"/>
    <text x="220" y="684" font-size="42" font-weight="bold" fill="#2B2F36">2단계 · 태풍 특보 중</text>
    <text x="220" y="728" font-size="30" fill="#C2521A" font-weight="bold">진행 중 · 외출 자제</text>
    <g font-size="32" fill="#33404C">
      <text x="110" y="797">· 침수 도로·지하차도·교량 통행 금지</text>
      <text x="110" y="845">· 창문에서 떨어지기, 가스 미리 차단</text>
      <text x="110" y="893">· 젖은 손으로 전기시설 만지지 않기</text>
    </g>
  </g>

  <!-- 3단계 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <rect x="60" y="974" width="960" height="330" rx="20" fill="#ffffff" stroke="#D6E0EC"/>
    <rect x="60" y="974" width="18" height="330" rx="0" fill="#E23B3B"/>
    <circle cx="150" cy="1059" r="46" fill="#F7D5D5"/>
    <!-- 체크 아이콘 -->
    <path d="M128,1059 l16,17 l30,-34" fill="none" stroke="#B22222" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="220" y="1046" font-size="42" font-weight="bold" fill="#2B2F36">3단계 · 태풍 이후</text>
    <text x="220" y="1090" font-size="30" fill="#B22222" font-weight="bold">복구 · 2차 피해 예방</text>
    <g font-size="32" fill="#33404C">
      <text x="110" y="1159">· 파손 시설 신고 전 반드시 사진 촬영</text>
      <text x="110" y="1207">· 침수 음식·식수 오염 여부 확인 후 사용</text>
      <text x="110" y="1255">· 침수 주택은 가스·전기 안전점검 후 사용</text>
    </g>
  </g>
</svg>
