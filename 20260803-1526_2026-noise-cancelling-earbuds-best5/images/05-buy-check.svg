<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <rect width="1080" height="720" fill="#F7F1EA"/>
  <rect width="1080" height="150" fill="#E8722C"/>
  <text x="60" y="98" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="58" fill="#ffffff">구매 전 핵심 체크 5</text>

  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="40" fill="#1a1a1a">
    <circle cx="95" cy="220" r="24" fill="#E8722C"/>
    <text x="95" y="233" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="145" y="234" font-weight="bold">이어팁(귀 맞춤)이 스펙보다 먼저 — 밀폐 안 되면 반감</text>

    <circle cx="95" cy="310" r="24" fill="#E8722C"/>
    <text x="95" y="323" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="145" y="324" font-weight="bold">저가 ANC 과신 금물 — 2~3만원대는 &quot;보조&quot; 수준</text>

    <circle cx="95" cy="400" r="24" fill="#E8722C"/>
    <text x="95" y="413" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="145" y="414" font-weight="bold">내 폰 생태계·코덱 궁합 확인 (AAC / SSC / LDAC)</text>

    <circle cx="95" cy="490" r="24" fill="#E8722C"/>
    <text x="95" y="503" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="145" y="504" font-weight="bold">정품·A/S 확인 — 초저가·병행수입 리스크 주의</text>

    <circle cx="95" cy="580" r="24" fill="#E8722C"/>
    <text x="95" y="593" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="145" y="594" font-weight="bold">통화 성능은 ANC와 별개(ENC) — 화상회의 많으면 확인</text>
  </g>

  <rect x="60" y="640" width="960" height="60" rx="14" fill="#FCE9D6" stroke="#E8C4A0"/>
  <text x="540" y="680" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" fill="#B5601F" font-weight="bold" text-anchor="middle">적정 볼륨(60%) · 1시간마다 잠깐 휴식 권장</text>
</svg>
