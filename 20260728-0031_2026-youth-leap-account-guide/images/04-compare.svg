<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="180" fill="#243B6B"/>
  <rect x="60" y="42" rx="26" ry="26" width="196" height="58" fill="#FFD23F"/>
  <text x="158" y="83" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="32" fill="#1a1a1a" text-anchor="middle">금융·재테크</text>
  <text x="60" y="152" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="54" fill="#ffffff">청년 목돈 제도 3종 비교</text>

  <!-- 컬럼 헤더 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <rect x="60"  y="210" width="240" height="110" rx="14" fill="#EAF0F9"/>
    <text x="180" y="255" font-weight="bold" font-size="30" fill="#243B6B" text-anchor="middle">항목</text>

    <rect x="310" y="210" width="240" height="110" rx="14" fill="#243B6B"/>
    <text x="430" y="252" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">청년도약</text>
    <text x="430" y="288" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">계좌</text>

    <rect x="560" y="210" width="240" height="110" rx="14" fill="#1F6FB2"/>
    <text x="680" y="252" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">청년미래</text>
    <text x="680" y="288" font-weight="bold" font-size="26" fill="#FFD23F" text-anchor="middle">적금(’26.6~)</text>

    <rect x="810" y="210" width="210" height="110" rx="14" fill="#2E8B6A"/>
    <text x="915" y="252" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">청년내일</text>
    <text x="915" y="288" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">저축</text>
  </g>

  <!-- 행 생성 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" fill="#1a1a1a">
    <!-- 현황 -->
    <rect x="60" y="330" width="960" height="112" rx="12" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="180" y="393" font-weight="bold" font-size="30" fill="#243B6B" text-anchor="middle">현황</text>
    <text x="430" y="378" font-weight="bold" font-size="27" fill="#E23B3B" text-anchor="middle">신규종료</text>
    <text x="430" y="412" font-size="24" fill="#5B6B7C" text-anchor="middle">(’25.12)</text>
    <text x="680" y="393" font-weight="bold" font-size="28" fill="#1a1a1a" text-anchor="middle">신규 모집</text>
    <text x="915" y="393" font-weight="bold" font-size="28" fill="#1a1a1a" text-anchor="middle">신규 모집</text>

    <!-- 나이 -->
    <rect x="60" y="452" width="960" height="100" rx="12" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="180" y="512" font-weight="bold" font-size="30" fill="#243B6B" text-anchor="middle">나이</text>
    <text x="430" y="512" font-size="28" text-anchor="middle">19~34세</text>
    <text x="680" y="512" font-size="28" text-anchor="middle">19~34세</text>
    <text x="915" y="512" font-size="28" text-anchor="middle">15~39세</text>

    <!-- 만기 -->
    <rect x="60" y="562" width="960" height="100" rx="12" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="180" y="622" font-weight="bold" font-size="30" fill="#243B6B" text-anchor="middle">만기</text>
    <text x="430" y="622" font-size="28" text-anchor="middle">5년</text>
    <text x="680" y="622" font-weight="bold" font-size="30" fill="#1F6FB2" text-anchor="middle">3년</text>
    <text x="915" y="622" font-size="28" text-anchor="middle">3년</text>

    <!-- 월 납입 -->
    <rect x="60" y="672" width="960" height="100" rx="12" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="180" y="732" font-weight="bold" font-size="28" fill="#243B6B" text-anchor="middle">월 납입</text>
    <text x="430" y="732" font-size="27" text-anchor="middle">최대 70만</text>
    <text x="680" y="732" font-size="27" text-anchor="middle">최대 50만</text>
    <text x="915" y="732" font-size="26" text-anchor="middle">10만 이상</text>

    <!-- 개인소득 -->
    <rect x="60" y="782" width="960" height="112" rx="12" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="180" y="845" font-weight="bold" font-size="27" fill="#243B6B" text-anchor="middle">개인소득</text>
    <text x="430" y="832" font-size="24" text-anchor="middle">총급여</text>
    <text x="430" y="864" font-size="24" text-anchor="middle">7,500만↓</text>
    <text x="680" y="832" font-size="24" text-anchor="middle">총급여</text>
    <text x="680" y="864" font-size="24" text-anchor="middle">6,000만↓</text>
    <text x="915" y="832" font-size="23" text-anchor="middle">근로·사업</text>
    <text x="915" y="864" font-size="23" text-anchor="middle">월 10만↑</text>

    <!-- 정부지원 -->
    <rect x="60" y="904" width="960" height="120" rx="12" fill="#FFF6DC" stroke="#F0D98A"/>
    <text x="180" y="967" font-weight="bold" font-size="28" fill="#243B6B" text-anchor="middle">정부지원</text>
    <text x="430" y="952" font-weight="bold" font-size="24" fill="#1a1a1a" text-anchor="middle">월 최대</text>
    <text x="430" y="984" font-weight="bold" font-size="26" fill="#243B6B" text-anchor="middle">3.3만원</text>
    <text x="680" y="952" font-weight="bold" font-size="24" fill="#1a1a1a" text-anchor="middle">납입액의</text>
    <text x="680" y="984" font-weight="bold" font-size="28" fill="#1F6FB2" text-anchor="middle">6~12%</text>
    <text x="915" y="945" font-weight="bold" font-size="22" fill="#1a1a1a" text-anchor="middle">월 10만 저축시</text>
    <text x="915" y="978" font-weight="bold" font-size="26" fill="#2E8B6A" text-anchor="middle">정부 30만원</text>

    <!-- 비과세 -->
    <rect x="60" y="1034" width="960" height="100" rx="12" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="180" y="1094" font-weight="bold" font-size="30" fill="#243B6B" text-anchor="middle">비과세</text>
    <text x="430" y="1094" font-weight="bold" font-size="34" fill="#2E8B6A" text-anchor="middle">O</text>
    <text x="680" y="1094" font-weight="bold" font-size="34" fill="#2E8B6A" text-anchor="middle">O</text>
    <text x="915" y="1094" font-weight="bold" font-size="34" fill="#B9C6DA" text-anchor="middle">—</text>
  </g>

  <!-- 하단 메모 -->
  <rect x="0" y="1160" width="1080" height="190" fill="#243B6B"/>
  <text x="60" y="1230" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="34" fill="#ffffff">저축규모·기간 → 청년도약계좌</text>
  <text x="60" y="1290" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="34" fill="#FFD23F">매칭률·짧은 만기 → 청년미래적금</text>
  <text x="60" y="1335" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="27" fill="#C9D6EC">※ 유불리는 개인 소득·잔여기간·우대형 여부에 따라 다름</text>
</svg>
