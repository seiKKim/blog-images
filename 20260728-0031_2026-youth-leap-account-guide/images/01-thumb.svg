  <!-- 디테일 박스들 -->
  <rect x="80" y="650" rx="20" ry="20" width="920" height="118" fill="#ffffff" opacity="0.14"/>
  <text x="112" y="726" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="46" fill="#ffffff">기존 가입자 · 만기/기여금/갈아타기</text>

  <rect x="80" y="792" rx="20" ry="20" width="920" height="118" fill="#ffffff" opacity="0.14"/>
  <text x="112" y="868" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
