<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C4A85"/>
      <stop offset="1" stop-color="#243B6B"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="950" cy="170" r="260" fill="#ffffff" opacity="0.07"/>
  <circle cx="120" cy="980" r="210" fill="#ffffff" opacity="0.05"/>

  <!-- 카테고리 뱃지 -->
  <rect x="80" y="88" rx="34" ry="34" width="228" height="68" fill="#FFD23F"/>
  <text x="194" y="134" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="36" fill="#1a1a1a" text-anchor="middle">금융·재테크</text>

  <text x="808" y="134" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#E8EEF5" text-anchor="middle" opacity="0.9">2026년 7월 기준</text>

  <!-- 서브 카피 -->
  <text x="80" y="290" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#E8EEF5">2026 청년도약계좌</text>

  <!-- 메인 카피 -->
  <text x="80" y="430" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="126" fill="#ffffff">신규 가입</text>
  <text x="80" y="565" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="126" fill="#FF6B6B">종료</text>

  <!-- 화살표 → 대안 -->
  <text x="470" y="565" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="120" fill="#FFD23F">→</text>
  <text x="620" y="565" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
