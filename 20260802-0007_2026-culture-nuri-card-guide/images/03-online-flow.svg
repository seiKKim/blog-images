<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="200" fill="#1B5FA6"/>
  <text x="60" y="125" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">온라인으로 앉아서 소진</text>

  <!-- STEP 1 필수 절차 -->
  <rect x="60" y="270" width="960" height="200" rx="24" fill="#1B5FA6"/>
  <circle cx="160" cy="370" r="52" fill="#FFD23F"/>
  <text x="160" y="388" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="56" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="250" y="355" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="52" fill="#ffffff">먼저 '인터넷 사용등록'</text>
  <text x="250" y="425" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="40" fill="#E8EEF5">앱/누리집에서 수령등록해야 온라인 결제 가능</text>

  <!-- 화살표 -->
  <text x="540" y="540" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="70" fill="#1B5FA6" text-anchor="middle">▼</text>

  <!-- STEP 2 -->
  <text x="60" y="620" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="48" fill="#1a1a1a">2. 이런 걸로 잔액 소진</text>

  <!-- 항목 카드 4개 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <rect x="60" y="670" width="460" height="180" rx="20" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
    <text x="290" y="750" font-weight="bold" font-size="46" fill="#1B5FA6" text-anchor="middle">도서·전자책</text>
    <text x="290" y="805" font-size="34" fill="#5B6B7C" text-anchor="middle">예스24·알라딘·교보</text>

    <rect x="560" y="670" width="460" height="180" rx="20" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
    <text x="790" y="750" font-weight="bold" font-size="46" fill="#1B5FA6" text-anchor="middle">기차표</text>
    <text x="790" y="805" font-size="34" fill="#5B6B7C" text-anchor="middle">코레일 KTX/SRT</text>

    <rect x="60" y="880" width="460" height="180" rx="20" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
    <text x="290" y="960" font-weight="bold" font-size="46" fill="#1B5FA6" text-anchor="middle">OTT 구독</text>
    <text x="290" y="1015" font-size="34" fill="#5B6B7C" text-anchor="middle">티빙·디즈니플러스</text>

    <rect x="560" y="880" width="460" height="180" rx="20" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
    <text x="790" y="960" font-weight="bold" font-size="46" fill="#1B5FA6" text-anchor="middle">숙박·여행</text>
    <text x="790" y="1015" font-size="34" fill="#5B6B7C" text-anchor="middle">야놀자·여기어때</text>
  </g>

  <!-- 안내 박스 -->
  <rect x="60" y="1090" width="960" height="130" rx="20" fill="#FFF6E6" stroke="#FFD23F" stroke-width="2"/>
  <text x="110" y="1150" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="40" fill="#1a1a1a">결제 전 앱 '가맹점 조회'로 꼭 확인</text>
  <text x="110" y="1198" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="34" fill="#5B6B7C">브랜드는 대표 예시 · 가맹점은 시점에 따라 변동</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" fill="#5B6B7C">인터넷 사용등록 후 온라인 소진 | blog.naver.com/trip_chocho</text>
</svg>
