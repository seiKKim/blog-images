<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="180" fill="#1B5FA6"/>
  <text x="60" y="100" font-family="Noto Sans CJK KR" font-weight="bold" font-size="60" fill="#ffffff">지원 대상 체크리스트</text>
  <text x="60" y="152" font-family="Noto Sans CJK KR" font-size="34" fill="#E8EEF5">아래 두 기준을 모두 충족해야 합니다</text>

  <!-- 1. 소득기준 -->
  <text x="60" y="265" font-family="Noto Sans CJK KR" font-weight="bold" font-size="42" fill="#1B5FA6">① 소득기준 — 기초생활수급자</text>
  <rect x="60" y="295" rx="16" ry="16" width="960" height="150" fill="#ffffff" stroke="#D6E0EC" stroke-width="3"/>
  <text x="100" y="360" font-family="Noto Sans CJK KR" font-weight="bold" font-size="44" fill="#1a1a1a">생계 · 의료 · 주거 · 교육급여 수급자</text>
  <text x="100" y="415" font-family="Noto Sans CJK KR" font-size="30" fill="#5B6B7C">4개 급여 모두 해당</text>

  <!-- 2. 특성기준 -->
  <text x="60" y="530" font-family="Noto Sans CJK KR" font-weight="bold" font-size="42" fill="#1B5FA6">② 세대원 특성기준 — 하나만 해당하면 OK</text>

  <g font-family="Noto Sans CJK KR">
    <!-- row1 -->
    <rect x="60" y="560" rx="16" ry="16" width="465" height="145" fill="#ffffff" stroke="#D6E0EC" stroke-width="3"/>
    <circle cx="108" cy="605" r="9" fill="#1B5FA6"/>
    <text x="135" y="618" font-weight="bold" font-size="38" fill="#1a1a1a">노인</text>
    <text x="95" y="670" font-size="27" fill="#5B6B7C">1961.12.31 이전 출생자</text>
    <rect x="555" y="560" rx="16" ry="16" width="465" height="145" fill="#ffffff" stroke="#D6E0EC" stroke-width="3"/>
    <circle cx="603" cy="605" r="9" fill="#1B5FA6"/>
    <text x="630" y="618" font-weight="bold" font-size="38" fill="#1a1a1a">영유아</text>
    <text x="590" y="658" font-size="27" fill="#5B6B7C">2019.1.1 이후 출생</text>
    <text x="590" y="692" font-size="27" fill="#5B6B7C">7세 이하 취학 전 아동</text>
    <!-- row2 -->
    <rect x="60" y="725" rx="16" ry="16" width="465" height="145" fill="#ffffff" stroke="#D6E0EC" stroke-width="3"/>
    <circle cx="108" cy="770" r="9" fill="#1B5FA6"/>
    <text x="135" y="783" font-weight="bold" font-size="38" fill="#1a1a1a">장애인</text>
    <text x="95" y="835" font-size="27" fill="#5B6B7C">장애인복지법 등록 장애인</text>
    <rect x="555" y="725" rx="16" ry="16" width="465" height="145" fill="#ffffff" stroke="#D6E0EC" stroke-width="3"/>
    <circle cx="603" cy="770" r="9" fill="#1B5FA6"/>
    <text x="630" y="783" font-weight="bold" font-size="38" fill="#1a1a1a">임산부</text>
    <text x="590" y="823" font-size="27" fill="#5B6B7C">임신 중 또는</text>
    <text x="590" y="857" font-size="27" fill="#5B6B7C">분만 후 6개월 미만</text>
    <!-- row3 -->
    <rect x="60" y="890" rx="16" ry="16" width="465" height="145" fill="#ffffff" stroke="#D6E0EC" stroke-width="3"/>
    <circle cx="108" cy="935" r="9" fill="#1B5FA6"/>
    <text x="135" y="948" font-weight="bold" font-size="38" fill="#1a1a1a">중증질환자 등</text>
    <text x="95" y="988" font-size="27" fill="#5B6B7C">중증·희귀·중증난치질환자</text>
    <text x="95" y="1022" font-size="27" fill="#5B6B7C">(산정특례 기준)</text>
    <rect x="555" y="890" rx="16" ry="16" width="465" height="145" fill="#ffffff" stroke="#D6E0EC" stroke-width="3"/>
    <circle cx="603" cy="935" r="9" fill="#1B5FA6"/>
    <text x="630" y="948" font-weight="bold" font-size="38" fill="#1a1a1a">한부모가족</text>
    <text x="590" y="1000" font-size="27" fill="#5B6B7C">한부모가족지원법 지원 대상</text>
    <!-- row4 -->
    <rect x="60" y="1055" rx="16" ry="16" width="465" height="145" fill="#ffffff" stroke="#D6E0EC" stroke-width="3"/>
    <circle cx="108" cy="1100" r="9" fill="#1B5FA6"/>
    <text x="135" y="1113" font-weight="bold" font-size="38" fill="#1a1a1a">소년소녀가정</text>
    <text x="95" y="1165" font-size="27" fill="#5B6B7C">가정위탁보호 아동 포함</text>
    <rect x="555" y="1055" rx="16" ry="16" width="465" height="145" fill="#ffffff" stroke="#D6E0EC" stroke-width="3"/>
    <circle cx="603" cy="1100" r="9" fill="#1B5FA6"/>
    <text x="630" y="1113" font-weight="bold" font-size="38" fill="#1a1a1a">다자녀세대</text>
    <text x="590" y="1165" font-size="27" fill="#5B6B7C">19세 미만 자녀 2명 이상</text>
  </g>

  <text x="60" y="1245" font-family="Noto Sans CJK KR" font-size="29" fill="#5B6B7C">※ 세대원 모두가 보장시설 수급자인 경우는 제외</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans CJK KR" font-size="32" fill="#5B6B7C">출처: 에너지바우처 공식 사이트(energyv.or.kr)</text>
</svg>
