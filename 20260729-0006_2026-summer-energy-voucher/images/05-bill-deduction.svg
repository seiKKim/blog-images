<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <rect width="1080" height="720" fill="#F4F7FB"/>
  <rect width="1080" height="150" fill="#1B5FA6"/>
  <text x="60" y="95" font-family="Noto Sans CJK KR" font-weight="bold" font-size="52" fill="#ffffff">하절기 사용법 — 전기요금 자동 차감</text>

  <!-- 고지서 예시 -->
  <rect x="70" y="190" rx="20" ry="20" width="560" height="450" fill="#ffffff" stroke="#D6E0EC" stroke-width="3"/>
  <text x="350" y="255" font-family="Noto Sans CJK KR" font-weight="bold" font-size="36" fill="#1a1a1a" text-anchor="middle">전기요금 청구서 (예시)</text>
  <rect x="110" y="280" width="480" height="3" fill="#D6E0EC"/>

  <g font-family="Noto Sans CJK KR" font-size="32">
    <text x="130" y="352" fill="#1a1a1a">전기요금</text>
    <rect x="440" y="330" rx="6" ry="6" width="120" height="26" fill="#D6E0EC"/>

    <rect x="105" y="390" rx="10" ry="10" width="490" height="60" fill="#FFD23F" fill-opacity="0.5"/>
    <text x="130" y="432" font-weight="bold" fill="#1B5FA6">에너지바우처 차감</text>
    <text x="560" y="432" font-weight="bold" fill="#1B5FA6" text-anchor="end">자동 차감</text>

    <text x="130" y="512" fill="#1a1a1a">청구금액</text>
    <rect x="440" y="490" rx="6" ry="6" width="120" height="26" fill="#D6E0EC"/>
  </g>
  <text x="130" y="590" font-family="Noto Sans CJK KR" font-size="24" fill="#5B6B7C">※ 고지서 예시 그림 — 금액은 세대마다 다릅니다</text>

  <!-- 우측 포인트 -->
  <g font-family="Noto Sans CJK KR">
    <circle cx="705" cy="245" r="10" fill="#1B5FA6"/>
    <text x="735" y="258" font-weight="bold" font-size="32" fill="#1a1a1a">별도 결제 없이</text>
    <text x="735" y="303" font-weight="bold" font-size="32" fill="#1B5FA6">고지서에서 자동 차감</text>

    <circle cx="705" cy="385" r="10" fill="#1B5FA6"/>
    <text x="735" y="398" font-weight="bold" font-size="32" fill="#1a1a1a">신청 다음 달부터</text>
    <text x="735" y="443" font-weight="bold" font-size="32" fill="#1B5FA6">차감 시작</text>

    <circle cx="705" cy="525" r="10" fill="#1B5FA6"/>
    <text x="735" y="538" font-weight="bold" font-size="32" fill="#1a1a1a">하절기 사용기간</text>
    <text x="735" y="583" font-weight="bold" font-size="32" fill="#1B5FA6">2026.7.1 ~ 9.30</text>
    <text x="735" y="628" font-size="27" fill="#5B6B7C">전기 에너지원만 신청 가능</text>
  </g>

  <text x="1020" y="695" font-family="Noto Sans CJK KR" font-size="24" fill="#5B6B7C" text-anchor="end">출처: 에너지바우처 공식 사이트(energyv.or.kr)</text>
</svg>
