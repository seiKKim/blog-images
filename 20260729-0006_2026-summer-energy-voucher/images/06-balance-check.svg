<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <rect width="1080" height="720" fill="#F4F7FB"/>
  <rect width="1080" height="150" fill="#1B5FA6"/>
  <text x="60" y="95" font-family="Noto Sans CJK KR" font-weight="bold" font-size="54" fill="#ffffff">잔액조회 — 3가지만 입력하면 끝</text>

  <!-- 조회 화면 예시 -->
  <rect x="60" y="190" rx="20" ry="20" width="560" height="470" fill="#ffffff" stroke="#D6E0EC" stroke-width="3"/>
  <g font-family="Noto Sans CJK KR">
    <text x="100" y="250" font-weight="bold" font-size="28" fill="#1a1a1a">성명</text>
    <rect x="100" y="268" rx="10" ry="10" width="480" height="62" fill="#F4F7FB" stroke="#D6E0EC" stroke-width="2"/>
    <text x="125" y="309" font-size="26" fill="#9AA7B5">이름 입력</text>

    <text x="100" y="378" font-weight="bold" font-size="28" fill="#1a1a1a">생년월일</text>
    <rect x="100" y="396" rx="10" ry="10" width="480" height="62" fill="#F4F7FB" stroke="#D6E0EC" stroke-width="2"/>
    <text x="125" y="437" font-size="26" fill="#9AA7B5">생년월일 입력</text>

    <text x="100" y="506" font-weight="bold" font-size="28" fill="#1a1a1a">주소</text>
    <rect x="100" y="524" rx="10" ry="10" width="480" height="62" fill="#F4F7FB" stroke="#D6E0EC" stroke-width="2"/>
    <text x="125" y="565" font-size="26" fill="#9AA7B5">시/도 · 시/군/구 · 읍면동</text>

  </g>
  <text x="340" y="640" font-family="Noto Sans CJK KR" font-size="24" fill="#9AA7B5" text-anchor="middle">※ 조회 화면 구성 예시 (하나라도 빠지면 조회 불가)</text>

  <!-- 우측 안내 -->
  <g font-family="Noto Sans CJK KR">
    <text x="680" y="250" font-size="30" fill="#5B6B7C">공식 사이트</text>
    <text x="680" y="305" font-weight="bold" font-size="46" fill="#1B5FA6">energyv.or.kr</text>

    <text x="680" y="390" font-size="30" fill="#5B6B7C">전화 문의</text>
    <text x="680" y="445" font-weight="bold" font-size="46" fill="#1B5FA6">1600-3190</text>

    <text x="680" y="530" font-size="28" fill="#5B6B7C">· 하루 전 기준으로 조회됩니다</text>
    <text x="680" y="575" font-size="28" fill="#5B6B7C">· 사용기간 내에만 조회 가능</text>
    <text x="680" y="620" font-size="28" fill="#5B6B7C">· 모의계산 메뉴도 이용 가능</text>
  </g>
</svg>
