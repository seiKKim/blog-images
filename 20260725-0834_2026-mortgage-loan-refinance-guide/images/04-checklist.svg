<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="200" fill="#243B6B"/>
  <text x="60" y="112" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#ffffff">갈아타기 전 체크리스트</text>
  <text x="60" y="168" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="36" fill="#E8EEF5">"절감이자 &gt; 중도상환수수료 + 부대비용"일 때 이득</text>

  <!-- 항목 1 -->
  <rect x="60" y="260" width="960" height="150" rx="18" fill="#ffffff" stroke="#D6E0EC"/>
  <circle cx="130" cy="335" r="34" fill="#243B6B"/>
  <text x="130" y="350" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="40" fill="#ffffff" text-anchor="middle">1</text>
  <text x="196" y="323" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="42" fill="#1a1a1a">중도상환수수료 먼저 계산</text>
  <text x="196" y="375" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal" font-size="32" fill="#5B6B7C">실행 3년 경과 시 대부분 면제 · 5대 은행 0.65% 수준</text>

  <!-- 항목 2 -->
  <rect x="60" y="430" width="960" height="150" rx="18" fill="#ffffff" stroke="#D6E0EC"/>
  <circle cx="130" cy="505" r="34" fill="#243B6B"/>
  <text x="130" y="520" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="40" fill="#ffffff" text-anchor="middle">2</text>
  <text x="196" y="493" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="42" fill="#1a1a1a">우대금리 조건 확인</text>
  <text x="196" y="545" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal" font-size="32" fill="#5B6B7C">급여이체·카드실적·자동이체 미충족 시 실제금리 상승</text>

  <!-- 항목 3 -->
  <rect x="60" y="600" width="960" height="150" rx="18" fill="#ffffff" stroke="#D6E0EC"/>
  <circle cx="130" cy="675" r="34" fill="#243B6B"/>
  <text x="130" y="690" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="40" fill="#ffffff" text-anchor="middle">3</text>
  <text x="196" y="663" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="42" fill="#1a1a1a">고정 · 변동금리 신중히 선택</text>
  <text x="196" y="715" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal" font-size="32" fill="#5B6B7C">금리 상승 국면엔 변동금리 부담 커질 수 있음</text>

  <!-- 항목 4 -->
  <rect x="60" y="770" width="960" height="150" rx="18" fill="#ffffff" stroke="#D6E0EC"/>
  <circle cx="130" cy="845" r="34" fill="#243B6B"/>
  <text x="130" y="860" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="40" fill="#ffffff" text-anchor="middle">4</text>
  <text x="196" y="833" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="42" fill="#1a1a1a">한도·만기 제한 유의</text>
  <text x="196" y="885" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal" font-size="32" fill="#5B6B7C">한도는 기존 잔액 이내 · 만기는 기존 약정 이내</text>

  <!-- 항목 5 -->
  <rect x="60" y="940" width="960" height="150" rx="18" fill="#ffffff" stroke="#D6E0EC"/>
  <circle cx="130" cy="1015" r="34" fill="#243B6B"/>
  <text x="130" y="1030" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="40" fill="#ffffff" text-anchor="middle">5</text>
  <text x="196" y="1003" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="42" fill="#1a1a1a">신청 시간대 제한</text>
  <text x="196" y="1055" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal" font-size="32" fill="#5B6B7C">영업일 오전 9시~오후 9시 · 마통 등은 오후 4시 이전</text>

  <!-- 조건 요건 배너 -->
  <rect x="60" y="1120" width="960" height="120" rx="18" fill="#FFF6D6" stroke="#FFD23F" stroke-width="3"/>
  <text x="540" y="1175" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="40" fill="#1a1a1a" text-anchor="middle">아파트 담보 · 10억 이하 · 6개월 경과 후 신청</text>
  <text x="540" y="1218" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal" font-size="32" fill="#5B6B7C" text-anchor="middle">금리차 0.5%p 이상이면 실익 검토 권장</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#5B6B7C">출처: 금융위원회 · 각 은행 상품안내 (2026년 7월 기준)</text>
</svg>
