<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F0F8FC"/>
  <rect width="1080" height="200" fill="#E0556E"/>
  <text x="60" y="112" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">여름 가족여행 준비물</text>
  <text x="60" y="168" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" fill="#FBDCE3">카테고리별 체크리스트</text>

  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <!-- 물놀이 -->
    <rect x="60" y="250" width="960" height="150" rx="18" fill="#ffffff" stroke="#CDE4F0"/>
    <rect x="60" y="250" width="14" height="150" rx="7" fill="#1E8BC3"/>
    <text x="105" y="315" font-weight="bold" font-size="42" fill="#0E5C8A">물놀이용품</text>
    <text x="105" y="368" font-size="34" fill="#3A4A57">수영복·래시가드·아쿠아슈즈·구명조끼·튜브</text>

    <!-- 자외선/폭염 -->
    <rect x="60" y="420" width="960" height="150" rx="18" fill="#ffffff" stroke="#CDE4F0"/>
    <rect x="60" y="420" width="14" height="150" rx="7" fill="#1E8BC3"/>
    <text x="105" y="485" font-weight="bold" font-size="42" fill="#0E5C8A">자외선·폭염 대비</text>
    <text x="105" y="538" font-size="34" fill="#3A4A57">워터프루프 SPF50+·모자·쿨링미스트·휴대선풍기</text>

    <!-- 피부위생 -->
    <rect x="60" y="590" width="960" height="150" rx="18" fill="#ffffff" stroke="#CDE4F0"/>
    <rect x="60" y="590" width="14" height="150" rx="7" fill="#1E8BC3"/>
    <text x="105" y="655" font-weight="bold" font-size="42" fill="#0E5C8A">피부·위생용품</text>
    <text x="105" y="708" font-size="34" fill="#3A4A57">비치타월·세면도구·샴푸·보습 로션</text>

    <!-- 상비약 -->
    <rect x="60" y="760" width="960" height="150" rx="18" fill="#ffffff" stroke="#CDE4F0"/>
    <rect x="60" y="760" width="14" height="150" rx="7" fill="#1E8BC3"/>
    <text x="105" y="825" font-weight="bold" font-size="42" fill="#0E5C8A">상비약</text>
    <text x="105" y="878" font-size="34" fill="#3A4A57">소화·지사제·해열진통제·밴드·모기패치·인공눈물</text>

    <!-- 아이 -->
    <rect x="60" y="930" width="960" height="150" rx="18" fill="#ffffff" stroke="#CDE4F0"/>
    <rect x="60" y="930" width="14" height="150" rx="7" fill="#1E8BC3"/>
    <text x="105" y="995" font-weight="bold" font-size="42" fill="#0E5C8A">아이 동반 추가</text>
    <text x="105" y="1048" font-size="34" fill="#3A4A57">유아 선크림·기저귀·여벌옷·유아식·유모차</text>

    <!-- 차량 -->
    <rect x="60" y="1100" width="960" height="150" rx="18" fill="#ffffff" stroke="#CDE4F0"/>
    <rect x="60" y="1100" width="14" height="150" rx="7" fill="#1E8BC3"/>
    <text x="105" y="1165" font-weight="bold" font-size="42" fill="#0E5C8A">차량·편의용품</text>
    <text x="105" y="1218" font-size="34" fill="#3A4A57">보조배터리·비치파라솔·돗자리·아이스박스·음료</text>
  </g>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" fill="#5B6B7C">우선순위: 구명조끼(만5세↓)·워터프루프 선크림·상비약</text>
</svg>
