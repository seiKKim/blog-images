<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <rect width="1080" height="720" fill="#F0F8FC"/>
  <rect width="1080" height="150" fill="#1E8BC3"/>
  <text x="60" y="98" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#ffffff">8월 성수기, 예약 전략</text>

  <!-- 예약 증가율 2박스 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <rect x="60" y="200" width="460" height="230" rx="20" fill="#ffffff" stroke="#CDE4F0"/>
    <text x="290" y="270" font-size="36" fill="#3A4A57" text-anchor="middle">3월 국내 숙소 예약</text>
    <text x="290" y="365" font-weight="bold" font-size="96" fill="#1E8BC3" text-anchor="middle">+92.7%</text>
    <text x="290" y="410" font-size="30" fill="#7A8A97" text-anchor="middle">전년 동기 대비</text>

    <rect x="560" y="200" width="460" height="230" rx="20" fill="#ffffff" stroke="#CDE4F0"/>
    <text x="790" y="270" font-size="36" fill="#3A4A57" text-anchor="middle">4월 초(1~5일)</text>
    <text x="790" y="365" font-weight="bold" font-size="96" fill="#E0556E" text-anchor="middle">+115.3%</text>
    <text x="790" y="410" font-size="30" fill="#7A8A97" text-anchor="middle">전년 동기 대비</text>
  </g>

  <!-- 팁 박스 -->
  <rect x="60" y="470" width="960" height="180" rx="20" fill="#0E5C8A"/>
  <text x="95" y="540" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="42" fill="#FFD23F">환불 가능 조건으로 먼저 예약</text>
  <text x="95" y="600" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="36" fill="#ffffff">자리 잡고 더 좋은 조건 나오면 교체</text>

  <text x="1020" y="700" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="26" fill="#8A9AA7" text-anchor="end">출처: 올마이투어 집계 (본문 근거)</text>
</svg>
