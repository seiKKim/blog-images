<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F0F8FC"/>
  <!-- 상단 색띠 -->
  <rect width="1080" height="200" fill="#1E8BC3"/>
  <circle cx="980" cy="80" r="70" fill="#FFD23F" opacity="0.85"/>
  <text x="60" y="112" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">바다·해변형 추천</text>
  <text x="60" y="168" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="34" fill="#D6ECF7">물놀이 + 도시 관광을 함께</text>

  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <!-- 강릉 -->
    <rect x="60" y="260" width="960" height="230" rx="20" fill="#ffffff" stroke="#CDE4F0"/>
    <rect x="60" y="260" width="14" height="230" rx="7" fill="#1E8BC3"/>
    <text x="105" y="345" font-weight="bold" font-size="52" fill="#0E5C8A">강릉 (강원)</text>
    <text x="105" y="405" font-size="38" fill="#3A4A57">서울 근교 접근성 · 자연·해변·맛집</text>
    <text x="105" y="458" font-size="38" fill="#3A4A57">개폐식 돔 인피니티풀(비·바람 시 실내형)</text>

    <!-- 부산 -->
    <rect x="60" y="520" width="960" height="200" rx="20" fill="#ffffff" stroke="#CDE4F0"/>
    <rect x="60" y="520" width="14" height="200" rx="7" fill="#1E8BC3"/>
    <text x="105" y="600" font-weight="bold" font-size="52" fill="#0E5C8A">부산</text>
    <text x="105" y="660" font-size="38" fill="#3A4A57">해운대 오션뷰 · 블루라인파크·스카이캡슐</text>

    <!-- 여수 -->
    <rect x="60" y="750" width="960" height="200" rx="20" fill="#ffffff" stroke="#CDE4F0"/>
    <rect x="60" y="750" width="14" height="200" rx="7" fill="#1E8BC3"/>
    <text x="105" y="830" font-weight="bold" font-size="52" fill="#0E5C8A">여수 (전남)</text>
    <text x="105" y="890" font-size="38" fill="#3A4A57">아쿠아플라넷·케이블카·미술관 (실내 커버)</text>

    <!-- 제주 -->
    <rect x="60" y="980" width="960" height="200" rx="20" fill="#ffffff" stroke="#CDE4F0"/>
    <rect x="60" y="980" width="14" height="200" rx="7" fill="#1E8BC3"/>
    <text x="105" y="1060" font-weight="bold" font-size="52" fill="#0E5C8A">제주</text>
    <text x="105" y="1120" font-size="38" fill="#3A4A57">테마파크 다양 · 물놀이+실내 모두 가능</text>
  </g>

  <!-- 하단 팁 띠 -->
  <rect x="0" y="1250" width="1080" height="100" fill="#E0556E"/>
  <text x="60" y="1312" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="40" fill="#ffffff">날씨 변동 걱정되면 실내 코스가 함께 있는 곳으로</text>
</svg>
