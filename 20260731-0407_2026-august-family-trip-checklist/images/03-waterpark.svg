<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F0F8FC"/>
  <rect width="1080" height="200" fill="#1E8BC3"/>
  <path d="M760 40 q30 -30 60 0 t60 0 t60 0" stroke="#FFD23F" stroke-width="10" fill="none" opacity="0.9"/>
  <text x="60" y="112" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">워터파크형 추천</text>
  <text x="60" y="168" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="34" fill="#D6ECF7">온 가족·아이 물놀이 집중</text>

  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <!-- 오션월드 -->
    <rect x="60" y="260" width="960" height="220" rx="20" fill="#ffffff" stroke="#CDE4F0"/>
    <rect x="60" y="260" width="14" height="220" rx="7" fill="#1E8BC3"/>
    <text x="105" y="345" font-weight="bold" font-size="50" fill="#0E5C8A">비발디파크 오션월드 (홍천)</text>
    <text x="105" y="405" font-size="37" fill="#3A4A57">서울에서 약 2시간 · 파도풀·슬라이드</text>
    <text x="105" y="452" font-size="37" fill="#3A4A57">실내존/다이내믹존/익스트림존</text>

    <!-- 캐리비안베이 -->
    <rect x="60" y="510" width="960" height="220" rx="20" fill="#ffffff" stroke="#CDE4F0"/>
    <rect x="60" y="510" width="14" height="220" rx="7" fill="#1E8BC3"/>
    <text x="105" y="595" font-weight="bold" font-size="50" fill="#0E5C8A">캐리비안베이 (용인)</text>
    <text x="105" y="655" font-size="37" fill="#3A4A57">2026.6.12~9.6 산리오 캐릭터즈</text>
    <text x="105" y="702" font-size="37" fill="#3A4A57">콜라보(헬로키티·시나모롤 등) 진행</text>

    <!-- 롯데 -->
    <rect x="60" y="760" width="960" height="220" rx="20" fill="#ffffff" stroke="#CDE4F0"/>
    <rect x="60" y="760" width="14" height="220" rx="7" fill="#1E8BC3"/>
    <text x="105" y="845" font-weight="bold" font-size="50" fill="#0E5C8A">롯데워터파크 (김해)</text>
    <text x="105" y="905" font-size="37" fill="#3A4A57">국내 최대급 실내 파도풀 · 유아 토들러 풀</text>
    <text x="105" y="952" font-size="37" fill="#3A4A57">바디슬라이드 5개</text>

    <!-- 신화 -->
    <rect x="60" y="1010" width="960" height="180" rx="20" fill="#ffffff" stroke="#CDE4F0"/>
    <rect x="60" y="1010" width="14" height="180" rx="7" fill="#1E8BC3"/>
    <text x="105" y="1090" font-weight="bold" font-size="50" fill="#0E5C8A">신화워터파크 (제주)</text>
    <text x="105" y="1150" font-size="37" fill="#3A4A57">제주 최대 키즈 맞춤 · 실내존 파도풀·유수풀</text>
  </g>

  <rect x="0" y="1250" width="1080" height="100" fill="#E0556E"/>
  <text x="60" y="1312" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="40" fill="#ffffff">실내존·유아 시설 강점 → 폭염·소나기에도 안심</text>
</svg>
