<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#FFF4F6"/>
  <rect width="1080" height="200" fill="#E0556E"/>
  <text x="60" y="112" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">책가방 · 실내화 · 신발류</text>
  <text x="60" y="168" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="38" fill="#FFD9E1">고를 때 이 3가지만 보세요</text>

  <!-- 카드1 책가방 -->
  <rect x="60" y="270" width="960" height="230" rx="24" fill="#ffffff" stroke="#F3C6CF" stroke-width="2"/>
  <!-- 가방 아이콘 -->
  <g transform="translate(120,320)">
    <rect x="0" y="40" width="130" height="120" rx="24" fill="#E0556E"/>
    <path d="M25 55 a40 40 0 0 1 80 0" fill="none" stroke="#E0556E" stroke-width="14"/>
    <rect x="35" y="95" width="60" height="40" rx="8" fill="#ffffff"/>
  </g>
  <text x="300" y="360" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="48" fill="#1a1a1a">책가방</text>
  <text x="300" y="424" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" fill="#555">무게 분산 · 넉넉한 수납</text>
  <text x="300" y="472" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" fill="#555">어깨·등 쿠션 처리 확인</text>

  <!-- 카드2 실내화 -->
  <rect x="60" y="530" width="960" height="230" rx="24" fill="#ffffff" stroke="#F3C6CF" stroke-width="2"/>
  <g transform="translate(120,600)">
    <path d="M0 70 q0 -50 60 -50 l60 0 q40 0 40 40 l0 20 q0 20 -30 20 l-100 0 q-30 0 -30 -30 z" fill="#2E9E6B"/>
    <rect x="-2" y="86" width="172" height="14" rx="6" fill="#1c6e4a"/>
  </g>
  <text x="300" y="620" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="48" fill="#1a1a1a">실내화</text>
  <text x="300" y="684" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" fill="#555">미끄럼 방지(논슬립) 기능</text>
  <text x="300" y="732" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" fill="#555">흰색 단화는 세탁이 편함</text>

  <!-- 카드3 신발주머니 -->
  <rect x="60" y="790" width="960" height="230" rx="24" fill="#ffffff" stroke="#F3C6CF" stroke-width="2"/>
  <g transform="translate(120,845)">
    <rect x="10" y="30" width="130" height="130" rx="18" fill="#F0A93C"/>
    <path d="M25 30 l50 -22 l50 22" fill="none" stroke="#c77f14" stroke-width="10"/>
    <line x1="40" y1="30" x2="40" y2="160" stroke="#c77f14" stroke-width="6"/>
    <line x1="110" y1="30" x2="110" y2="160" stroke="#c77f14" stroke-width="6"/>
  </g>
  <text x="300" y="880" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="48" fill="#1a1a1a">운동화 · 신발주머니</text>
  <text x="300" y="944" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" fill="#555">체육 시간용 함께 준비</text>
  <text x="300" y="992" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" fill="#555">개학 전 발 사이즈 재확인</text>

  <!-- 꿀팁 띠 -->
  <rect x="60" y="1060" width="960" height="180" rx="20" fill="#FFE3AA"/>
  <text x="90" y="1130" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="40" fill="#8A5A00">TIP  방학 동안 발이 훌쩍 자랐을 수 있어요</text>
  <text x="90" y="1190" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" fill="#8A5A00">사기 전에 꼭 신겨보고 사이즈를 확인하세요</text>

  <text x="60" y="1315" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#B08894">blog.naver.com/trip_chocho</text>
</svg>
