<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#FFF4F6"/>
  <!-- 상단 색띠 -->
  <rect width="1080" height="200" fill="#E0556E"/>
  <text x="60" y="112" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">사기 전에 이 순서부터</text>
  <text x="60" y="168" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="38" fill="#FFD9E1">과다구매를 막는 절약의 핵심</text>

  <!-- 두 칸 비교: 재사용 -->
  <rect x="60" y="270" width="450" height="820" rx="24" fill="#ffffff" stroke="#F3C6CF" stroke-width="2"/>
  <rect x="60" y="270" width="450" height="96" rx="24" fill="#2E9E6B"/>
  <rect x="60" y="322" width="450" height="44" fill="#2E9E6B"/>
  <text x="285" y="332" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="44" fill="#ffffff" text-anchor="middle">그대로 재사용</text>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="40" fill="#1a1a1a">
    <text x="100" y="470">· 상태 좋은 책가방</text>
    <text x="100" y="558">· 쓸 만한 필통</text>
    <text x="100" y="646">· 남은 연필·색연필</text>
    <text x="100" y="734">· 안 깨진 물통</text>
    <text x="100" y="822">· 여분 이름 스티커</text>
    <text x="100" y="910">· 맞는 실내화·운동화</text>
  </g>
  <text x="285" y="1030" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#2E9E6B" text-anchor="middle">먼저 열어서 점검!</text>

  <!-- 두 칸 비교: 새로 구입 -->
  <rect x="570" y="270" width="450" height="820" rx="24" fill="#ffffff" stroke="#F3C6CF" stroke-width="2"/>
  <rect x="570" y="270" width="450" height="96" rx="24" fill="#E0556E"/>
  <rect x="570" y="322" width="450" height="44" fill="#E0556E"/>
  <text x="795" y="332" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="44" fill="#ffffff" text-anchor="middle">부족한 것만 구입</text>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="40" fill="#1a1a1a">
    <text x="610" y="470">· 다 쓴 소모품</text>
    <text x="610" y="558">· 발에 안 맞는 신발</text>
    <text x="610" y="646">· 파손된 가방·물통</text>
    <text x="610" y="734">· 못 나오는 펜</text>
    <text x="610" y="822">· 모자란 이름 스티커</text>
    <text x="610" y="910">· 학교 안내 준비물</text>
  </g>
  <text x="795" y="1030" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#E0556E" text-anchor="middle">가정통신문 확인 후!</text>

  <!-- 하단 원칙 띠 -->
  <rect x="60" y="1140" width="960" height="96" rx="20" fill="#FFE3AA"/>
  <text x="540" y="1200" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="42" fill="#8A5A00" text-anchor="middle">쓸 수 있는 건 쓰고, 부족한 것만 채운다</text>

  <text x="60" y="1315" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#B08894">blog.naver.com/trip_chocho</text>
</svg>
