<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7C97"/>
      <stop offset="1" stop-color="#E0556E"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- 장식 도형 -->
  <circle cx="950" cy="170" r="260" fill="#ffffff" opacity="0.10"/>
  <circle cx="120" cy="960" r="220" fill="#ffffff" opacity="0.07"/>
  <circle cx="900" cy="900" r="120" fill="#FFD23F" opacity="0.18"/>

  <!-- 카테고리 뱃지 -->
  <rect x="80" y="88" rx="34" ry="34" width="230" height="68" fill="#FFD23F"/>
  <text x="195" y="134" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="36" fill="#8A2740" text-anchor="middle">신학기 준비</text>

  <!-- 서브 카피 -->
  <text x="80" y="285" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#FFE9EE">2026 초등 2학기 개학</text>

  <!-- 메인 카피 -->
  <text x="80" y="440" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="132" fill="#ffffff">개학 2주 전</text>
  <text x="80" y="590" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="132" fill="#FFD23F">준비물 체크</text>

  <!-- 항목 알약 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="40" fill="#E0556E" text-anchor="middle">
    <rect x="80"  y="660" rx="26" width="230" height="76" fill="#ffffff"/>
    <text x="195" y="712">책가방</text>
    <rect x="330" y="660" rx="26" width="230" height="76" fill="#ffffff"/>
    <text x="445" y="712">실내화</text>
    <rect x="580" y="660" rx="26" width="200" height="76" fill="#ffffff"/>
    <text x="680" y="712">필통</text>
    <rect x="800" y="660" rx="26" width="200" height="76" fill="#ffffff"/>
    <text x="900" y="712">물통</text>
  </g>

  <!-- 디테일 박스 -->
  <rect x="80" y="778" rx="20" ry="20" width="920" height="150" fill="#ffffff" opacity="0.16"/>
  <text x="110" y="842" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="46" fill="#ffffff">안 사도 될 것까지 한눈에 정리</text>
  <text x="110" y="900" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="40" fill="#FFE9EE">있는 것 점검 → 부족한 것만 구입</text>

  <!-- 채널 -->
  <text x="80" y="1010" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="34" fill="#FFE9EE" opacity="0.9">blog.naver.com/trip_chocho</text>
</svg>
