<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#FFF4F6"/>
  <rect width="1080" height="200" fill="#E0556E"/>
  <text x="60" y="112" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">필통 · 학용품 세트</text>
  <text x="60" y="168" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="38" fill="#FFD9E1">필통에 기본으로 챙길 것</text>

  <!-- 학용품 아이콘 줄 -->
  <g transform="translate(0,0)">
    <!-- 연필 -->
    <g transform="translate(150,300)">
      <rect x="0" y="0" width="44" height="160" fill="#FFC94D"/>
      <polygon points="0,160 44,160 22,210" fill="#F4A0B0"/>
      <polygon points="8,192 36,192 22,210" fill="#3a3a3a"/>
      <rect x="0" y="0" width="44" height="30" fill="#E0556E"/>
    </g>
    <!-- 지우개 -->
    <g transform="translate(300,340)">
      <rect x="0" y="0" width="120" height="70" rx="10" fill="#ffffff" stroke="#F3C6CF" stroke-width="3"/>
      <rect x="0" y="0" width="120" height="26" rx="10" fill="#7EC0F0"/>
    </g>
    <!-- 색연필 -->
    <g transform="translate(470,300)">
      <rect x="0" y="0" width="34" height="150" fill="#7BC96F"/><polygon points="0,150 34,150 17,190" fill="#eee"/>
      <rect x="42" y="0" width="34" height="150" fill="#F0A93C"/><polygon points="42,150 76,150 59,190" fill="#eee"/>
      <rect x="84" y="0" width="34" height="150" fill="#9B6FD0"/><polygon points="84,150 118,150 101,190" fill="#eee"/>
    </g>
    <!-- 가위 -->
    <g transform="translate(640,320)">
      <circle cx="20" cy="30" r="22" fill="none" stroke="#4B8FE0" stroke-width="12"/>
      <circle cx="20" cy="120" r="22" fill="none" stroke="#4B8FE0" stroke-width="12"/>
      <line x1="35" y1="45" x2="120" y2="120" stroke="#9aa" stroke-width="10"/>
      <line x1="35" y1="105" x2="120" y2="30" stroke="#9aa" stroke-width="10"/>
    </g>
    <!-- 풀 -->
    <g transform="translate(800,300)">
      <rect x="0" y="40" width="70" height="150" rx="12" fill="#E0556E"/>
      <rect x="10" y="10" width="50" height="40" rx="8" fill="#F4A0B0"/>
    </g>
  </g>

  <!-- 리스트 박스 -->
  <rect x="60" y="560" width="960" height="460" rx="24" fill="#ffffff" stroke="#F3C6CF" stroke-width="2"/>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="42" fill="#1a1a1a">
    <circle cx="105" cy="643" r="9" fill="#E0556E"/><text x="135" y="658">연필 · 지우개 · 연필캡</text>
    <circle cx="105" cy="733" r="9" fill="#E0556E"/><text x="135" y="748">색연필 · 삼색볼펜 · 네임펜</text>
    <circle cx="105" cy="823" r="9" fill="#E0556E"/><text x="135" y="838">공책(국어·수학·알림장·받아쓰기)</text>
    <circle cx="105" cy="913" r="9" fill="#E0556E"/><text x="135" y="928">스케치북 · 색종이 · 책받침</text>
  </g>

  <!-- 포인트 띠 -->
  <rect x="60" y="1060" width="960" height="180" rx="20" fill="#FFE3AA"/>
  <text x="90" y="1130" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="40" fill="#8A5A00">연필은 HB 또는 B가 적당</text>
  <text x="90" y="1190" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="38" fill="#8A5A00">투명 필통이면 내용물이 한눈에 보여 편리</text>

  <text x="60" y="1315" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#B08894">blog.naver.com/trip_chocho</text>
</svg>
