<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#FBF5EF"/>
  <!-- 상단 색띠 -->
  <rect width="1080" height="200" fill="#E8722C"/>
  <text x="60" y="118" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">실내 적정 습도 한눈에</text>
  <text x="60" y="170" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="normal"
        font-size="38" fill="#FFE9D6">곰팡이 예방의 출발점은 60% 이하</text>

  <!-- 습도 구간 막대 -->
  <g font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
    <!-- 40% 이하 -->
    <rect x="60" y="280" width="960" height="150" rx="18" fill="#ffffff" stroke="#EAD9C7"/>
    <rect x="60" y="280" width="14" height="150" rx="7" fill="#5AA9C9"/>
    <text x="110" y="345" font-size="52" font-weight="bold" fill="#1a1a1a">40% 이하</text>
    <text x="110" y="400" font-size="38" fill="#5B6B7C">바이러스 활동이 활발해짐</text>

    <!-- 40~60% 권장 -->
    <rect x="60" y="450" width="960" height="180" rx="18" fill="#EAF6EE" stroke="#2E9DB0" stroke-width="3"/>
    <rect x="60" y="450" width="14" height="180" rx="7" fill="#1F8A53"/>
    <rect x="770" y="480" width="220" height="60" rx="30" fill="#1F8A53"/>
    <text x="880" y="522" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">권장 구간</text>
    <text x="110" y="535" font-size="56" font-weight="bold" fill="#1F8A53">40~60%</text>
    <text x="110" y="595" font-size="38" fill="#3a5a48">곰팡이·바이러스 모두 억제</text>

    <!-- 60% 이상 -->
    <rect x="60" y="650" width="960" height="150" rx="18" fill="#FDECEC" stroke="#E5A5A5"/>
    <rect x="60" y="650" width="14" height="150" rx="7" fill="#E23B3B"/>
    <text x="110" y="715" font-size="52" font-weight="bold" fill="#C0392B">60% 이상</text>
    <text x="110" y="770" font-size="38" fill="#8a4a44">곰팡이가 서식하기 시작</text>

    <!-- 장마철 평균 -->
    <rect x="60" y="820" width="960" height="150" rx="18" fill="#ffffff" stroke="#EAD9C7"/>
    <rect x="60" y="820" width="14" height="150" rx="7" fill="#7B8794"/>
    <text x="110" y="885" font-size="52" font-weight="bold" fill="#1a1a1a">장마철 평균</text>
    <text x="110" y="940" font-size="38" fill="#5B6B7C">약 90%까지 상승</text>
  </g>

  <!-- 핵심 메시지 -->
  <rect x="60" y="1010" width="960" height="200" rx="20" fill="#E8722C"/>
  <text x="540" y="1090" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold"
        font-size="52" fill="#ffffff" text-anchor="middle">"60% 이하 유지"</text>
  <text x="540" y="1160" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold"
        font-size="44" fill="#FFD23F" text-anchor="middle">이것만 기억하세요</text>

  <!-- 출처 띠 -->
  <rect x="0" y="1270" width="1080" height="80" fill="#EFE4D8"/>
  <text x="60" y="1322" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="32" fill="#7a6a58">출처: 정책브리핑·미국 EPA 한국어 자료(상한 60% 공통)</text>
</svg>
