<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="hd7" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2A4E"/>
      <stop offset="1" stop-color="#164B86"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="#EEF5FC"/>
  <rect width="1080" height="230" fill="url(#hd7)"/>
  <rect x="60" y="52" rx="26" ry="26" width="180" height="56" fill="#5FE0C8"/>
  <text x="150" y="90" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="30" fill="#0E2A4E" text-anchor="middle">생활꿀팁</text>
  <text x="60" y="185" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">상황별 열대야 숙면 정리</text>

  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <!-- 1 -->
    <rect x="60" y="290" width="960" height="220" rx="20" fill="#ffffff" stroke="#D3E2F2"/>
    <text x="100" y="360" font-size="38" font-weight="bold" fill="#1E5FA8">Q. 밤새 에어컨 트니 새벽에 춥고 개운치 않다면?</text>
    <text x="100" y="440" font-size="42" font-weight="bold" fill="#0E2A4E">→ 26℃ + 취침모드 + 서큘 간접풍</text>

    <!-- 2 -->
    <rect x="60" y="530" width="960" height="220" rx="20" fill="#ffffff" stroke="#D3E2F2"/>
    <text x="100" y="600" font-size="38" font-weight="bold" fill="#1E5FA8">Q. 온도는 맞췄는데 눅눅해서 축축하다면?</text>
    <text x="100" y="680" font-size="42" font-weight="bold" fill="#0E2A4E">→ 제습부터! 습도 50~60%면 체감 2~3℃↓</text>

    <!-- 3 -->
    <rect x="60" y="770" width="960" height="220" rx="20" fill="#ffffff" stroke="#D3E2F2"/>
    <text x="100" y="840" font-size="38" font-weight="bold" fill="#1E5FA8">Q. 찬물로 씻고 자도 금방 다시 더워진다면?</text>
    <text x="100" y="920" font-size="42" font-weight="bold" fill="#0E2A4E">→ 취침 1~2h 전 미지근한 물(36~38℃)+발 씻기</text>

    <!-- 4 -->
    <rect x="60" y="1010" width="960" height="220" rx="20" fill="#ffffff" stroke="#D3E2F2"/>
    <text x="100" y="1080" font-size="38" font-weight="bold" fill="#1E5FA8">Q. 바닥·침구 열기가 문제라면?</text>
    <text x="100" y="1160" font-size="42" font-weight="bold" fill="#0E2A4E">→ 냉감 패드·쿨매트(몸보다 큰 사이즈)</text>
  </g>

  <rect x="0" y="1270" width="1080" height="80" fill="#DCE9F5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#5B6B7C">출처: draft 본문 요약 · blog.naver.com/trip_chocho</text>
</svg>
