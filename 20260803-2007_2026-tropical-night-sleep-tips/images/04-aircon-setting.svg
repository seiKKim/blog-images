<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="hd4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E2A4E"/>
      <stop offset="1" stop-color="#164B86"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="#EEF5FC"/>
  <rect width="1080" height="230" fill="url(#hd4)"/>
  <rect x="60" y="52" rx="26" ry="26" width="180" height="56" fill="#5FE0C8"/>
  <text x="150" y="90" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="30" fill="#0E2A4E" text-anchor="middle">생활꿀팁</text>
  <text x="60" y="185" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#ffffff">냉방병 없이 시원한 취침 세팅</text>

  <!-- 방 그림 박스 -->
  <rect x="60" y="290" width="960" height="470" rx="24" fill="#ffffff" stroke="#D3E2F2"/>
  <!-- 에어컨 -->
  <rect x="120" y="340" width="330" height="120" rx="16" fill="#DCE9F5" stroke="#B7CEE6"/>
  <rect x="140" y="420" width="290" height="18" rx="9" fill="#8FB4DC"/>
  <text x="285" y="405" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#1E5FA8" text-anchor="middle">26℃</text>
  <text x="285" y="500" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#0E2A4E" text-anchor="middle">에어컨 취침모드</text>
  <!-- 간접풍 화살표 (수평, 위로) -->
  <path d="M150 445 q 120 -30 240 -70" stroke="#5FE0C8" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M380 372 l 18 6 l -14 14 z" fill="#5FE0C8"/>

  <!-- 서큘레이터 -->
  <g transform="translate(720,360)">
    <circle cx="90" cy="90" r="88" fill="#EAF3FB" stroke="#B7CEE6"/>
    <circle cx="90" cy="90" r="26" fill="#8FB4DC"/>
    <path d="M90 90 q 40 -60 60 -20 q -30 30 -60 20" fill="#BFE3FF"/>
    <path d="M90 90 q 60 40 20 60 q -30 -30 -20 -60" fill="#BFE3FF"/>
    <path d="M90 90 q -40 60 -60 20 q 30 -30 60 -20" fill="#BFE3FF"/>
    <path d="M90 90 q -60 -40 -20 -60 q 30 30 20 60" fill="#BFE3FF"/>
    <rect x="78" y="178" width="24" height="70" fill="#B7CEE6"/>
    <rect x="50" y="248" width="80" height="16" rx="8" fill="#B7CEE6"/>
  </g>
  <!-- 천장 방향 화살표 -->
  <path d="M810 340 l 0 -50" stroke="#5FE0C8" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M810 288 l -12 20 l 24 0 z" fill="#5FE0C8"/>
  <text x="810" y="560" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#0E2A4E" text-anchor="middle">서큘레이터 천장 향해</text>
  <text x="540" y="690" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="42" fill="#159C7E" text-anchor="middle">= 몸에 직접 안 닿는 '간접풍'</text>

  <!-- 세팅 리스트 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <rect x="60" y="800" width="960" height="110" rx="16" fill="#ffffff" stroke="#D3E2F2"/>
    <text x="100" y="855" font-size="40" font-weight="bold" fill="#0E2A4E">에어컨 26℃ + 취침모드</text>
    <text x="990" y="855" font-size="34" fill="#3A5570" text-anchor="end">새벽 냉방병 예방</text>

    <rect x="60" y="930" width="960" height="110" rx="16" fill="#ffffff" stroke="#D3E2F2"/>
    <text x="100" y="985" font-size="40" font-weight="bold" fill="#0E2A4E">날개 수평 · 서큘 천장 방향</text>
    <text x="990" y="985" font-size="34" fill="#3A5570" text-anchor="end">은은한 대류</text>

    <rect x="60" y="1060" width="960" height="110" rx="16" fill="#ffffff" stroke="#D3E2F2"/>
    <text x="100" y="1115" font-size="40" font-weight="bold" fill="#0E2A4E">선풍기 초미풍 병행</text>
    <text x="990" y="1115" font-size="34" fill="#3A5570" text-anchor="end">찬바람 직접 X</text>
  </g>

  <rect x="0" y="1270" width="1080" height="80" fill="#DCE9F5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#5B6B7C">출처: draft 본문(매체 소개 취침 세팅) 기준 · 전기세 절감률은 참고용</text>
</svg>
