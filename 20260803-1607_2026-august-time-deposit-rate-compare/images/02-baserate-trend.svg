<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="200" fill="#243B6B"/>
  <text x="60" y="112" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#ffffff">한국은행 기준금리 추이</text>
  <text x="60" y="168" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="36" fill="#FFD23F">인하기가 아니라 '인상 전환기'</text>

  <!-- 그래프 영역 -->
  <!-- 축 -->
  <line x1="150" y1="1000" x2="1000" y2="1000" stroke="#B8C6D6" stroke-width="3"/>
  <line x1="150" y1="360" x2="150" y2="1000" stroke="#B8C6D6" stroke-width="3"/>

  <!-- y축 라벨 -->
  <text x="130" y="430" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" fill="#5B6B7C" text-anchor="end">2.75%</text>
  <text x="130" y="720" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" fill="#5B6B7C" text-anchor="end">2.50%</text>
  <line x1="150" y1="420" x2="1000" y2="420" stroke="#E1E8F0" stroke-width="2"/>
  <line x1="150" y1="710" x2="1000" y2="710" stroke="#E1E8F0" stroke-width="2"/>

  <!-- 동결 구간 (14개월) 라인 : 2.50% -->
  <polyline points="230,710 500,710 760,710" fill="none" stroke="#243B6B" stroke-width="10" stroke-linecap="round"/>
  <!-- 인상 (2026-07) -->
  <polyline points="760,710 830,420 940,420" fill="none" stroke="#E23B3B" stroke-width="10" stroke-linecap="round"/>

  <!-- 점 -->
  <circle cx="230" cy="710" r="12" fill="#243B6B"/>
  <circle cx="500" cy="710" r="12" fill="#243B6B"/>
  <circle cx="760" cy="710" r="12" fill="#243B6B"/>
  <circle cx="940" cy="420" r="16" fill="#E23B3B"/>

  <!-- 동결 구간 표시 -->
  <text x="495" y="780" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="34" fill="#5B6B7C" text-anchor="middle">약 14개월 동결</text>

  <!-- 인상 라벨 -->
  <text x="940" y="390" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="38" fill="#E23B3B" text-anchor="middle">+0.25%p</text>

  <!-- x축 라벨 -->
  <text x="230" y="1050" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" fill="#5B6B7C" text-anchor="middle">2025년 인하</text>
  <text x="940" y="1050" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="30" fill="#E23B3B" text-anchor="middle">2026-07-16</text>

  <!-- 하단 핵심 박스 -->
  <rect x="60" y="1110" width="960" height="130" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
  <text x="90" y="1170" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="40" fill="#243B6B">2.50% → 2.75% 인상 · 다음 금통위 2026-08-27</text>
  <text x="90" y="1218" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#5B6B7C">추가 인상 여부는 미확정 — 만기 분산으로 대비</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#5B6B7C">출처: 한국은행 금융통화위원회(2026-07-16) · 본문 기준</text>
</svg>
