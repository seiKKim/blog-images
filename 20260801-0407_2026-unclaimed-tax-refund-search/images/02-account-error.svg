<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="200" fill="#1F8A53"/>
  <text x="60" y="105" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="56" fill="#ffffff">환급금이 왜 안 들어왔을까?</text>
  <text x="60" y="165" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="40" fill="#D6EFE0">계좌 오류로 이체가 반송되는 경우</text>

  <!-- 흐름: 환급 결정 -> 계좌 오류 -> 반송 -> 미수령 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <!-- 1 -->
    <rect x="80" y="280" width="920" height="150" rx="20" fill="#ffffff" stroke="#D6E0EC"/>
    <circle cx="160" cy="355" r="42" fill="#1F8A53"/>
    <text x="160" y="372" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="240" y="345" font-size="46" font-weight="bold" fill="#1a1a1a">환급 결정</text>
    <text x="240" y="400" font-size="34" fill="#5B6B7C">종소세·부가세 신고, 장려금 신청 등</text>

    <!-- 화살표 -->
    <text x="540" y="480" font-size="46" fill="#1F8A53" text-anchor="middle">▼</text>

    <!-- 2 -->
    <rect x="80" y="510" width="920" height="210" rx="20" fill="#FFF3E0" stroke="#F0C98A"/>
    <circle cx="160" cy="565" r="42" fill="#E8722C"/>
    <text x="160" y="582" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="240" y="580" font-size="46" font-weight="bold" fill="#1a1a1a">계좌 오류 발생</text>
    <text x="110" y="640" font-size="34" fill="#5B6B7C">· 계좌번호 한 자리라도 잘못 입력</text>
    <text x="110" y="685" font-size="34" fill="#5B6B7C">· 이미 해지된 계좌 · 타인 명의 계좌 기재</text>

    <!-- 화살표 -->
    <text x="540" y="770" font-size="46" fill="#1F8A53" text-anchor="middle">▼</text>

    <!-- 3 -->
    <rect x="80" y="800" width="920" height="150" rx="20" fill="#ffffff" stroke="#D6E0EC"/>
    <circle cx="160" cy="875" r="42" fill="#1F8A53"/>
    <text x="160" y="892" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="240" y="865" font-size="46" font-weight="bold" fill="#1a1a1a">이체 반송</text>
    <text x="240" y="920" font-size="34" fill="#5B6B7C">시스템상 이체 불가 → 환급금 되돌아옴</text>

    <!-- 화살표 -->
    <text x="540" y="1000" font-size="46" fill="#1F8A53" text-anchor="middle">▼</text>

    <!-- 4 -->
    <rect x="80" y="1030" width="920" height="160" rx="20" fill="#E9F5EE" stroke="#1F8A53"/>
    <circle cx="160" cy="1110" r="42" fill="#E23B3B"/>
    <text x="160" y="1127" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="240" y="1090" font-size="46" font-weight="bold" fill="#1a1a1a">미수령 환급금으로 보관</text>
    <text x="240" y="1145" font-size="34" fill="#5B6B7C">통지서 못 받았어도 직접 조회해야 확인 가능</text>
  </g>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" fill="#5B6B7C">출처: 국세청 공식 안내 · blog.naver.com/trip_chocho</text>
</svg>
