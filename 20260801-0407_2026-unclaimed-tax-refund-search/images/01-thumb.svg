  <!-- 채널 3종 칩 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="42" fill="#1F8A53">
    <rect x="80" y="690" rx="18" ry="18" width="270" height="86" fill="#ffffff"/>
