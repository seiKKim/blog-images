<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#FBF4EC"/>
  <!-- 상단 색띠 + 제목 -->
  <rect width="1080" height="200" fill="#E8722C"/>
  <text x="60" y="103" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="800"
        font-size="60" fill="#ffffff">냉장고 칸별 보관 위치</text>
  <text x="60" y="163" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold"
        font-size="38" fill="#FFE7CF">차가운 순서: 냉동실 안 → 냉장실 안 → 문 쪽</text>

  <!-- 냉장고 본체 -->
  <g>
    <!-- 냉동실 -->
    <rect x="70" y="250" width="620" height="240" rx="18" fill="#DCE9F5" stroke="#9BB8D6" stroke-width="3"/>
    <text x="100" y="322" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="800" font-size="42" fill="#1B5FA6">❄ 냉동실</text>
    <text x="100" y="380" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="34" fill="#33475B">냉동식품 · 밥/떡 · 육류 · 해산물</text>
    <text x="100" y="432" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold" font-size="32" fill="#D9611F">밀폐용기로 80~90%까지 채우면 효율↑</text>

    <!-- 냉장실 상단 -->
    <rect x="70" y="510" width="620" height="170" rx="18" fill="#ffffff" stroke="#E3C8AC" stroke-width="3"/>
    <text x="100" y="574" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="800" font-size="40" fill="#E8722C">냉장실 상단</text>
    <text x="100" y="628" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="33" fill="#33475B">채소 손질품 · 소스류 · 유제품 · 가공식품</text>

    <!-- 냉장실 안쪽·하단 (가장 차가움) -->
    <rect x="70" y="700" width="620" height="180" rx="18" fill="#FFF0E1" stroke="#E8722C" stroke-width="4"/>
    <text x="100" y="766" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="800" font-size="40" fill="#D9611F">냉장실 안쪽·하단 (가장 차가움)</text>
    <text x="100" y="822" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold" font-size="34" fill="#C0392B">★ 육류·어패류 · 2~3일 내 먹을 것 · 김치</text>

    <!-- 신선실 -->
    <rect x="70" y="900" width="620" height="150" rx="18" fill="#EAF6EC" stroke="#8FC79C" stroke-width="3"/>
    <text x="100" y="962" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="800" font-size="40" fill="#1F8A53">신선실(야채칸)</text>
    <text x="100" y="1014" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="33" fill="#33475B">야채 · 과일 (키친타월 깔면 오래감)</text>
  </g>

  <!-- 문 쪽 사이드바 -->
  <rect x="710" y="510" width="300" height="540" rx="18" fill="#FDECEC" stroke="#E6A9A9" stroke-width="3"/>
  <text x="860" y="574" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="800" font-size="38" fill="#C0392B" text-anchor="middle">문 쪽</text>
  <text x="860" y="628" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="30" fill="#8a4a4a" text-anchor="middle">온도 변화 큼</text>
  <text x="860" y="712" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold" font-size="34" fill="#33475B" text-anchor="middle">달걀 · 우유</text>
  <text x="860" y="770" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold" font-size="34" fill="#33475B" text-anchor="middle">음료 · 소스</text>
  <text x="860" y="828" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold" font-size="34" fill="#33475B" text-anchor="middle">잼 · 각종 소스</text>
  <line x1="740" y1="870" x2="980" y2="870" stroke="#E6A9A9" stroke-width="2"/>
  <text x="860" y="928" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold" font-size="30" fill="#C0392B" text-anchor="middle">금방 먹을 것만!</text>
  <text x="860" y="978" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="28" fill="#8a4a4a" text-anchor="middle">육류·어패류</text>
  <text x="860" y="1016" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="28" fill="#8a4a4a" text-anchor="middle">두지 말 것</text>

  <!-- 핵심 강조 박스 -->
  <rect x="70" y="1088" width="940" height="150" rx="20" fill="#E8722C"/>
  <text x="540" y="1158" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="800" font-size="42" fill="#ffffff" text-anchor="middle">냉장실은 70% 이하로,</text>
  <text x="540" y="1210" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="800" font-size="42" fill="#FFD23F" text-anchor="middle">냉동실은 80~90%까지 채우기</text>

  <!-- 하단 출처 띠 -->
  <rect x="0" y="1270" width="1080" height="80" fill="#F0E1D0"/>
  <text x="60" y="1322" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="32" fill="#8a6a4a">여름철 냉장고 정리 · 칸별 보관 위치 정리</text>
</svg>
