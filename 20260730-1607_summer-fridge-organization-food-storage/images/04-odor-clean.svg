<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#FBF4EC"/>
  <!-- 상단 색띠 + 제목 -->
  <rect width="1080" height="200" fill="#E8722C"/>
  <text x="60" y="103" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="800"
        font-size="60" fill="#ffffff">냄새·세균 관리 핵심</text>
  <text x="60" y="163" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold"
        font-size="38" fill="#FFE7CF">냄새 나기 전 정기 점검이 정답</text>

  <!-- 베이킹소다 탈취 카드 -->
  <rect x="60" y="250" width="960" height="230" rx="20" fill="#ffffff" stroke="#E3C8AC" stroke-width="3"/>
  <circle cx="160" cy="365" r="58" fill="#FFF0E1"/>
  <text x="160" y="385" font-size="60" text-anchor="middle">🧂</text>
  <text x="250" y="340" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="800" font-size="46" fill="#D9611F">베이킹소다 탈취</text>
  <text x="250" y="400" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="35" fill="#33475B">밥그릇 용기에 2~3큰술 담아 구석에</text>
  <text x="250" y="450" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="35" fill="#33475B">원두커피 가루·활성탄·레몬도 OK</text>

  <!-- 주 1회 청소 카드 -->
  <rect x="60" y="500" width="960" height="230" rx="20" fill="#ffffff" stroke="#E3C8AC" stroke-width="3"/>
  <circle cx="160" cy="615" r="58" fill="#EAF6EC"/>
  <text x="160" y="635" font-size="58" text-anchor="middle">🧽</text>
  <text x="250" y="590" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="800" font-size="46" fill="#1F8A53">주 1회 청소</text>
  <text x="250" y="650" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="35" fill="#33475B">야채칸·고기칸, 문 고무 패킹, 선반 틈</text>
  <text x="250" y="700" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="35" fill="#33475B">습기 많은 곳 꼼꼼히</text>

  <!-- 라벨링 FIFO 카드 -->
  <rect x="60" y="750" width="960" height="230" rx="20" fill="#ffffff" stroke="#E3C8AC" stroke-width="3"/>
  <circle cx="160" cy="865" r="58" fill="#DCE9F5"/>
  <text x="160" y="885" font-size="58" text-anchor="middle">🏷</text>
  <text x="250" y="840" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="800" font-size="46" fill="#1B5FA6">라벨링 + 선입선출</text>
  <text x="250" y="900" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="35" fill="#33475B">개봉·조리 날짜 표시 (마스킹테이프)</text>
  <text x="250" y="950" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="35" fill="#33475B">새 것은 뒤로, 기존 것은 앞으로</text>

  <!-- 주의 박스 -->
  <rect x="60" y="1010" width="960" height="200" rx="20" fill="#FDECEC" stroke="#E6A9A9" stroke-width="3"/>
  <text x="100" y="1080" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="800" font-size="42" fill="#C0392B">⚠ 이렇게는 하지 마세요</text>
  <text x="100" y="1138" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="35" fill="#8a4a4a">· 베이킹소다 + 식초 동시 사용 → 세정력↓</text>
  <text x="100" y="1186" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="35" fill="#8a4a4a">· "냄새 날 때 청소 시작" → 이미 늦음</text>

  <!-- 하단 출처 띠 -->
  <rect x="0" y="1270" width="1080" height="80" fill="#F0E1D0"/>
  <text x="60" y="1322" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="32" fill="#8a6a4a">여름철 냉장고 냄새·세균 관리 정리</text>
</svg>
