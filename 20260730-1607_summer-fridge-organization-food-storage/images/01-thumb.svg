<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0822F"/>
      <stop offset="1" stop-color="#D9611F"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- 장식 도형 -->
  <circle cx="960" cy="170" r="260" fill="#ffffff" opacity="0.08"/>
  <circle cx="110" cy="990" r="210" fill="#ffffff" opacity="0.06"/>

  <!-- 카테고리 뱃지 -->
  <rect x="80" y="88" rx="34" ry="34" width="220" height="68" fill="#FFD23F"/>
  <text x="190" y="134" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold"
        font-size="38" fill="#5A2A00" text-anchor="middle">생활꿀팁</text>

  <!-- 폭염 경보 뱃지 -->
  <rect x="316" y="88" rx="34" ry="34" width="330" height="68" fill="#E23B3B"/>
  <text x="481" y="134" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold"
        font-size="36" fill="#ffffff" text-anchor="middle">폭염 위기경보 '심각'</text>

  <!-- 서브 카피 -->
  <text x="80" y="300" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold"
        font-size="58" fill="#FFF0DC">냉장고만 믿으면 위험한 계절</text>

  <!-- 메인 카피 -->
  <text x="80" y="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="800"
        font-size="118" fill="#ffffff">여름철 냉장고</text>
  <text x="80" y="570" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="800"
        font-size="118" fill="#FFD23F">정리 & 보관법</text>

  <!-- 핵심 숫자 카드 3개 -->
  <g font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
    <rect x="80" y="640" rx="24" width="290" height="200" fill="#ffffff" opacity="0.16"/>
    <text x="225" y="720" font-size="76" font-weight="800" fill="#FFD23F" text-anchor="middle">5℃</text>
    <text x="225" y="785" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">냉장 이하 유지</text>

    <rect x="395" y="640" rx="24" width="290" height="200" fill="#ffffff" opacity="0.16"/>
    <text x="540" y="720" font-size="76" font-weight="800" fill="#FFD23F" text-anchor="middle">70%</text>
    <text x="540" y="785" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">냉장실 채우기</text>

    <rect x="710" y="640" rx="24" width="290" height="200" fill="#ffffff" opacity="0.16"/>
    <text x="855" y="720" font-size="72" font-weight="800" fill="#FFD23F" text-anchor="middle">-18℃</text>
    <text x="855" y="785" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">냉동 이하 유지</text>
  </g>

  <!-- 디테일 띠 -->
  <rect x="80" y="878" rx="20" ry="20" width="920" height="104" fill="#ffffff" opacity="0.15"/>
  <text x="540" y="944" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold"
        font-size="44" fill="#ffffff" text-anchor="middle">7월 식중독 정점 · 온도·위치·기간까지</text>

  <!-- 채널 -->
  <text x="80" y="1035" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="normal"
        font-size="32" fill="#FFF0DC" opacity="0.9">blog.naver.com/trip_chocho</text>
</svg>
