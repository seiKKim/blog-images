<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#FBF4EC"/>
  <!-- 상단 색띠 + 제목 -->
  <rect width="1080" height="200" fill="#E8722C"/>
  <text x="60" y="103" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="800"
        font-size="60" fill="#ffffff">식재료별 보관 기간</text>
  <text x="60" y="163" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold"
        font-size="36" fill="#FFE7CF">냉장 4℃ · 냉동 -18℃ 이하 기준 (권장치)</text>

  <!-- 표 헤더 -->
  <g font-family="'Noto Sans KR','Malgun Gothic',sans-serif">
    <rect x="60" y="240" width="500" height="90" rx="14" fill="#5A2A00"/>
    <rect x="572" y="240" width="216" height="90" rx="14" fill="#5A2A00"/>
    <rect x="800" y="240" width="216" height="90" rx="14" fill="#5A2A00"/>
    <text x="100" y="300" font-weight="bold" font-size="40" fill="#ffffff">식재료</text>
    <text x="680" y="300" font-weight="bold" font-size="40" fill="#FFD23F" text-anchor="middle">냉장</text>
    <text x="908" y="300" font-weight="bold" font-size="40" fill="#9BD3FF" text-anchor="middle">냉동</text>
  </g>

  <!-- 표 행 -->
  <g font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="38">
    <!-- 행 8개, 시작 y=344, 높이 108 -->
    <rect x="60" y="344" width="956" height="98" rx="12" fill="#ffffff" stroke="#E3C8AC"/>
    <text x="100" y="406" font-weight="bold" fill="#1a1a1a">다진 고기</text>
    <text x="680" y="406" font-weight="bold" fill="#D9611F" text-anchor="middle">3~5일</text>
    <text x="908" y="406" font-weight="bold" fill="#1B5FA6" text-anchor="middle">6개월</text>

    <rect x="60" y="452" width="956" height="98" rx="12" fill="#FCF3E9" stroke="#E3C8AC"/>
    <text x="100" y="514" font-weight="bold" fill="#1a1a1a">구이용 고기(스테이크)</text>
    <text x="680" y="514" font-weight="bold" fill="#D9611F" text-anchor="middle">1~2일</text>
    <text x="908" y="514" font-weight="bold" fill="#1B5FA6" text-anchor="middle">3~4개월</text>

    <rect x="60" y="560" width="956" height="98" rx="12" fill="#ffffff" stroke="#E3C8AC"/>
    <text x="100" y="622" font-weight="bold" fill="#1a1a1a">닭고기</text>
    <text x="680" y="622" font-weight="bold" fill="#D9611F" text-anchor="middle">1~2일</text>
    <text x="908" y="622" font-weight="bold" fill="#1B5FA6" text-anchor="middle">12개월</text>

    <rect x="60" y="668" width="956" height="98" rx="12" fill="#FCF3E9" stroke="#E3C8AC"/>
    <text x="100" y="730" font-weight="bold" fill="#1a1a1a">가공육(햄·베이컨)</text>
    <text x="680" y="730" font-weight="bold" fill="#D9611F" text-anchor="middle">5~7일</text>
    <text x="908" y="730" font-weight="bold" fill="#1B5FA6" text-anchor="middle">1~2개월</text>

    <rect x="60" y="776" width="956" height="98" rx="12" fill="#ffffff" stroke="#E3C8AC"/>
    <text x="100" y="838" font-weight="bold" fill="#1a1a1a">일반 생선</text>
    <text x="680" y="838" font-weight="bold" fill="#D9611F" text-anchor="middle">1~2일</text>
    <text x="908" y="838" font-weight="bold" fill="#1B5FA6" text-anchor="middle">1개월</text>

    <rect x="60" y="884" width="956" height="98" rx="12" fill="#FCF3E9" stroke="#E3C8AC"/>
    <text x="100" y="946" font-weight="bold" fill="#1a1a1a">조개·해산물</text>
    <text x="680" y="946" font-weight="bold" fill="#D9611F" text-anchor="middle">4일</text>
    <text x="908" y="946" font-weight="bold" fill="#1B5FA6" text-anchor="middle">12개월</text>

    <rect x="60" y="992" width="956" height="98" rx="12" fill="#ffffff" stroke="#E3C8AC"/>
    <text x="100" y="1054" font-weight="bold" fill="#1a1a1a">달걀</text>
    <text x="680" y="1054" font-weight="bold" fill="#D9611F" text-anchor="middle">3~5주</text>
    <text x="908" y="1054" font-weight="bold" fill="#8a8a8a" text-anchor="middle">—</text>

    <rect x="60" y="1100" width="956" height="98" rx="12" fill="#FCF3E9" stroke="#E3C8AC"/>
    <text x="100" y="1162" font-weight="bold" fill="#1a1a1a">버터 / 치즈(경성)</text>
    <text x="680" y="1162" font-weight="bold" font-size="32" fill="#D9611F" text-anchor="middle">6~9/6개월</text>
    <text x="908" y="1162" font-weight="bold" fill="#8a8a8a" text-anchor="middle">—</text>
  </g>

  <!-- 하단 강조 -->
  <text x="60" y="1250" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-weight="bold" font-size="34" fill="#C0392B">⚠ 해동한 식품 재냉동 금물 · 1회분씩 소분해 냉동</text>

  <!-- 하단 출처 띠 -->
  <rect x="0" y="1270" width="1080" height="80" fill="#F0E1D0"/>
  <text x="60" y="1322" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="32" fill="#8a6a4a">일반적 권장치 · 상태 따라 다를 수 있어요</text>
</svg>
