<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <rect width="1080" height="720" fill="#1B5FA6"/>
  <circle cx="960" cy="120" r="200" fill="#ffffff" opacity="0.07"/>
  <circle cx="90" cy="660" r="160" fill="#ffffff" opacity="0.06"/>

  <!-- 뱃지 -->
  <rect x="60" y="56" rx="30" ry="30" width="360" height="62" fill="#E23B3B"/>
  <text x="240" y="98" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#ffffff" text-anchor="middle">어린이 · 가족 동반 체크</text>

  <!-- 메인 카피 -->
  <text x="60" y="200" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="64" fill="#ffffff">몸에 맞는 구명조끼는</text>
  <text x="60" y="272" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="64" fill="#FFD23F">선택이 아닌 필수</text>

  <!-- 체크 3개 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <rect x="60" y="330" width="960" height="94" rx="16" fill="#ffffff" opacity="0.14"/>
    <text x="96" y="390" font-weight="bold" font-size="42" fill="#FFD23F">✓</text>
    <text x="150" y="390" font-weight="bold" font-size="40" fill="#ffffff">보호자와 함께 · 팔이 닿는 거리 안에서만</text>

    <rect x="60" y="438" width="960" height="94" rx="16" fill="#ffffff" opacity="0.14"/>
    <text x="96" y="498" font-weight="bold" font-size="42" fill="#FFD23F">✓</text>
    <text x="150" y="498" font-weight="bold" font-size="40" fill="#ffffff">끈·지퍼까지 채워 벗겨지지 않게 확인</text>

    <rect x="60" y="546" width="960" height="94" rx="16" fill="#ffffff" opacity="0.14"/>
    <text x="96" y="606" font-weight="bold" font-size="42" fill="#FFD23F">✓</text>
    <text x="150" y="606" font-weight="bold" font-size="40" fill="#ffffff">음식 먹은 뒤 최소 30분 지나서 입수</text>
  </g>

  <text x="60" y="686" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="28" fill="#E8EEF5" opacity="0.9">참고: 행정안전부 · 서울시 물놀이 안전 안내</text>
</svg>
