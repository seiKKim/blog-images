<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B5FA6"/>
      <stop offset="1" stop-color="#12406F"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- 장식 물결 도형 -->
  <circle cx="960" cy="150" r="240" fill="#ffffff" opacity="0.07"/>
  <circle cx="110" cy="990" r="200" fill="#ffffff" opacity="0.06"/>

  <!-- 카테고리 뱃지 -->
  <rect x="64" y="80" rx="34" ry="34" width="300" height="68" fill="#E23B3B"/>
  <text x="214" y="126" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="38" fill="#ffffff" text-anchor="middle">여름 물놀이 안전</text>

  <!-- 서브 카피 -->
  <text x="64" y="256" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="56" fill="#E8EEF5">최근 5년 물놀이 사망자</text>

  <!-- 메인 숫자 -->
  <text x="64" y="430" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="200" fill="#ffffff">104명</text>
  <text x="64" y="540" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="72" fill="#FFD23F">절반 이상이 지금 집중</text>
  <text x="64" y="610" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="48" fill="#E8EEF5">7월 말~8월 초에 54%(56명) 발생</text>

  <!-- 통계 3칸 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" text-anchor="middle">
    <rect x="64" y="670" width="290" height="200" rx="20" fill="#ffffff" opacity="0.14"/>
    <rect x="395" y="670" width="290" height="200" rx="20" fill="#ffffff" opacity="0.14"/>
    <rect x="726" y="670" width="290" height="200" rx="20" fill="#ffffff" opacity="0.14"/>
    <text x="209" y="770" font-weight="bold" font-size="86" fill="#FFD23F">31%</text>
    <text x="209" y="832" font-weight="bold" font-size="40" fill="#ffffff">하천</text>
    <text x="540" y="770" font-weight="bold" font-size="86" fill="#FFD23F">27%</text>
    <text x="540" y="832" font-weight="bold" font-size="40" fill="#ffffff">계곡</text>
    <text x="871" y="770" font-weight="bold" font-size="86" fill="#FFD23F">23%</text>
    <text x="871" y="832" font-weight="bold" font-size="40" fill="#ffffff">해수욕장</text>
  </g>

  <!-- 원인 강조 띠 -->
  <rect x="64" y="900" rx="20" ry="20" width="952" height="96" fill="#E23B3B"/>
  <text x="540" y="962" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="46" fill="#ffffff" text-anchor="middle">원인 1위 · 수영 미숙 40%</text>

  <!-- 출처 / 채널 -->
  <text x="64" y="1044" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="30" fill="#E8EEF5" opacity="0.9">자료: 행정안전부 2026.7.26  ·  blog.naver.com/trip_chocho</text>
</svg>
