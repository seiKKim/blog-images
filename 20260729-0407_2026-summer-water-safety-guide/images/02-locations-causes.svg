<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <!-- 상단 색띠 + 제목 -->
  <rect width="1080" height="210" fill="#1B5FA6"/>
  <rect x="0" y="210" width="1080" height="8" fill="#E23B3B"/>
  <text x="60" y="105" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">물놀이 사고 통계 (최근 5년)</text>
  <text x="60" y="165" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="36" fill="#E8EEF5">사망자 104명 · 장소별 / 원인별</text>

  <!-- 섹션: 장소별 -->
  <text x="60" y="308" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="44" fill="#1B5FA6">■ 사고 장소별</text>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="44">
    <rect x="60" y="330" width="960" height="96" rx="14" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="96" y="390" font-weight="bold" fill="#1a1a1a">하천(강)</text>
    <text x="1000" y="390" font-weight="bold" fill="#1B5FA6" text-anchor="end">32명 · 31%</text>

    <rect x="60" y="438" width="960" height="96" rx="14" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="96" y="498" font-weight="bold" fill="#1a1a1a">계곡</text>
    <text x="1000" y="498" font-weight="bold" fill="#1B5FA6" text-anchor="end">28명 · 27%</text>

    <rect x="60" y="546" width="960" height="96" rx="14" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="96" y="606" font-weight="bold" fill="#1a1a1a">해수욕장</text>
    <text x="1000" y="606" font-weight="bold" fill="#1B5FA6" text-anchor="end">24명 · 23%</text>

    <rect x="60" y="654" width="960" height="96" rx="14" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="96" y="714" font-weight="bold" fill="#1a1a1a">바닷가</text>
    <text x="1000" y="714" font-weight="bold" fill="#1B5FA6" text-anchor="end">20명 · 19%</text>
  </g>

  <!-- 섹션: 원인별 -->
  <text x="60" y="828" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="44" fill="#E23B3B">■ 사고 원인별</text>
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="44">
    <rect x="60" y="850" width="960" height="96" rx="14" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="96" y="910" font-weight="bold" fill="#1a1a1a">수영 미숙</text>
    <text x="1000" y="910" font-weight="bold" fill="#E23B3B" text-anchor="end">42명 · 40%</text>

    <rect x="60" y="958" width="960" height="96" rx="14" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="96" y="1018" font-weight="bold" fill="#1a1a1a">안전 부주의</text>
    <text x="1000" y="1018" font-weight="bold" fill="#E23B3B" text-anchor="end">32명 · 31%</text>

    <rect x="60" y="1066" width="960" height="96" rx="14" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="96" y="1126" font-weight="bold" fill="#1a1a1a">음주 수영</text>
    <text x="1000" y="1126" font-weight="bold" fill="#E23B3B" text-anchor="end">15명 · 14%</text>

    <rect x="60" y="1174" width="960" height="96" rx="14" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="96" y="1234" font-weight="bold" fill="#1a1a1a">높은 파도·급류</text>
    <text x="1000" y="1234" font-weight="bold" fill="#E23B3B" text-anchor="end">9명 · 9%</text>
  </g>

  <!-- 하단 출처 띠 -->
  <rect x="0" y="1290" width="1080" height="60" fill="#E8EEF5"/>
  <text x="60" y="1330" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#5B6B7C">출처: 행정안전부 2026.7.26 발표 (2021~2025)</text>
</svg>
