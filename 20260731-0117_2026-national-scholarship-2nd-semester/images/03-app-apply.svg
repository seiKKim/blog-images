<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <!-- 상단 색띠 + 제목 -->
  <rect width="1080" height="200" fill="#1B5FA6"/>
  <rect x="60" y="52" rx="30" ry="30" width="185" height="60" fill="#FFD23F"/>
  <text x="152" y="94" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#154C86" text-anchor="middle">신청방법</text>
  <text x="275" y="98" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="54" fill="#ffffff">앱·홈페이지 통합신청</text>
  <text x="60" y="168" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="36" fill="#E8EEF5">한국장학재단 앱 또는 www.kosaf.go.kr</text>

  <!-- 왼쪽: 스마트폰 목업 -->
  <g>
    <rect x="90" y="280" width="380" height="760" rx="48" fill="#243B6B"/>
    <rect x="108" y="298" width="344" height="724" rx="34" fill="#ffffff"/>
    <!-- 상태바 -->
    <rect x="108" y="298" width="344" height="70" rx="34" fill="#1B5FA6"/>
    <rect x="108" y="340" width="344" height="28" fill="#1B5FA6"/>
    <text x="280" y="344" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
          font-size="30" fill="#ffffff" text-anchor="middle">한국장학재단</text>
    <!-- 메뉴 헤더 -->
    <text x="140" y="428" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
          font-size="34" fill="#1a1a1a">통합 신청</text>
    <line x1="140" y1="448" x2="420" y2="448" stroke="#E0E7EF" stroke-width="2"/>
    <!-- 강조 메뉴 항목 -->
    <rect x="140" y="470" width="280" height="86" rx="14" fill="#EAF1F9" stroke="#1B5FA6" stroke-width="2"/>
    <circle cx="176" cy="513" r="14" fill="#1B5FA6"/>
    <text x="204" y="524" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
          font-size="30" fill="#1B5FA6">국가장학금</text>
    <!-- 일반 항목 -->
    <rect x="140" y="572" width="280" height="76" rx="14" fill="#F4F7FB"/>
    <text x="164" y="620" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" fill="#5B6B7C">학자금 대출</text>
    <rect x="140" y="664" width="280" height="76" rx="14" fill="#F4F7FB"/>
    <text x="164" y="712" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="28" fill="#5B6B7C">근로장학금</text>
    <!-- 신청 버튼 -->
    <rect x="140" y="900" width="280" height="86" rx="16" fill="#1B5FA6"/>
    <text x="280" y="953" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
          font-size="34" fill="#ffffff" text-anchor="middle">신청하기</text>
  </g>

  <!-- 오른쪽: 절차 5단계 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <g>
      <circle cx="560" cy="330" r="30" fill="#1B5FA6"/>
      <text x="560" y="343" font-weight="bold" font-size="34" fill="#ffffff" text-anchor="middle">1</text>
      <text x="608" y="343" font-weight="bold" font-size="38" fill="#1a1a1a">통합신청 메뉴 접속</text>
    </g>
    <g>
      <circle cx="560" cy="470" r="30" fill="#1B5FA6"/>
      <text x="560" y="483" font-weight="bold" font-size="34" fill="#ffffff" text-anchor="middle">2</text>
      <text x="608" y="483" font-weight="bold" font-size="38" fill="#1a1a1a">본인 인증</text>
      <text x="608" y="524" font-size="28" fill="#5B6B7C">공동·금융·간편인증 택1</text>
    </g>
    <g>
      <circle cx="560" cy="640" r="30" fill="#E8722C"/>
      <text x="560" y="653" font-weight="bold" font-size="34" fill="#ffffff" text-anchor="middle">3</text>
      <text x="608" y="653" font-weight="bold" font-size="38" fill="#1a1a1a">가구원 정보제공 동의</text>
      <text x="608" y="694" font-size="28" fill="#E8722C" font-weight="bold">안 하면 소득조사 불가!</text>
    </g>
    <g>
      <circle cx="560" cy="810" r="30" fill="#1B5FA6"/>
      <text x="560" y="823" font-weight="bold" font-size="34" fill="#ffffff" text-anchor="middle">4</text>
      <text x="608" y="823" font-weight="bold" font-size="38" fill="#1a1a1a">서류 제출</text>
      <text x="608" y="864" font-size="28" fill="#5B6B7C">가족관계증명서(상세) 등</text>
    </g>
    <g>
      <circle cx="560" cy="980" r="30" fill="#1B5FA6"/>
      <text x="560" y="993" font-weight="bold" font-size="34" fill="#ffffff" text-anchor="middle">5</text>
      <text x="608" y="993" font-weight="bold" font-size="38" fill="#1a1a1a">지원구간 산정</text>
      <text x="608" y="1034" font-size="28" fill="#5B6B7C">소득·재산 조사 후 확정</text>
    </g>
  </g>

  <!-- 하단 안내 -->
  <rect x="60" y="1088" width="960" height="150" rx="16" fill="#EAF1F9" stroke="#C6D3E0"/>
  <text x="90" y="1150" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="36" fill="#154C86">신청 버튼만 누르면 끝이 아닙니다</text>
  <text x="90" y="1200" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#1a1a1a">가구원 동의·서류 제출까지 마감 안에 끝내야 심사 진행</text>

  <!-- 하단 출처 띠 -->
  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#5B6B7C">신청: www.kosaf.go.kr · 앱 "한국장학재단" (화면은 이해를 돕는 예시)</text>
</svg>
