<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B5FA6"/>
      <stop offset="1" stop-color="#154C86"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- 장식 도형 -->
  <circle cx="950" cy="170" r="270" fill="#ffffff" opacity="0.07"/>
  <circle cx="110" cy="990" r="210" fill="#ffffff" opacity="0.05"/>

  <!-- 카테고리 뱃지 -->
  <rect x="80" y="88" rx="34" ry="34" width="220" height="68" fill="#FFD23F"/>
  <text x="190" y="134" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="36" fill="#154C86" text-anchor="middle">정부지원금</text>
  <!-- 연도 태그 -->
  <rect x="316" y="88" rx="34" ry="34" width="230" height="68" fill="#ffffff" opacity="0.16"/>
  <text x="431" y="134" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#ffffff" text-anchor="middle">2026 2학기</text>

  <!-- 서브 카피 -->
  <text x="80" y="300" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="66" fill="#E8EEF5">국가장학금 2차 신청</text>

  <!-- 메인 카피 -->
  <text x="80" y="470" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="96" fill="#ffffff">소득 구간별</text>
  <text x="80" y="620" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="150" fill="#FFD23F">최대 600만원</text>
  <text x="80" y="700" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="48" fill="#E8EEF5">(1유형·1~3구간 연간 최대)</text>

  <!-- 디테일 박스 -->
  <rect x="80" y="770" rx="20" ry="20" width="920" height="150" fill="#ffffff" opacity="0.14"/>
  <text x="112" y="838" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="50" fill="#ffffff">8/12 신청 시작 (유력) · 9구간 이하</text>
  <text x="112" y="896" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="42" fill="#FFD23F">놓치면 후지급! 대상·금액·서류 총정리</text>

  <!-- 채널 표시 -->
  <text x="80" y="1005" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="34" fill="#E8EEF5" opacity="0.9">신청 전 한국장학재단(kosaf.go.kr) 공식 공지 확인</text>
</svg>
