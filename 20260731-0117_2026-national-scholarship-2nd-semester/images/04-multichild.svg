<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <!-- 상단 색띠 + 제목 -->
  <rect width="1080" height="200" fill="#1B5FA6"/>
  <rect x="60" y="52" rx="30" ry="30" width="215" height="60" fill="#FFD23F"/>
  <text x="167" y="94" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#154C86" text-anchor="middle">2026 확대</text>
  <text x="305" y="98" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="54" fill="#ffffff">다자녀 국가장학금</text>
  <text x="60" y="168" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="36" fill="#E8EEF5">자녀 3명 이상 가구 · 미혼 대학생 · 9구간 이하</text>

  <!-- 강조 배너 -->
  <rect x="60" y="250" width="960" height="180" rx="20" fill="#E8722C"/>
  <text x="540" y="330" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="48" fill="#ffffff" text-anchor="middle">셋째 이상, 8구간까지</text>
  <text x="540" y="400" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="66" fill="#FFD23F" text-anchor="middle">등록금 전액 (유력)</text>

  <!-- 표 -->
  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <!-- 헤더 -->
    <rect x="60" y="470" width="600" height="80" rx="12" fill="#1B5FA6"/>
    <rect x="672" y="470" width="348" height="80" rx="12" fill="#1B5FA6"/>
    <text x="90" y="522" font-weight="bold" font-size="34" fill="#ffffff">구분 / 소득구간</text>
    <text x="846" y="522" font-weight="bold" font-size="34" fill="#ffffff" text-anchor="middle">지원금액</text>

    <!-- 행 1 -->
    <rect x="60" y="562" width="600" height="96" rx="12" fill="#ffffff" stroke="#D6E0EC"/>
    <rect x="672" y="562" width="348" height="96" rx="12" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="90" y="620" font-weight="bold" font-size="36" fill="#1a1a1a">첫째·둘째 · 1~3구간</text>
    <text x="846" y="620" font-weight="bold" font-size="38" fill="#1B5FA6" text-anchor="middle">610만원</text>

    <!-- 행 2 -->
    <rect x="60" y="670" width="600" height="96" rx="12" fill="#ffffff" stroke="#D6E0EC"/>
    <rect x="672" y="670" width="348" height="96" rx="12" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="90" y="728" font-weight="bold" font-size="36" fill="#1a1a1a">첫째·둘째 · 4~6구간</text>
    <text x="846" y="728" font-weight="bold" font-size="38" fill="#1B5FA6" text-anchor="middle">505만원</text>

    <!-- 행 3 -->
    <rect x="60" y="778" width="600" height="96" rx="12" fill="#ffffff" stroke="#D6E0EC"/>
    <rect x="672" y="778" width="348" height="96" rx="12" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="90" y="836" font-weight="bold" font-size="36" fill="#1a1a1a">첫째·둘째 · 7~8구간</text>
    <text x="846" y="836" font-weight="bold" font-size="38" fill="#1B5FA6" text-anchor="middle">465만원</text>

    <!-- 행 4 (강조) -->
    <rect x="60" y="886" width="600" height="96" rx="12" fill="#FDF0E4" stroke="#E8722C" stroke-width="2"/>
    <rect x="672" y="886" width="348" height="96" rx="12" fill="#FDF0E4" stroke="#E8722C" stroke-width="2"/>
    <text x="90" y="944" font-weight="bold" font-size="36" fill="#1a1a1a">셋째 이상 · 1~8구간</text>
    <text x="846" y="944" font-weight="bold" font-size="38" fill="#E8722C" text-anchor="middle">등록금 전액</text>

    <!-- 행 5 -->
    <rect x="60" y="994" width="600" height="96" rx="12" fill="#ffffff" stroke="#D6E0EC"/>
    <rect x="672" y="994" width="348" height="96" rx="12" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="90" y="1052" font-weight="bold" font-size="36" fill="#1a1a1a">셋째 이상 · 9구간</text>
    <text x="846" y="1052" font-weight="bold" font-size="38" fill="#1B5FA6" text-anchor="middle">200만원</text>
  </g>

  <!-- 안내 -->
  <rect x="60" y="1122" width="960" height="120" rx="16" fill="#EAF1F9" stroke="#C6D3E0"/>
  <text x="90" y="1178" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#154C86">가족관계증명서(상세) 제출 필수</text>
  <text x="90" y="1222" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" fill="#1a1a1a">누락 시 다자녀 지원 불가</text>

  <!-- 하단 출처 띠 -->
  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="30" fill="#5B6B7C">금액은 매체 정리 기준(유력) · 한국장학재단(kosaf.go.kr) 공식 공지 확인</text>
</svg>
