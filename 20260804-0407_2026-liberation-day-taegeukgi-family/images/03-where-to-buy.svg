<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F7F1F3"/>
  <rect width="1080" height="200" fill="#E0556E"/>
  <text x="60" y="128" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">태극기 어디서 사나요?</text>

  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <!-- 카드 1 주민센터 -->
    <rect x="60" y="270" width="960" height="200" rx="20" fill="#ffffff" stroke="#E6D3D8" stroke-width="2"/>
    <rect x="60" y="270" width="14" height="200" rx="7" fill="#C60C30"/>
    <circle cx="160" cy="370" r="46" fill="#FCE7EC"/>
    <text x="160" y="388" font-size="52" text-anchor="middle">🏢</text>
    <text x="245" y="352" font-weight="bold" font-size="46" fill="#1a1a1a">주민센터(행정복지센터)</text>
    <text x="245" y="418" font-size="36" fill="#5B6B7C">시·군·구청, 읍·면·동 민원실·구내매점</text>

    <!-- 카드 2 우체국 -->
    <rect x="60" y="500" width="960" height="200" rx="20" fill="#ffffff" stroke="#E6D3D8" stroke-width="2"/>
    <rect x="60" y="500" width="14" height="200" rx="7" fill="#003478"/>
    <circle cx="160" cy="600" r="46" fill="#E4EBF6"/>
    <text x="160" y="618" font-size="52" text-anchor="middle">📮</text>
    <text x="245" y="582" font-weight="bold" font-size="46" fill="#1a1a1a">우체국</text>
    <text x="245" y="648" font-size="36" fill="#5B6B7C">가까운 우체국, 인터넷우체국 우체국쇼핑</text>

    <!-- 카드 3 온라인 -->
    <rect x="60" y="730" width="960" height="200" rx="20" fill="#ffffff" stroke="#E6D3D8" stroke-width="2"/>
    <rect x="60" y="730" width="14" height="200" rx="7" fill="#E0556E"/>
    <circle cx="160" cy="830" r="46" fill="#FCE7EC"/>
    <text x="160" y="848" font-size="52" text-anchor="middle">🛒</text>
    <text x="245" y="812" font-weight="bold" font-size="46" fill="#1a1a1a">온라인</text>
    <text x="245" y="878" font-size="36" fill="#5B6B7C">인터넷 태극기 판매업체 (배송 여유 있게)</text>

    <!-- 카드 4 상업시설 -->
    <rect x="60" y="960" width="960" height="200" rx="20" fill="#ffffff" stroke="#E6D3D8" stroke-width="2"/>
    <rect x="60" y="960" width="14" height="200" rx="7" fill="#E8722C"/>
    <circle cx="160" cy="1060" r="46" fill="#FBEADA"/>
    <text x="160" y="1078" font-size="52" text-anchor="middle">🏬</text>
    <text x="245" y="1042" font-weight="bold" font-size="46" fill="#1a1a1a">상업시설</text>
    <text x="245" y="1108" font-size="36" fill="#5B6B7C">백화점·편의점·문구점·마트 등</text>
  </g>

  <rect x="60" y="1195" width="960" height="60" rx="14" fill="#FFF3D6"/>
  <text x="540" y="1236" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#B8860B" text-anchor="middle">연휴 직전엔 배송이 몰릴 수 있어요 · 미리 주문 권장</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#EFE3E7"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#7A5B65">태극기 구입처 안내</text>
</svg>
