  <rect x="60" y="1060" width="960" height="150" rx="18" fill="#FFF3D6" stroke="#FFD23F" stroke-width="2"/>
  <text x="540" y="1120" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="38" fill="#B8860B" text-anchor="middle">광복절 당일 특별운영·무료 여부는 유동적!</text>
  <text x="540" y="1175" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="38" fill="#B8860B" text-anchor="middle">방문 전 각 기관 공식 홈페이지·전화로 재확인</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#EFE3E7"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#7A5B65">각 기관·서울시 공식 자료 기준</text>
</svg>
