<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="220" fill="#2B2F36"/>
  <rect x="60" y="60" rx="26" ry="26" width="200" height="56" fill="#E23B3B"/>
  <text x="160" y="98" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="30" fill="#ffffff" text-anchor="middle">오늘의 이슈</text>
  <text x="60" y="182" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">고유가 피해지원금 지역별 지급액</text>

  <text x="60" y="285" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="38" fill="#5B6B7C">2차(소득하위 70% 일반) 기준</text>

  <g font-family="Noto Sans KR, Malgun Gothic, sans-serif">
    <rect x="60" y="320" width="960" height="130" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="100" y="402" font-size="46" font-weight="bold" fill="#1a1a1a">수도권</text>
    <text x="1000" y="402" font-size="52" font-weight="bold" fill="#2B2F36" text-anchor="end">10만 원</text>

    <rect x="60" y="470" width="960" height="130" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="100" y="552" font-size="46" font-weight="bold" fill="#1a1a1a">비수도권</text>
    <text x="1000" y="552" font-size="52" font-weight="bold" fill="#2B2F36" text-anchor="end">15만 원</text>

    <rect x="60" y="620" width="960" height="130" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
    <text x="100" y="702" font-size="46" font-weight="bold" fill="#1a1a1a">인구감소 우대지원지역</text>
    <text x="1000" y="702" font-size="52" font-weight="bold" fill="#2B2F36" text-anchor="end">20만 원</text>

    <rect x="60" y="770" width="960" height="130" rx="16" fill="#FFF2F2" stroke="#E23B3B" stroke-width="2"/>
    <text x="100" y="852" font-size="46" font-weight="bold" fill="#1a1a1a">인구감소 특별지원지역</text>
    <text x="1000" y="852" font-size="56" font-weight="bold" fill="#E23B3B" text-anchor="end">25만 원</text>
  </g>

  <rect x="60" y="950" width="960" height="230" rx="16" fill="#2B2F36"/>
  <text x="100" y="1030" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="44" fill="#FFD23F">일반 기준 최소 10만 ~ 최대 25만 원</text>
  <text x="100" y="1095" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="36" fill="#E8EEF5">취약계층은 보도 기준 최대 60만 원 언급</text>
  <text x="100" y="1145" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="32" fill="#B9C4D0">본인 지급액은 카드사·지자체 안내로 확인</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" fill="#5B6B7C">출처: 행정안전부 발표 기준</text>
</svg>
