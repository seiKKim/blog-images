<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="220" fill="#2B2F36"/>
  <rect x="60" y="60" rx="26" ry="26" width="200" height="56" fill="#E23B3B"/>
  <text x="160" y="98" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="30" fill="#ffffff" text-anchor="middle">오늘의 이슈</text>
  <text x="60" y="182" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">먼저 내 지원금 잔액부터 확인</text>

  <!-- 스마트폰 목업 -->
  <rect x="330" y="300" width="420" height="720" rx="48" fill="#2B2F36"/>
  <rect x="352" y="330" width="376" height="660" rx="24" fill="#ffffff"/>
  <!-- 앱 상단바 -->
  <rect x="352" y="330" width="376" height="90" rx="24" fill="#E23B3B"/>
  <rect x="352" y="380" width="376" height="40" fill="#E23B3B"/>
  <text x="540" y="392" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#ffffff" text-anchor="middle">카드사 앱</text>
  <!-- 잔액 카드 -->
  <rect x="382" y="450" width="316" height="200" rx="20" fill="#F4F7FB" stroke="#D6E0EC"/>
  <text x="540" y="510" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="30" fill="#5B6B7C" text-anchor="middle">지원금 잔액</text>
  <text x="540" y="580" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="56" fill="#E23B3B" text-anchor="middle">조회하기</text>
  <text x="540" y="625" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="26" fill="#9AA7B5" text-anchor="middle">남은 금액 확인</text>
  <!-- 목록 라인 -->
  <rect x="382" y="690" width="316" height="14" rx="7" fill="#E1E8F0"/>
  <rect x="382" y="730" width="240" height="14" rx="7" fill="#E1E8F0"/>
  <rect x="382" y="810" width="316" height="60" rx="14" fill="#2B2F36"/>
  <text x="540" y="850" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="28" fill="#ffffff" text-anchor="middle">사용 내역 보기</text>
  <rect x="382" y="900" width="316" height="14" rx="7" fill="#E1E8F0"/>
  <rect x="382" y="940" width="200" height="14" rx="7" fill="#E1E8F0"/>

  <!-- 안내 박스 -->
  <rect x="60" y="1080" width="960" height="120" rx="16" fill="#FFF2F2" stroke="#E23B3B" stroke-width="2"/>
  <text x="540" y="1132" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="42" fill="#E23B3B" text-anchor="middle">8월 31일 지나면 남은 돈 그대로 소멸</text>
  <text x="540" y="1180" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="32" fill="#5B6B7C" text-anchor="middle">카드 충전분은 카드사 앱 · 상품권은 해당 앱에서 조회</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" fill="#5B6B7C">※ 실제 앱 화면이 아닌 안내용 예시 이미지</text>
</svg>
