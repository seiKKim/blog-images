<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="220" fill="#2B2F36"/>
  <rect x="60" y="60" rx="26" ry="26" width="200" height="56" fill="#E23B3B"/>
  <text x="160" y="98" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="30" fill="#ffffff" text-anchor="middle">오늘의 이슈</text>
  <text x="60" y="182" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">8월 발전용 가스요금 10.7% 인상</text>

  <text x="60" y="300" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="38" fill="#5B6B7C">발전용 가스요금 (GJ당)</text>

  <!-- 막대 그래프 -->
  <!-- 7월 막대 -->
  <rect x="180" y="620" width="220" height="380" rx="12" fill="#9AA7B5"/>
  <text x="290" y="590" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="46" fill="#2B2F36" text-anchor="middle">2만 522원</text>
  <text x="290" y="1055" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="44" fill="#2B2F36" text-anchor="middle">7월</text>

  <!-- 8월 막대 -->
  <rect x="680" y="500" width="220" height="500" rx="12" fill="#E23B3B"/>
  <text x="790" y="470" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="46" fill="#E23B3B" text-anchor="middle">2만 2,726원</text>
  <text x="790" y="1055" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="44" fill="#E23B3B" text-anchor="middle">8월</text>

  <!-- 기준선 -->
  <line x1="120" y1="1000" x2="960" y2="1000" stroke="#D6E0EC" stroke-width="3"/>

  <!-- 증가 배지 -->
  <rect x="380" y="360" width="320" height="90" rx="45" fill="#2B2F36"/>
  <text x="540" y="420" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="48" fill="#FFD23F" text-anchor="middle">+2,204원 ▲</text>

  <!-- 하단 요약 -->
  <rect x="60" y="1090" width="960" height="110" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
  <text x="540" y="1140" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="40" fill="#1a1a1a" text-anchor="middle">전월 대비 +10.7% · 올해 월간 최대 인상폭</text>
  <text x="540" y="1185" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="34" fill="#E23B3B" text-anchor="middle">단, 주택용 도시가스 소매요금은 8월 동결</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" fill="#5B6B7C">출처: 에너지경제신문 보도(2026-07-29)</text>
</svg>
