<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="220" fill="#2B2F36"/>
  <rect x="60" y="60" rx="26" ry="26" width="200" height="56" fill="#E23B3B"/>
  <text x="160" y="98" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="30" fill="#ffffff" text-anchor="middle">오늘의 이슈</text>
  <text x="60" y="182" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">노란우산공제 납입한도 확대</text>

  <text x="60" y="300" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="38" fill="#5B6B7C">2026년 7월 1일 이후 납입분부터</text>

  <!-- BEFORE 카드 -->
  <rect x="60" y="360" width="440" height="440" rx="24" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
  <text x="280" y="440" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="42" fill="#9AA7B5" text-anchor="middle">이전</text>
  <line x1="120" y1="480" x2="440" y2="480" stroke="#E1E8F0" stroke-width="2"/>
  <text x="280" y="590" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="66" fill="#5B6B7C" text-anchor="middle">분기별</text>
  <text x="280" y="680" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="80" fill="#2B2F36" text-anchor="middle">300만 원</text>

  <!-- 화살표 -->
  <text x="540" y="605" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="90" fill="#E23B3B" text-anchor="middle">→</text>

  <!-- AFTER 카드 -->
  <rect x="580" y="360" width="440" height="440" rx="24" fill="#FFF2F2" stroke="#E23B3B" stroke-width="3"/>
  <text x="800" y="440" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="42" fill="#E23B3B" text-anchor="middle">확대</text>
  <line x1="640" y1="480" x2="960" y2="480" stroke="#F3C6C6" stroke-width="2"/>
  <text x="800" y="590" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="66" fill="#E23B3B" text-anchor="middle">연</text>
  <text x="800" y="680" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="80" fill="#E23B3B" text-anchor="middle">1,800만 원</text>

  <!-- 소득공제 안내 -->
  <rect x="60" y="860" width="960" height="300" rx="16" fill="#2B2F36"/>
  <text x="100" y="940" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="44" fill="#FFD23F">소득공제 한도</text>
  <text x="100" y="1015" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="52" fill="#ffffff">사업소득금액에 따라 200만~600만 원</text>
  <text x="100" y="1090" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="36" fill="#B9C4D0">7월 1일 시행분이 8월에도 계속 적용</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" fill="#5B6B7C">출처: 정책브리핑 '2026년 하반기 이렇게 달라집니다'</text>
</svg>
