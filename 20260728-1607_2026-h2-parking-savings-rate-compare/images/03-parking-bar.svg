<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <rect width="1080" height="720" fill="#F4F7FB"/>
  <rect width="1080" height="150" fill="#243B6B"/>
  <text x="60" y="95" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="50" fill="#ffffff">인터넷은행 파킹통장 최고금리</text>

  <!-- 기준선 (y 600 = 0%, 스케일: 100px = 1%p, 600 - value*100) -->
  <!-- 토스 3.5% -> 250, 케이뱅크 3.0% -> 300, 카카오 2.0% -> 400 -->
  <line x1="120" y1="600" x2="1000" y2="600" stroke="#D6E0EC" stroke-width="2"/>

  <!-- 토스뱅크 3.5% -->
  <rect x="180" y="250" width="180" height="350" rx="10" fill="#243B6B"/>
  <text x="270" y="215" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="52" fill="#243B6B" text-anchor="middle">3.5%</text>
  <text x="270" y="655" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="36" fill="#1a1a1a" text-anchor="middle">토스뱅크</text>
  <text x="270" y="695" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="28" fill="#5B6B7C" text-anchor="middle">우대조건 없음</text>

  <!-- 케이뱅크 3.0% -->
  <rect x="450" y="300" width="180" height="300" rx="10" fill="#4A6295"/>
  <text x="540" y="265" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="52" fill="#243B6B" text-anchor="middle">3.0%</text>
  <text x="540" y="655" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="36" fill="#1a1a1a" text-anchor="middle">케이뱅크</text>
  <text x="540" y="695" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="28" fill="#5B6B7C" text-anchor="middle">우대조건 충족 시</text>

  <!-- 카카오 2.0% -->
  <rect x="720" y="400" width="180" height="200" rx="10" fill="#8494B3"/>
  <text x="810" y="365" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="52" fill="#243B6B" text-anchor="middle">2.0%</text>
  <text x="810" y="655" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="36" fill="#1a1a1a" text-anchor="middle">카카오뱅크</text>
  <text x="810" y="695" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="28" fill="#5B6B7C" text-anchor="middle">별도 우대 없음</text>

  <text x="1020" y="145" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="26" fill="#E8EEF5" text-anchor="end">2026년 1분기 공시 기준</text>
</svg>
