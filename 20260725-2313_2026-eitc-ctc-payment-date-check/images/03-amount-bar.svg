<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="200" fill="#1F8A53"/>
  <text x="60" y="105" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">가구별 최대 지급액</text>
  <text x="60" y="165" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="38" fill="#E8EEF5">근로장려금 · 자녀장려금</text>

  <!-- 근로장려금 섹션 -->
  <text x="60" y="300" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="42" fill="#1F8A53">■ 근로장려금 (가구 유형별 최대)</text>

  <!-- 단독 165 (width scale: 330만 = 720px) -->
  <text x="60" y="392" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="40" fill="#1a1a1a">단독가구</text>
  <rect x="290" y="360" width="360" height="60" rx="10" fill="#7CC69C"/>
  <text x="670" y="405" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="42" fill="#1F8A53">165만원</text>

  <!-- 홑벌이 285 -->
  <text x="60" y="502" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="40" fill="#1a1a1a">홑벌이가구</text>
  <rect x="290" y="470" width="622" height="60" rx="10" fill="#3FA871"/>
  <text x="620" y="513" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="42" fill="#ffffff">285만원</text>

  <!-- 맞벌이 330 -->
  <text x="60" y="612" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="40" fill="#1a1a1a">맞벌이가구</text>
  <rect x="290" y="580" width="720" height="60" rx="10" fill="#1F8A53"/>
  <text x="700" y="623" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="42" fill="#ffffff">330만원</text>

  <!-- 구분선 -->
  <line x1="60" y1="700" x2="1020" y2="700" stroke="#D6E0EC" stroke-width="2"/>

  <!-- 자녀장려금 섹션 -->
  <text x="60" y="790" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="42" fill="#E8722C">■ 자녀장려금 (자녀 1명당)</text>

  <rect x="60" y="830" width="960" height="150" rx="20" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
  <text x="540" y="905" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="66" fill="#E8722C" text-anchor="middle">자녀당 50만 ~ 100만원</text>
  <text x="540" y="955" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal" font-size="34" fill="#5B6B7C" text-anchor="middle">소득 낮을수록 자녀당 100만원까지 차등 지급</text>

  <!-- 자녀 수 예시 -->
  <rect x="60" y="1010" width="300" height="130" rx="16" fill="#FDF0E6"/>
  <text x="210" y="1065" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="38" fill="#1a1a1a" text-anchor="middle">자녀 2명</text>
  <text x="210" y="1115" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="40" fill="#E8722C" text-anchor="middle">최대 200만원</text>

  <rect x="390" y="1010" width="300" height="130" rx="16" fill="#FDF0E6"/>
  <text x="540" y="1065" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="38" fill="#1a1a1a" text-anchor="middle">자녀 3명</text>
  <text x="540" y="1115" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="40" fill="#E8722C" text-anchor="middle">최대 300만원</text>

  <rect x="720" y="1010" width="300" height="130" rx="16" fill="#E9F5EE"/>
  <text x="870" y="1065" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="38" fill="#1a1a1a" text-anchor="middle">근로+자녀</text>
  <text x="870" y="1115" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold" font-size="34" fill="#1F8A53" text-anchor="middle">별도 지급</text>

  <text x="60" y="1210" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal" font-size="32" fill="#5B6B7C">※ 위 금액은 각 유형의 최대치이며, 소득이 낮을수록 지급액이 커집니다.</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="34" fill="#5B6B7C">출처: 국세청 근로·자녀장려금 안내 (2026년 기준)</text>
</svg>
