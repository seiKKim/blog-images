<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <rect width="1080" height="720" fill="#F4F7FB"/>
  <rect width="1080" height="150" fill="#1F8A53"/>
  <text x="60" y="98" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#ffffff">정기신청분 지급일</text>

  <!-- 달력 카드 -->
  <rect x="60" y="210" width="440" height="420" rx="24" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
  <rect x="60" y="210" width="440" height="90" rx="24" fill="#1F8A53"/>
  <rect x="60" y="270" width="440" height="30" fill="#1F8A53"/>
  <text x="280" y="272" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="42" fill="#ffffff" text-anchor="middle">2026년 8월</text>
  <!-- 강조 날짜 -->
  <text x="280" y="450" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="180" fill="#1F8A53" text-anchor="middle">27</text>
  <text x="280" y="540" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="44" fill="#1a1a1a" text-anchor="middle">목요일 · 입금</text>
  <rect x="130" y="575" width="300" height="10" rx="5" fill="#FFD23F"/>

  <!-- 설명 -->
  <text x="560" y="290" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="46" fill="#1a1a1a">추석 전 조기 지급</text>
  <rect x="560" y="330" width="460" height="110" rx="16" fill="#ffffff" stroke="#D6E0EC"/>
  <text x="585" y="378" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#5B6B7C">법정 지급기한</text>
  <text x="585" y="420" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="40" fill="#1a1a1a">9월 30일 (9월 말)</text>
  <rect x="560" y="460" width="460" height="110" rx="16" fill="#E9F5EE" stroke="#1F8A53"/>
  <text x="585" y="508" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="34" fill="#1F8A53">조기 지급일</text>
  <text x="585" y="550" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="40" fill="#1F8A53">8월 27일 · 한 달 이상 단축</text>

  <rect x="0" y="640" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="692" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="32" fill="#5B6B7C">정기신청(2026.5.1.~6.1.) 심사 후 지급 · 국세청 안내 기준</text>
</svg>
