  <text x="110" y="896" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="46" fill="#FFD23F">자녀장려금 자녀당 50~100만원</text>

  <!-- 채널 -->
  <text x="80" y="1010" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="normal"
        font-size="34" fill="#E8EEF5" opacity="0.9">얼마·언제·조회방법 총정리</text>
