<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#1F8A53"/>
  <circle cx="950" cy="180" r="260" fill="#ffffff" opacity="0.08"/>
  <circle cx="120" cy="980" r="200" fill="#ffffff" opacity="0.06"/>

  <!-- 카테고리 뱃지 -->
  <rect x="80" y="90" rx="34" ry="34" width="230" height="68" fill="#FFD23F"/>
  <text x="195" y="136" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="36" fill="#1a1a1a" text-anchor="middle">세금·환급</text>

  <!-- 서브 카피 -->
  <text x="80" y="288" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="56" fill="#E8EEF5">2026 근로·자녀장려금</text>
  <text x="80" y="356" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="56" fill="#E8EEF5">추석 전 조기지급 확정</text>

  <!-- 메인 카피 -->
  <text x="80" y="510" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="80" fill="#ffffff">정기신청분 지급일</text>
  <text x="80" y="670" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="150" fill="#FFD23F">8월 27일</text>

  <!-- 디테일 박스 -->
  <rect x="80" y="770" rx="20" ry="20" width="920" height="150" fill="#ffffff" opacity="0.14"/>
  <text x="110" y="838" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
