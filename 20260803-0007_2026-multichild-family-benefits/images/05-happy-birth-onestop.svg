<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="220" fill="#1B5FA6"/>
  <rect x="60" y="56" rx="30" ry="30" width="200" height="60" fill="#FFD23F"/>
  <text x="160" y="98" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="32" fill="#1a1a1a" text-anchor="middle">정부지원금</text>
  <text x="60" y="185" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">정부24 행복출산 원스톱</text>

  <text x="60" y="308" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="44" fill="#1B5FA6">출생신고 후 한 번에 일괄 신청</text>

  <!-- STEP 1 -->
  <rect x="60" y="360" width="960" height="200" rx="24" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
  <circle cx="160" cy="460" r="56" fill="#1B5FA6"/>
  <text x="160" y="480" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="56" fill="#ffffff" text-anchor="middle">1</text>
  <text x="260" y="440" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="48" fill="#1a1a1a">출생신고</text>
  <text x="260" y="506" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="38" fill="#5B6B7C">주민센터 또는 온라인으로 출생신고</text>

  <!-- STEP 2 -->
  <rect x="60" y="590" width="960" height="200" rx="24" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
  <circle cx="160" cy="690" r="56" fill="#1B5FA6"/>
  <text x="160" y="710" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="56" fill="#ffffff" text-anchor="middle">2</text>
  <text x="260" y="670" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="48" fill="#1a1a1a">정부24 행복출산 접속</text>
  <text x="260" y="736" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="38" fill="#5B6B7C">첫만남·부모급여·아동수당 일괄 신청</text>

  <!-- STEP 3 -->
  <rect x="60" y="820" width="960" height="200" rx="24" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
  <circle cx="160" cy="920" r="56" fill="#1B5FA6"/>
  <text x="160" y="940" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="56" fill="#ffffff" text-anchor="middle">3</text>
  <text x="260" y="900" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="48" fill="#1a1a1a">60일 이내 신청</text>
  <text x="260" y="966" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="38" fill="#5B6B7C">출생 후 60일 이내 신청 시 출생월부터 소급</text>

  <!-- 첫만남 강조 -->
  <rect x="60" y="1050" width="960" height="160" rx="24" fill="#FFF3D0"/>
  <text x="90" y="1112" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="42" fill="#8A6D1F">첫만남이용권</text>
  <text x="90" y="1170" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="42" fill="#1a1a1a">첫째 200만원 · 둘째 이상 300만원</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="32" fill="#5B6B7C">신청 채널·금액은 각 기관 공식 공지로 한 번 더 확인</text>
</svg>
