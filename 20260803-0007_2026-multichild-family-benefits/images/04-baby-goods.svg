<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720">
  <rect width="1080" height="720" fill="#1B5FA6"/>
  <circle cx="960" cy="120" r="220" fill="#ffffff" opacity="0.07"/>
  <circle cx="120" cy="640" r="170" fill="#ffffff" opacity="0.06"/>

  <rect x="60" y="56" rx="30" ry="30" width="200" height="60" fill="#FFD23F"/>
  <text x="160" y="98" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="32" fill="#1a1a1a" text-anchor="middle">정부지원금</text>

  <text x="60" y="210" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="64" fill="#ffffff">다자녀 가정 육아·생활용품</text>
  <text x="60" y="288" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="46" fill="#FFD23F">구매 전 최신 가격·후기 확인하기</text>

  <!-- 아이콘 3개 -->
  <!-- 카시트 -->
  <g transform="translate(120,380)">
    <rect x="0" y="0" width="200" height="240" rx="24" fill="#ffffff" opacity="0.14"/>
    <path d="M55 60 h70 a24 24 0 0 1 24 24 v70 a20 20 0 0 1 -20 20 h-40 l-30 30 v-30 h-4 a24 24 0 0 1 -24 -24 v-66 a24 24 0 0 1 24 -24 z" fill="#FFD23F"/>
    <rect x="70" y="95" width="60" height="16" rx="8" fill="#1B5FA6"/>
    <text x="100" y="215" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
          font-size="34" fill="#ffffff" text-anchor="middle">카시트</text>
  </g>
  <!-- 대용량 생필품 (박스) -->
  <g transform="translate(440,380)">
    <rect x="0" y="0" width="200" height="240" rx="24" fill="#ffffff" opacity="0.14"/>
    <rect x="46" y="60" width="108" height="90" rx="8" fill="#FFD23F"/>
    <path d="M46 60 l54 -26 l54 26 l-54 26 z" fill="#ffffff" opacity="0.85"/>
    <line x1="100" y1="86" x2="100" y2="150" stroke="#1B5FA6" stroke-width="6"/>
    <text x="100" y="215" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
          font-size="30" fill="#ffffff" text-anchor="middle">대용량 생필품</text>
  </g>
  <!-- 유아용품 (젖병) -->
  <g transform="translate(760,380)">
    <rect x="0" y="0" width="200" height="240" rx="24" fill="#ffffff" opacity="0.14"/>
    <rect x="78" y="40" width="44" height="24" rx="8" fill="#ffffff"/>
    <rect x="72" y="64" width="56" height="100" rx="16" fill="#FFD23F"/>
    <line x1="82" y1="92" x2="118" y2="92" stroke="#1B5FA6" stroke-width="5"/>
    <line x1="82" y1="112" x2="118" y2="112" stroke="#1B5FA6" stroke-width="5"/>
    <text x="100" y="215" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
          font-size="34" fill="#ffffff" text-anchor="middle">유아용품</text>
  </g>
