<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="220" fill="#1B5FA6"/>
  <rect x="60" y="56" rx="30" ry="30" width="200" height="60" fill="#FFD23F"/>
  <text x="160" y="98" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="32" fill="#1a1a1a" text-anchor="middle">정부지원금</text>
  <text x="60" y="185" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="60" fill="#ffffff">자동차 취득세 다자녀 감면</text>

  <!-- 2자녀 카드 -->
  <rect x="60" y="290" width="960" height="380" rx="24" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
  <rect x="60" y="290" width="960" height="96" rx="24" fill="#E8EEF5"/>
  <rect x="60" y="340" width="960" height="46" fill="#E8EEF5"/>
  <text x="100" y="352" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="48" fill="#1B5FA6">2자녀 (18세 미만)</text>
  <text x="100" y="480" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="88" fill="#1a1a1a">취득세 </text>
  <text x="420" y="480" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="88" fill="#1B5FA6">50% 경감</text>
  <text x="100" y="580" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="40" fill="#5B6B7C">그 밖의 승용차 140만원 이하 50% 경감,</text>
  <text x="100" y="632" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="40" fill="#5B6B7C">초과 시 70만원 공제</text>

  <!-- 3자녀 카드 -->
  <rect x="60" y="710" width="960" height="380" rx="24" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
  <rect x="60" y="710" width="960" height="96" rx="24" fill="#1B5FA6"/>
  <rect x="60" y="760" width="960" height="46" fill="#1B5FA6"/>
  <text x="100" y="772" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="48" fill="#ffffff">3자녀 이상</text>
  <text x="100" y="900" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="88" fill="#1a1a1a">취득세 </text>
  <text x="420" y="900" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="88" fill="#E23B3B">면제</text>
  <text x="100" y="1000" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="40" fill="#5B6B7C">140만원 이하 면제·초과분 140만원 공제,</text>
  <text x="100" y="1052" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="40" fill="#5B6B7C">세액 200만원 초과 시 85% 감면율</text>

  <!-- 기한 안내 -->
  <rect x="60" y="1130" width="960" height="80" rx="16" fill="#FFF3D0"/>
  <text x="540" y="1182" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="40" fill="#8A6D1F" text-anchor="middle">적용 기한: 2027년 12월 31일까지 취득·등록</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="32" fill="#5B6B7C">정확한 세액은 차종·구입가·관할 지자체 세무과 기준으로 확인</text>
</svg>
