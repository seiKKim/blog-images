<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F4F7FB"/>
  <rect width="1080" height="220" fill="#1B5FA6"/>
  <rect x="60" y="56" rx="30" ry="30" width="200" height="60" fill="#FFD23F"/>
  <text x="160" y="98" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="32" fill="#1a1a1a" text-anchor="middle">정부지원금</text>
  <text x="60" y="185" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="58" fill="#ffffff">고속도로 통행료 감면 시행일</text>

  <text x="60" y="300" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="42" fill="#1B5FA6">2026년 신규 시행 · 주말·공휴일 통행분</text>

  <!-- 타임라인 세로선 -->
  <line x1="150" y1="360" x2="150" y2="1080" stroke="#B9CBE0" stroke-width="6"/>

  <!-- 3자녀 노드 -->
  <circle cx="150" cy="440" r="26" fill="#E23B3B"/>
  <rect x="230" y="360" width="790" height="290" rx="24" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
  <text x="270" y="440" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="52" fill="#E23B3B">3자녀 이상</text>
  <text x="270" y="540" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="70" fill="#1a1a1a">2026년 7월 28일부터</text>
  <text x="270" y="612" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="56" fill="#1B5FA6">감면율 20%</text>

  <!-- 2자녀 노드 -->
  <circle cx="150" cy="800" r="26" fill="#1B5FA6"/>
  <rect x="230" y="720" width="790" height="290" rx="24" fill="#ffffff" stroke="#D6E0EC" stroke-width="2"/>
  <text x="270" y="800" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="52" fill="#1B5FA6">2자녀 (미성년)</text>
  <text x="270" y="900" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="70" fill="#1a1a1a">2026년 8월 22일부터</text>
  <text x="270" y="972" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="56" fill="#1B5FA6">감면율 10%</text>

  <!-- 하단 안내 -->
  <rect x="60" y="1090" width="960" height="120" rx="16" fill="#FFF3D0"/>
  <text x="90" y="1145" font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-weight="bold"
        font-size="38" fill="#8A6D1F">2029년 8월 21일까지 3년 한시 운영</text>
  <text x="90" y="1192" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="34" fill="#8A6D1F">한국도로공사 운영 고속도로 한정 (민자고속도로 제외)</text>

  <rect x="0" y="1270" width="1080" height="80" fill="#E8EEF5"/>
  <text x="60" y="1322" font-family="Noto Sans KR, Malgun Gothic, sans-serif"
        font-size="32" fill="#5B6B7C">등록 채널·서류는 한국도로공사 공식 공지(1588-2504)로 재확인</text>
</svg>
